    <main>
        <section class="portfolio" style="max-width:760px">
            <p><a href="wiki.html" style="color:var(--muted)">← 返回百科</a></p>
            <h1 class="section-title" id="art-title">加载中…</h1>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.min.js?v=20261010a"></script>
    <script>
    (function () {
        var slug = '';
        try { slug = new URLSearchParams(location.search).get('slug') || ''; } catch (e) {}
        var titleEl = document.getElementById('art-title');
        var metaEl = document.getElementById('art-meta');
        var bodyEl = document.getElementById('art-body');
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function md(t) {
            var parts = String(t || '').split(/```/);
            var html = '';
            parts.forEach(function (p, i) {
                if (i % 2 === 1) {
                    var lines = p.split('\n');
                    if (lines.length && /^\w+$/.test(lines[0].trim())) lines.shift();
                    html += '<pre><code>' + esc(lines.join('\n')) + '</code></pre>';
                } else {
                    html += esc(p)
                        .replace(/^### (.*)$/gm, '<h3>$1</h3>')
                        .replace(/^## (.*)$/gm, '<h2>$1</h2>')
                        .replace(/^# (.*)$/gm, '<h1>$1</h1>')
                        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                        .replace(/`(.+?)`/g, '<code>$1</code>')
                        .replace(/\n/g, '<br>');
                }
            });
            return html;
        }
        if (!slug) { titleEl.textContent = '词条不存在'; return; }
        document.getElementById('art-edit').href = 'wiki-edit.html?slug=' + encodeURIComponent(slug);
        sb.from('wiki_articles').select('*').eq('slug', slug).single()
            .then(function (r) {
                if (r.error || !r.data) throw new Error('not found');
                var a = r.data;
                titleEl.textContent = a.title;
                document.title = a.title + ' - MAXMZH百科';
                metaEl.textContent = a.category + ' · 更新于 ' + new Date(a.updated_at).toLocaleString();
                bodyEl.innerHTML = md(a.content);
            })
            .catch(function () { titleEl.textContent = '词条不存在'; bodyEl.innerHTML = '<p><a href="wiki.html">返回百科首页</a></p>'; });
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
</body>
