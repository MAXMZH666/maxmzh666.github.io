    <script>
    var rankTab = 'likes';
    var nameMap = {};

    function medal(i) {
        return i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '<span class="rank-num">' + (i + 1) + '</span>';
    }

    async function fillNames(ids) {
        var fresh = ids.filter(function (x) { return !nameMap[x]; });
        if (!fresh.length) return;
        try {
            var pr = await sb.from('profiles').select('id,username').in('id', fresh);
            (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
        } catch (e) {}
    }

    async function countLikes(ids) {
        var counts = {};
        if (!ids.length) return counts;
        try {
            var lr = await sb.from('likes').select('work_id').in('work_id', ids);
            (lr.data || []).forEach(function (l) { counts[l.work_id] = (counts[l.work_id] || 0) + 1; });
        } catch (e) {}
        return counts;
    }

    function workRow(w, i, stat) {
        var cover = w.cover_url
            ? '<img src="' + esc(w.cover_url) + '" alt="" loading="lazy">'
            : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
        return '<a class="rank-row" href="community-play.html?id=' + w.id + '">' +
            '<span class="rank-medal">' + medal(i) + '</span>' +
            '<span class="rank-thumb">' + cover + '</span>' +
            '<span class="rank-info"><b>' + esc(w.title) + '</b>' +
            '<span>' + esc(nameMap[w.author_id] || '未知') + ' · ' + typeBadge(workTypeOf(w)) + '</span></span>' +
            '<span class="rank-stat">' + stat + '</span></a>';
    }

    async function loadLikes() {
        var res = await sb.from('works').select('id,title,cover_url,author_id,work_type')
            .order('created_at', { ascending: false }).limit(100);
        if (res.error) throw res.error;
        var works = res.data || [];
        var counts = await countLikes(works.map(function (w) { return w.id; }));
        works.sort(function (a, b) { return (counts[b.id] || 0) - (counts[a.id] || 0); });
        await fillNames(works.map(function (w) { return w.author_id; }));
        return works.slice(0, 20).map(function (w, i) {
            return workRow(w, i, '❤ ' + (counts[w.id] || 0));
        });
    }

    async function loadViews() {
        var res = await sb.from('works').select('id,title,cover_url,author_id,work_type,views')
            .order('views', { ascending: false }).limit(20);
        if (res.error) throw res.error;
        var works = res.data || [];
        await fillNames(works.map(function (w) { return w.author_id; }));
        return works.map(function (w, i) {
            return workRow(w, i, '👁 ' + (w.views || 0));
        });
    }

    async function loadAuthors() {
        var results = await Promise.all([
            sb.from('profiles').select('id,username').limit(200),
            sb.from('follows').select('following_id'),
            sb.from('works').select('author_id')
        ]);
        if (results[0].error) throw results[0].error;
        var fans = {}, workN = {};
        (results[1].data || []).forEach(function (f) { fans[f.following_id] = (fans[f.following_id] || 0) + 1; });
        (results[2].data || []).forEach(function (w) { workN[w.author_id] = (workN[w.author_id] || 0) + 1; });
        var authors = (results[0].data || []).map(function (p) {
            return { id: p.id, username: p.username, fans: fans[p.id] || 0, works: workN[p.id] || 0 };
        });
        authors.sort(function (a, b) { return (b.fans - a.fans) || (b.works - a.works); });
        return authors.slice(0, 20).map(function (a, i) {
            return '<a class="rank-row" href="community-user.html?id=' + a.id + '">' +
                '<span class="rank-medal">' + medal(i) + '</span>' +
                '<span class="rank-thumb"><span class="monogram">' + esc((a.username || '用').charAt(0)) + '</span></span>' +
                '<span class="rank-info"><b>' + esc(a.username || '未知') + '</b>' +
                '<span>' + a.works + ' 个作品</span></span>' +
                '<span class="rank-stat">⭐ ' + a.fans + ' 粉丝</span></a>';
        });
    }

    async function loadRank() {
        var list = document.getElementById('rank-list');
        var note = document.getElementById('rank-note');
        list.innerHTML = '';
        note.textContent = '加载中…';
        note.style.display = 'block';
        try {
            var rows = rankTab === 'likes' ? await loadLikes()
                : rankTab === 'views' ? await loadViews() : await loadAuthors();
            note.style.display = 'none';
            list.innerHTML = rows.length ? rows.join('') : '<p class="works-note">还没有数据，快来发布第一个作品吧！</p>';
        } catch (e) {
            note.textContent = '加载失败：' + e.message;
        }
    }

    (async function () {
        await renderSubHeader();
        document.getElementById('rank-tabs').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-rank]');
            if (!b) return;
            rankTab = b.getAttribute('data-rank');
            this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
            loadRank();
        });
        await loadRank();
    })();
    </script>
