    <style>
        .contest-hero { border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 14px; padding: 24px; margin-bottom: 20px; background: linear-gradient(135deg, rgba(77,124,254,.08), rgba(156,77,254,.05)); }
        .contest-hero h1 { margin: 0 0 8px; }
        .contest-desc { color: var(--muted); margin: 8px 0 12px; white-space: pre-wrap; }
        .contest-times { font-size: .85rem; color: var(--muted); }
        .status-tag { display: inline-block; font-size: .78rem; padding: 4px 12px; border-radius: 12px; background: rgba(77,124,254,.15); color: #8fb0ff; margin-bottom: 10px; }
        .status-tag.submitting { background: rgba(81,207,102,.15); color: #51cf66; }
        .status-tag.voting { background: rgba(255,212,59,.15); color: #ffd43b; }
        .status-tag.ended { background: rgba(255,255,255,.08); color: var(--muted); }
        .entry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
        .entry-card { border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; overflow: hidden; background: var(--card, rgba(255,255,255,.02)); }
        .entry-card.rank1 { border-color: #ffd43b; box-shadow: 0 0 0 1px #ffd43b; }
        .entry-card.rank2 { border-color: #c0c0c0; }
        .entry-card.rank3 { border-color: #cd7f32; }
        .entry-cover { height: 110px; background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .entry-cover img { width: 100%; height: 100%; object-fit: cover; }
        .entry-body { padding: 10px 12px; }
        .entry-title { font-weight: 700; font-size: .92rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .entry-meta { font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
        .vote-count { font-weight: 800; color: #ffd43b; }
        .entry-actions { display: flex; gap: 6px; }
        .entry-actions .btn { flex: 1; padding: 6px 0; font-size: .82rem; }
        .rank-badge { display: inline-block; font-size: .75rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
        .rank1 .rank-badge { background: #ffd43b; color: #333; }
        .rank2 .rank-badge { background: #c0c0c0; color: #333; }
        .rank3 .rank-badge { background: #cd7f32; color: #fff; }
        .sec-title { font-size: 1.15rem; margin: 24px 0 4px; }
        .submit-box { border: 1px dashed var(--border, rgba(255,255,255,.15)); border-radius: 12px; padding: 16px; margin-top: 12px; }
        .submit-box select { width: 100%; padding: 8px; border-radius: 8px; margin-bottom: 10px; background: var(--card); color: inherit; border: 1px solid var(--border, rgba(255,255,255,.12)); }
    </style>

    <div class="modal-backdrop" id="vote-modal" style="display:none">
        <div class="modal"><h3>确认投票</h3>
            <p class="form-hint">每人每赛事限投 1 票，投票后不可更改，确认吗？</p>
            <div class="modal-actions"><button class="btn" id="vote-cancel" type="button">取消</button>
            <button class="btn btn-blue" id="vote-confirm" type="button">确认投票</button></div></div>
    </div>
    <script>
    function fmtDT(s) {
        if (!s) return '';
        var d = new Date(s);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
            String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function getId() {
        var m = location.search.match(/[?&]id=([^&]+)/);
        return m ? m[1] : null;
    }

    async function load() {
        var cid = getId();
        var wrap = document.getElementById('contest-wrap');
        if (!cid) { wrap.innerHTML = '<p class="works-note">赛事不存在。</p>'; return; }

        var cr = await sb.from('contests').select('*').eq('id', cid).single();
        if (cr.error || !cr.data) { wrap.innerHTML = '<p class="works-note">赛事不存在。</p>'; return; }
        var c = cr.data;
        var st = contestStatus(c);
        var me = await currentUser();
        var admin = me ? await isAdmin() : false;
        var canManage = me && (me.id === c.created_by || admin);

        /* 参赛作品 + 票数 */
        var er = await sb.from('contest_entries').select('id,work_id,user_id,submitted_at').eq('contest_id', cid).order('submitted_at');
        var entries = er.data || [];
        var workIds = entries.map(function (e) { return e.work_id; });
        var works = {};
        if (workIds.length) {
            var wr = await sb.from('works').select('id,title,cover_url,author_id').in('id', workIds);
            (wr.data || []).forEach(function (w) { works[w.id] = w; });
        }
        var vr = await sb.from('contest_votes').select('entry_id').eq('contest_id', cid);
        var voteCount = {};
        (vr.data || []).forEach(function (v) { voteCount[v.entry_id] = (voteCount[v.entry_id] || 0) + 1; });
        entries.forEach(function (e) { e.votes = voteCount[e.id] || 0; });
        entries.sort(function (a, b) { return b.votes - a.votes; });

        /* 我是否已投票 */
        var myVote = null;
        if (me) {
            var mvr = await sb.from('contest_votes').select('entry_id').eq('contest_id', cid).eq('voter_id', me.id).limit(1);
            if (mvr.data && mvr.data.length) myVote = mvr.data[0].entry_id;
        }
        /* 我的作品（用于投稿） */
        var myWorks = [];
        if (me && st === 'submitting') {
            var mwr = await sb.from('works').select('id,title').eq('author_id', me.id).order('created_at', { ascending: false }).limit(50);
            myWorks = mwr.data || [];
        }

        var html = '<div class="contest-hero">' +
            '<span class="status-tag ' + st + '">' + CONTEST_STATUS_TEXT[st] + '</span>' +
            '<h1>' + esc(c.title) + '</h1>' +
            (c.description ? '<div class="contest-desc">' + esc(c.description) + '</div>' : '') +
            '<div class="contest-times">📝 投稿：' + fmtDT(c.submit_start) + ' ~ ' + fmtDT(c.submit_end) +
            '<br>🗳️ 投票截止：' + fmtDT(c.vote_end) +
            '<br>🏆 奖励：冠军 +' + (c.reward_1st == null ? 100 : c.reward_1st) + ' 积分 / 亚军 +' + (c.reward_2nd == null ? 50 : c.reward_2nd) + ' / 季军 +' + (c.reward_3rd == null ? 30 : c.reward_3rd) +
            '<br>🏷️ 类别：' + esc(c.category || '综合') + '</div>' +
            (canManage && st !== 'ended'
                ? '<p style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="edit-contest-btn">✏️ 修改赛事</button> ' +
                  '<button class="btn btn-ghost btn-sm" id="del-contest-btn" style="color:#ff6b6b">🗑️ 删除赛事</button></p>' : '') +
            (st === 'ended' && canManage && !c.settled
                ? '<p style="margin-top:12px"><button class="btn btn-blue" id="settle-btn">🏆 结算并发奖</button></p>' : '') +
            (c.settled ? '<p style="margin-top:8px;color:#51cf66">✅ 已结算，奖金已发放</p>' : '') +
            (!canManage ? '<p style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="report-contest-btn">⚠️ 举报赛事</button></p>' : '') +
            '</div>';

        /* 投稿区 */
        if (st === 'submitting') {
            html += '<h2 class="sec-title">📝 投稿参赛</h2>';
            if (!me) html += '<p class="works-note"><a href="community-auth.html">登录</a>后可投稿。</p>';
            else if (!myWorks.length) html += '<p class="works-note">你还没有发布作品，先去<a href="community-publish.html">发布作品</a>吧。</p>';
            else {
                var enteredWorkIds = {};
                entries.forEach(function (e) { enteredWorkIds[e.work_id] = 1; });
                var options = myWorks.filter(function (w) { return !enteredWorkIds[w.id]; })
                    .map(function (w) { return '<option value="' + w.id + '">' + esc(w.title) + '</option>'; }).join('');
                html += '<div class="submit-box">' +
                    (options ? '<select id="entry-work"><option value="">选择你的作品…</option>' + options + '</select>' +
                    '<button class="btn btn-blue" id="submit-entry-btn">提交参赛</button>'
                    : '<p class="works-note">你的作品都已参赛。</p>') + '</div>';
            }
        }

        /* 投票提示 */
        if (st === 'voting') {
            html += '<p class="works-note">' +
                (!me ? '登录后可投票，每人限投 1 票。' :
                    myVote ? '你已投票，感谢参与！' : '🗳️ 投票进行中，每人限投 1 票，选出你最喜欢的作品吧！') + '</p>';
        }

        /* 参赛作品列表 */
        html += '<h2 class="sec-title">🎮 参赛作品（' + entries.length + '）</h2>';
        if (!entries.length) {
            html += '<p class="works-note">还没有人投稿。</p>';
        } else {
            html += '<div class="entry-grid">' + entries.map(function (e, idx) {
                var w = works[e.work_id] || {};
                var rankCls = st === 'ended' && idx < 3 ? ' rank' + (idx + 1) : '';
                var rankBadge = st === 'ended' && idx < 3
                    ? '<span class="rank-badge">' + ['🥇', '🥈', '🥉'][idx] + '</span>' : '';
                var cover = w.cover_url ? '<img src="' + esc(w.cover_url) + '" alt="" loading="lazy">' : '🎮';
                var voted = myVote === e.id;
                var canVote = me && st === 'voting' && !myVote && e.user_id !== me.id;
                return '<div class="entry-card' + rankCls + '">' +
                    '<div class="entry-cover">' + cover + '</div>' +
                    '<div class="entry-body">' + rankBadge +
                    '<div class="entry-title">' + esc(w.title || '（已删除）') + '</div>' +
                    '<div class="entry-meta"><span class="vote-count">🗳️ ' + e.votes + ' 票</span></div>' +
                    '<div class="entry-actions">' +
                    (w.id ? '<a class="btn" href="community-play.html?id=' + w.id + '">试玩</a>' : '') +
                    (voted ? '<button class="btn" disabled>已投票 ✓</button>'
                        : canVote ? '<button class="btn btn-blue" data-vote="' + e.id + '">投票</button>' : '') +
                    '</div></div></div>';
            }).join('') + '</div>';
        }

        wrap.innerHTML = html;

        /* 投稿 */
        var seBtn = document.getElementById('submit-entry-btn');
        if (seBtn) seBtn.addEventListener('click', async function () {
            var wid = document.getElementById('entry-work').value;
            if (!wid) { alert('请先选择作品'); return; }
            seBtn.disabled = true;
            var r = await sb.from('contest_entries').insert({ contest_id: cid, work_id: wid, user_id: me.id });
            if (r.error) { alert('投稿失败：' + r.error.message); seBtn.disabled = false; }
            else { alert('投稿成功！'); load(); }
        });

        /* 投票 */
        document.querySelectorAll('[data-vote]').forEach(function (b) {
            b.addEventListener('click', function () {
                _pendingVoteEntry = b.getAttribute('data-vote');
                _pendingVoteBtn = b;
                document.getElementById('vote-modal').style.display = 'flex';
            });
        });

        /* 修改赛事 */
        var editBtn = document.getElementById('edit-contest-btn');
        if (editBtn) editBtn.addEventListener('click', function () {
            var mHtml = '<div class="modal-backdrop" id="edit-contest-modal" style="display:flex">' +
                '<div class="modal" style="max-width:480px"><h3>✏️ 修改赛事</h3>' +
                '<label>赛事标题</label><input type="text" id="ec-title" maxlength="60" value="' + esc(c.title || '') + '">' +
                '<label>赛事介绍</label><textarea id="ec-desc" rows="4" maxlength="2000">' + esc(c.description || '') + '</textarea>' +
                '<p class="form-hint">奖励在发布时已锁定，不可修改</p>' +
                '<p class="form-note" id="ec-note"></p>' +
                '<div class="modal-actions"><button class="btn" id="ec-cancel" type="button">取消</button>' +
                '<button class="btn btn-blue" id="ec-save" type="button">保存</button></div></div></div>';
            document.body.insertAdjacentHTML('beforeend', mHtml);
            var modal = document.getElementById('edit-contest-modal');
            document.getElementById('ec-cancel').addEventListener('click', function () { modal.remove(); });
            modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
            document.getElementById('ec-save').addEventListener('click', async function () {
                var t = document.getElementById('ec-title').value.trim();
                var d = document.getElementById('ec-desc').value.trim();
                var n = document.getElementById('ec-note');
                if (!t) { n.textContent = '请填写标题'; n.className = 'form-note err'; return; }
                var r = await sb.from('contests').update({ title: t, description: d }).eq('id', cid);
                if (r.error) { n.textContent = '保存失败：' + r.error.message; n.className = 'form-note err'; return; }
                modal.remove(); load();
            });
        });

        /* 删除赛事 */
        var delBtn = document.getElementById('del-contest-btn');
        if (delBtn) delBtn.addEventListener('click', async function () {
            if (!confirm('确定删除赛事「' + c.title + '」吗？参赛作品和投票将一并删除，不可恢复！')) return;
            delBtn.disabled = true; delBtn.textContent = '删除中…';
            var r = await sb.from('contests').delete().eq('id', cid);
            if (r.error) { alert('删除失败：' + r.error.message); delBtn.disabled = false; delBtn.textContent = '🗑️ 删除赛事'; return; }
            alert('赛事已删除');
            location.href = 'community-contests.html';
        });

        /* 举报赛事 */
        var reportBtn = document.getElementById('report-contest-btn');
        if (reportBtn) {
            var rHtml = '<div class="modal-backdrop" id="report-contest-modal" style="display:none">' +
                '<div class="modal"><h3>⚠️ 举报赛事</h3>' +
                '<p class="form-hint">请填写举报原因，站长会尽快处理。</p>' +
                '<textarea id="rc-reason" maxlength="200" placeholder="如：虚假赛事、诈骗等"></textarea>' +
                '<p class="form-note" id="rc-note"></p>' +
                '<div class="modal-actions"><button class="btn" id="rc-cancel" type="button">取消</button>' +
                '<button class="btn btn-blue" id="rc-submit" type="button">提交举报</button></div></div></div>';
            document.body.insertAdjacentHTML('beforeend', rHtml);
            var rModal = document.getElementById('report-contest-modal');
            reportBtn.addEventListener('click', function () {
                if (!me) { alert('请先登录'); return; }
                document.getElementById('rc-reason').value = '';
                document.getElementById('rc-note').textContent = '';
                rModal.style.display = 'flex';
            });
            document.getElementById('rc-cancel').addEventListener('click', function () { rModal.style.display = 'none'; });
            rModal.addEventListener('click', function (e) { if (e.target === rModal) rModal.style.display = 'none'; });
            document.getElementById('rc-submit').addEventListener('click', async function () {
                var reason = document.getElementById('rc-reason').value.trim();
                var rn = document.getElementById('rc-note');
                if (!reason) { rn.textContent = '请填写举报原因'; rn.className = 'form-note err'; return; }
                var r = await sb.from('reports').insert({
                    reporter_id: me.id, target_type: 'contest', target_id: cid, reason: reason
                });
                if (r.error) { rn.textContent = '举报失败：' + r.error.message; rn.className = 'form-note err'; return; }
                rModal.style.display = 'none';
                alert('已收到举报，站长会尽快处理，感谢监督！');
            });
        }

        /* 结算 */
        var stBtn = document.getElementById('settle-btn');
        if (stBtn) stBtn.addEventListener('click', async function () {
            stBtn.disabled = true; stBtn.textContent = '结算中…';
            var r = await settleContest(cid);
            if (r.ok) { alert('结算完成，奖金已发放！'); load(); }
            else { alert('结算失败：' + (r.error || '未知错误')); stBtn.disabled = false; stBtn.textContent = '🏆 结算并发奖'; }
        });
    }

    /* 投票确认弹窗（只绑定一次） */
    var _pendingVoteEntry = null, _pendingVoteBtn = null;
    function bindVoteModalOnce() {
        if (bindVoteModalOnce.done) return;
        bindVoteModalOnce.done = true;
        document.getElementById('vote-cancel').addEventListener('click', function () {
            document.getElementById('vote-modal').style.display = 'none';
        });
        document.getElementById('vote-modal').addEventListener('click', function (e) {
            if (e.target.id === 'vote-modal') e.target.style.display = 'none';
        });
        document.getElementById('vote-confirm').addEventListener('click', async function () {
            var btn = _pendingVoteBtn, entryId = _pendingVoteEntry;
            if (!entryId || !btn) return;
            var cid = getId();
            var me = await currentUser();
            btn.disabled = true; btn.textContent = '投票中…';
            this.disabled = true; this.textContent = '投票中…';
            var r = await sb.from('contest_votes').insert({ contest_id: cid, entry_id: entryId, voter_id: me.id });
            document.getElementById('vote-modal').style.display = 'none';
            this.disabled = false; this.textContent = '确认投票';
            _pendingVoteEntry = null; _pendingVoteBtn = null;
            if (r.error) { alert('投票失败：' + r.error.message); }
            else { alert('投票成功！'); load(); }
        });
    }

    (async function () {
        await renderSubHeader();
        bindVoteModalOnce();
        await load();
    })();
    </script>
