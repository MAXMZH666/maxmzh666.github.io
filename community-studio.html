        .studio-hero .avatar { width: 80px; height: 80px; border-radius: 18px; background: linear-gradient(135deg, #4d7cfe, #9c4dfe); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; overflow: hidden; flex-shrink: 0; }
        .studio-hero .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .studio-hero h1 { margin: 0 0 6px; }
        .studio-hero .desc { color: var(--muted); font-size: .9rem; }
        .sec-title { font-size: 1.15rem; margin: 24px 0 8px; }
        .member-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .member-chip { border: 1px solid var(--border, rgba(255,255,255,.1)); border-radius: 20px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 8px; font-size: .85rem; text-decoration: none; color: inherit; }
        .member-chip img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.08); }
        .role-tag { font-size: .7rem; padding: 2px 8px; border-radius: 10px; background: rgba(77,124,254,.15); color: #8fb0ff; }
        .role-tag.owner { background: rgba(255,212,59,.2); color: #ffd43b; }
        .role-tag.vice { background: rgba(156,77,254,.2); color: #b197fc; }
        .role-tag.admin { background: rgba(81,207,102,.15); color: #51cf66; }
        .role-sel { font-size: .75rem; padding: 2px 6px; border-radius: 8px; background: var(--card); color: inherit; border: 1px solid var(--border, rgba(255,255,255,.12)); margin-left: 4px; }
        .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 8px; }
        .work-card { border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; display: block; background: var(--card, rgba(255,255,255,.02)); }
        .work-card .cover { height: 100px; background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .work-card .cover img { width: 100%; height: 100%; object-fit: cover; }
        .work-card .t { padding: 8px 10px; font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .manage-box { border: 1px dashed var(--border, rgba(255,255,255,.15)); border-radius: 12px; padding: 16px; margin-top: 12px; }
        .manage-box input, .manage-box select { padding: 8px; border-radius: 8px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--card); color: inherit; margin-right: 8px; margin-bottom: 8px; }
        .remove-btn { font-size: .75rem; color: #ff6b6b; background: none; border: none; cursor: pointer; padding: 2px 4px; }
    </style>

    <script>
    function getId() {
        var m = location.search.match(/[?&]id=([^&]+)/);
        return m ? m[1] : null;
    }
    var ROLE_TEXT = { owner: '室长', vice: '副室长', admin: '管理员', member: '成员' };

    async function load() {
        var sid = getId();
        var wrap = document.getElementById('studio-wrap');
        if (!sid) { wrap.innerHTML = '<p class="works-note">工作室不存在。</p>'; return; }

        var sr = await sb.from('studios').select('*').eq('id', sid).single();
        if (sr.error || !sr.data) { wrap.innerHTML = '<p class="works-note">工作室不存在。</p>'; return; }
        var s = sr.data;
        var me = await currentUser();
        var myRole = me ? await myStudioRole(sid, me.id) : null;
        var siteAdmin = me ? await isAdmin() : false;
        var isManager = myRole === 'owner' || myRole === 'vice' || myRole === 'admin' || siteAdmin;
        var canAppoint = myRole === 'owner' || myRole === 'vice' || siteAdmin;
        var canEdit = isManager;
        var isMember = !!myRole;

        /* 成员 */
        var mr = await sb.from('studio_members').select('user_id,role,joined_at').eq('studio_id', sid).order('joined_at');
        var members = mr.data || [];
        var uids = members.map(function (m) { return m.user_id; });
        var users = {};
        if (uids.length) {
            var ur = await sb.from('profiles').select('id,username,avatar_url').in('id', uids);
            (ur.data || []).forEach(function (u) { users[u.id] = u; });
        }

        /* 作品 */
        var wr = await sb.from('studio_works').select('work_id,added_by').eq('studio_id', sid).order('added_at', { ascending: false });
        var swList = wr.data || [];
        var workIds = swList.map(function (x) { return x.work_id; });
        var works = {};
        if (workIds.length) {
            var wr2 = await sb.from('works').select('id,title,cover_url').in('id', workIds);
            (wr2.data || []).forEach(function (w) { works[w.id] = w; });
        }
        /* 我的作品（用于添加） */
        var myWorks = [];
        if (me && isMember) {
            var mwr = await sb.from('works').select('id,title').eq('author_id', me.id).order('created_at', { ascending: false }).limit(50);
            myWorks = (mwr.data || []).filter(function (w) {
                return !workIds.includes(w.id);
            });
        }

        var av = s.avatar_url ? '<img src="' + esc(s.avatar_url) + '" alt="">' : '🏢';
        var coverBanner = s.cover_url ? '<div style="border-radius:14px;overflow:hidden;margin-bottom:16px;max-height:220px"><img src="' + esc(s.cover_url) + '" alt="" style="width:100%;height:220px;object-fit:cover" loading="lazy"></div>' : '';
        var html = coverBanner + '<div class="studio-hero"><div class="avatar">' + av + '</div><div>' +
            '<h1>' + esc(s.name) + '</h1>' +
            (s.description ? '<div class="desc">' + esc(s.description) + '</div>' : '') +
            '<div class="case-meta" style="margin-top:6px">👥 ' + members.length + ' 位成员 · 🎮 ' + swList.length + ' 件作品 · 🏷️ ' + esc(s.category || '综合') +
            (myRole ? ' · 我的身份：<span class="role-tag ' + myRole + '">' + ROLE_TEXT[myRole] + '</span>' : '') + '</div>' +
            '</div>' +
            '<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="share-studio-btn">🔗 分享工作室</button>' +
            (canEdit ? ' <button class="btn btn-ghost btn-sm" id="edit-studio-btn">✏️ 修改工作室信息</button>' : '') + '</div>' +
            '</div>';

        /* 成员区 */
        html += '<h2 class="sec-title">👥 成员（' + members.length + '）</h2><div class="member-list">' +
            members.map(function (m) {
                var u = users[m.user_id] || {};
                var uav = u.avatar_url ? '<img src="' + esc(u.avatar_url) + '" alt="">' : '<img alt="">';
                var rm = (isManager && m.role !== 'owner' && m.user_id !== me.id)
                    ? ' <button class="remove-btn" data-rm-member="' + m.user_id + '">移除</button>' : '';
                var appt = '';
                if (canAppoint && m.user_id !== me.id && m.role !== 'owner') {
                    appt = ' <select class="role-sel" data-role-user="' + m.user_id + '" data-cur="' + m.role + '">' +
                        ['member', 'admin', 'vice'].map(function (r) {
                            return '<option value="' + r + '"' + (m.role === r ? ' selected' : '') + '>' + ROLE_TEXT[r] + '</option>';
                        }).join('') + '</select>';
                }
                return '<span class="member-chip"><a href="community-user.html?id=' + m.user_id + '" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit">' +
                    uav + esc(u.username || '未知') + '</a>' +
                    ' <span class="role-tag ' + m.role + '">' + ROLE_TEXT[m.role] + '</span>' + appt + rm + '</span>';
            }).join('') + '</div>';

        /* 入室申请（管理员可见） */
        if (isManager) {
            var prq = await sb.from('studio_join_requests').select('id,user_id,message,created_at')
                .eq('studio_id', sid).eq('status', 'pending').order('created_at');
            var reqs = (prq.data || []);
            if (reqs.length) {
                var rqUids = reqs.map(function (x) { return x.user_id; });
                var rqNames = {};
                var rqp = await sb.from('profiles').select('id,username').in('id', rqUids);
                (rqp.data || []).forEach(function (p) { rqNames[p.id] = p.username; });
                html += '<h2 class="sec-title">📥 入室申请（' + reqs.length + '）</h2><div class="member-list">' +
                    reqs.map(function (q) {
                        return '<span class="member-chip">' + esc(rqNames[q.user_id] || '未知') +
                            (q.message ? '：' + esc(q.message) : '') +
                            ' <button class="btn btn-blue btn-sm" data-req-ok="' + q.id + '">✅ 同意</button>' +
                            ' <button class="btn btn-sm" data-req-no="' + q.id + '">❌ 拒绝</button></span>';
                    }).join('') + '</div>';
            }
        }

        /* 公告区 */
        var annHtml = '<h2 class="sec-title">📢 工作室公告</h2><div id="announce-list"><p class="works-note">加载中…</p></div>';
        if (isManager) {
            annHtml += '<div class="manage-box"><b>📢 发布公告</b><br>' +
                '<textarea id="announce-input" rows="3" maxlength="500" placeholder="写点通知大家的事…" style="width:100%"></textarea>' +
                '<button class="btn btn-blue" id="announce-btn" style="margin-top:8px">发布公告</button></div>';
        }
        html += annHtml;

        /* 管理：邀请成员（走消息确认流） */
        if (isManager) {
            html += '<div class="manage-box"><b>✉️ 邀请成员</b><br>' +
                '<input type="text" id="invite-username" placeholder="输入用户名">' +
                '<button class="btn btn-blue" id="invite-btn">发送邀请</button>' +
                '<p class="form-hint">邀请会发送到对方的消息（💬 动态 → 通知）中，对方确认后才能加入。</p></div>';
        }
        if (me && isMember && myRole !== 'owner') {
            html += '<p style="margin-top:10px"><button class="btn" id="leave-btn">退出工作室</button></p>';
        }

        /* 作品区 */
        html += '<h2 class="sec-title">🎮 团队作品（' + swList.length + '）</h2>';
        if (!swList.length) html += '<p class="works-note">还没有团队作品。</p>';
        else {
            html += '<div class="work-grid">' + swList.map(function (x) {
                var w = works[x.work_id] || {};
                var cover = w.cover_url ? '<img src="' + esc(w.cover_url) + '" alt="">' : '🎮';
                var rm = (isManager || (me && x.added_by === me.id))
                    ? '<button class="remove-btn" data-rm-work="' + x.work_id + '">移除</button>' : '';
                return '<div><a class="work-card" href="community-play.html?id=' + x.work_id + '">' +
                    '<div class="cover">' + cover + '</div><div class="t">' + esc(w.title || '（已删除）') + '</div></a>' +
                    (rm ? '<div style="text-align:center">' + rm + '</div>' : '') + '</div>';
            }).join('') + '</div>';
        }

        /* 添加作品 */
        if (me && isMember) {
            if (myWorks.length) {
                html += '<div class="manage-box"><b>＋ 添加我的作品到工作室</b><br>' +
                    '<select id="add-work-sel"><option value="">选择作品…</option>' +
                    myWorks.map(function (w) { return '<option value="' + w.id + '">' + esc(w.title) + '</option>'; }).join('') +
                    '</select> <button class="btn btn-blue" id="add-work-btn">添加</button></div>';
            } else if (!swList.length) {
                html += '<p class="works-note">你还没有可添加的作品，先去<a href="community-publish.html">发布作品</a>吧。</p>';
            }
        } else if (!me) {
            html += '<p class="works-note"><a href="community-auth.html">登录</a>后可申请加入工作室。</p>';
        }
        if (me && !isMember) {
            var qr = await sb.from('studio_join_requests').select('id,status')
                .eq('studio_id', sid).eq('user_id', me.id).order('created_at', { ascending: false }).limit(1);
            var hasPending = qr.data && qr.data[0] && qr.data[0].status === 'pending';
            html += hasPending
                ? '<p class="works-note">📨 入室申请已发送，正在等待管理员审批…</p>'
                : '<div class="manage-box"><b>📨 申请加入工作室</b><br>' +
                  '<input type="text" id="apply-msg" maxlength="100" placeholder="给管理员留句话（选填）" style="width:100%;max-width:380px">' +
                  '<div style="margin-top:8px"><button class="btn btn-blue" id="apply-btn">发送申请</button></div>' +
                  '<p class="form-hint">管理员会在消息中审批，同意后你即可加入。</p></div>';
        }

        /* 💬 内部讨论室（仅成员/站长可见） */
        if (isMember || siteAdmin) {
            html += '<h2 class="sec-title">💬 内部讨论室</h2>' +
                '<p class="works-note" style="padding:0 0 8px">仅工作室成员可见，支持 Markdown 语法。</p>' +
                '<div id="discuss-list"><p class="works-note">加载中…</p></div>' +
                '<div class="manage-box"><b>💬 发表讨论</b><br>' +
                '<textarea id="dc-text" rows="4" maxlength="2000" placeholder="说点什么…（支持 Markdown，最多 2000 字）" style="width:100%"></textarea>' +
                mdHelpBtn('dc-text') +
                '<div style="margin-top:8px"><button class="btn btn-blue" id="dc-send">发送</button></div></div>';
        }

        wrap.innerHTML = html;

        /* 邀请 */
        var invBtn = document.getElementById('invite-btn');
        if (invBtn) invBtn.addEventListener('click', async function () {
            var uname = document.getElementById('invite-username').value.trim();
            if (!uname) { alert('请输入用户名'); return; }
            var ur = await sb.from('profiles').select('id').eq('username', uname).limit(1);
            if (!ur.data || !ur.data.length) { alert('找不到该用户'); return; }
            var uid = ur.data[0].id;
            if (uid === me.id) { alert('不能邀请自己'); return; }
            var r = await sb.rpc('invite_to_studio', { p_studio_id: sid, p_invitee_id: uid });
            if (r.error) { alert('邀请失败：' + r.error.message); return; }
            alert('✅ 邀请已发送到 ' + uname + ' 的消息中，对方确认后即可加入！');
            document.getElementById('invite-username').value = '';
        });

        /* 分享工作室 */
        var shareBtn = document.getElementById('share-studio-btn');
        if (shareBtn) shareBtn.addEventListener('click', async function () {
            var url = location.origin + location.pathname + '?id=' + sid;
            var sdata = { title: s.name + ' - MAX社区工作室', text: s.description || '', url: url };
            if (navigator.share) { try { await navigator.share(sdata); } catch (e) {} }
            else {
                try { await navigator.clipboard.writeText(url); alert('✅ 工作室链接已复制，快分享给朋友吧！'); }
                catch (e) { prompt('复制下面的链接分享给朋友：', url); }
            }
        });

        /* 发送入室申请 */
        var applyBtn = document.getElementById('apply-btn');
        if (applyBtn) applyBtn.addEventListener('click', async function () {
            var msg = document.getElementById('apply-msg').value.trim();
            var r = await sb.rpc('request_join_studio', { p_studio_id: sid, p_message: msg });
            if (r.error) { alert('申请失败：' + r.error.message); return; }
            alert('✅ 申请已发送，管理员会在消息中审批，通过后你即可加入！');
            load();
        });

        /* 审批入室申请 */
        document.querySelectorAll('[data-req-ok],[data-req-no]').forEach(function (b) {
            b.addEventListener('click', async function () {
                var rid = b.getAttribute('data-req-ok') || b.getAttribute('data-req-no');
                var approve = !!b.getAttribute('data-req-ok');
                if (!confirm(approve ? '同意该成员加入工作室？' : '拒绝这条入室申请？')) return;
                var r = await sb.rpc('handle_join_request', { p_request_id: rid, p_approve: approve });
                if (r.error) { alert('操作失败：' + r.error.message); return; }
                if (String(r.data || '').indexOf('rejected:') === 0) alert('⚠️ 对方已加入其他工作室，申请已自动拒绝');
                else { alert(approve ? '✅ 已同意加入' : '已拒绝'); load(); }
            });
        });

        /* 移除成员 */
        document.querySelectorAll('[data-rm-member]').forEach(function (b) {
            b.addEventListener('click', async function () {
                if (!confirm('确认移除该成员吗？')) return;
                var r = await sb.from('studio_members').delete().eq('studio_id', sid).eq('user_id', b.getAttribute('data-rm-member'));
                if (r.error) alert('移除失败：' + r.error.message);
                else load();
            });
        });

        /* 任命职位 */
        document.querySelectorAll('.role-sel').forEach(function (sel) {
            sel.addEventListener('change', async function () {
                var uid = sel.getAttribute('data-role-user');
                var newRole = sel.value;
                var cur = sel.getAttribute('data-cur');
                if (newRole === cur) return;
                /* 副室长只能有1个，管理员最多3个 */
                if (newRole === 'vice') {
                    var hasVice = members.some(function (m) { return m.role === 'vice' && m.user_id !== uid; });
                    if (hasVice) { alert('副室长只能有1位'); sel.value = cur; return; }
                    if (myRole !== 'owner' && !siteAdmin) { alert('只有室长可以任命副室长'); sel.value = cur; return; }
                }
                if (newRole === 'admin') {
                    var adminCount = members.filter(function (m) { return m.role === 'admin' && m.user_id !== uid; }).length;
                    if (adminCount >= 3) { alert('管理员最多3位'); sel.value = cur; return; }
                }
                if (!confirm('确认将该成员设为「' + ROLE_TEXT[newRole] + '」吗？')) { sel.value = cur; return; }
                var r = await sb.from('studio_members').update({ role: newRole }).eq('studio_id', sid).eq('user_id', uid);
                if (r.error) { alert('任命失败：' + r.error.message); sel.value = cur; }
                else load();
            });
        });

        /* 修改工作室信息 */
        var editStudioBtn = document.getElementById('edit-studio-btn');
        if (editStudioBtn) editStudioBtn.addEventListener('click', function () {
            var mHtml = '<div class="modal-backdrop" id="edit-studio-modal" style="display:flex">' +
                '<div class="modal" style="max-width:480px"><h3>✏️ 修改工作室信息</h3>' +
                '<label>工作室名称</label><input type="text" id="es-name" maxlength="30" value="' + esc(s.name || '') + '">' +
                '<label>简介</label><textarea id="es-desc" rows="4" maxlength="500">' + esc(s.description || '') + '</textarea>' +
                '<label>封面图（不换请留空）</label><input type="file" id="es-cover" accept="image/*">' +
                '<p class="form-note" id="es-note"></p>' +
                '<div class="modal-actions"><button class="btn" id="es-cancel" type="button">取消</button>' +
                '<button class="btn btn-blue" id="es-save" type="button">保存</button></div>' +
                ((myRole === 'owner' || siteAdmin) ? '<div style="margin-top:14px;border-top:1px solid #444;padding-top:12px"><button class="btn btn-ghost btn-sm" id="es-dissolve" type="button" style="color:#ff6b6b">🗑️ 解散工作室</button><p class="form-hint">解散后所有成员、公告、讨论将被移除，不可恢复。</p></div>' : '') + '</div></div>';
            document.body.insertAdjacentHTML('beforeend', mHtml);
            var modal = document.getElementById('edit-studio-modal');
            document.getElementById('es-cancel').addEventListener('click', function () { modal.remove(); });
            var disBtn = document.getElementById('es-dissolve');
            if (disBtn) disBtn.addEventListener('click', async function () {
                if (!confirm('确定解散工作室「' + (s.name || '') + '」吗？所有成员、公告、讨论将被移除，不可恢复！')) return;
                if (!confirm('再次确认：真的要解散吗？')) return;
                showLoading('解散中…');
                try {
                    var r = await withTimeout(sb.from('studios').delete().eq('id', sid), 20000, '解散超时，请重试');
                    if (r.error) throw r.error;
                    showLoading('已解散，跳转中…');
                    location.href = 'community-studios.html';
                } catch (e) {
                    hideLoading();
                    alert('解散失败：' + (e.message || ''));
                }
            });
            modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
            document.getElementById('es-save').addEventListener('click', async function () {
                var nm = document.getElementById('es-name').value.trim();
                var ds = document.getElementById('es-desc').value.trim();
                var n = document.getElementById('es-note');
                if (!nm) { n.textContent = '请填写名称'; n.className = 'form-note err'; return; }
                n.textContent = '保存中…'; n.className = 'form-note sending';
                var payload = { name: nm, description: ds };
                var cf = document.getElementById('es-cover').files[0];
                if (cf) {
                    var ext = (cf.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
                    payload.cover_url = await uploadWithProgress('covers', 'studio/' + sid + '_' + Date.now() + '.' + ext, cf, cf.type || 'image/jpeg', null);
                }
                var r = await sb.from('studios').update(payload).eq('id', sid);
                if (r.error) { n.textContent = '保存失败：' + r.error.message; n.className = 'form-note err'; return; }
                modal.remove(); load();
            });
        });

        /* 公告：加载 + 发布 + 删除 */
        async function loadAnnounces() {
            var box = document.getElementById('announce-list');
            if (!box) return;
            try {
                var r = await sb.from('studio_announcements').select('*').eq('studio_id', sid).order('created_at', { ascending: false }).limit(20);
                var anns = r.data || [];
                var auids = anns.map(function (a) { return a.author_id; });
                var anames = {};
                if (auids.length) {
                    var pr = await sb.from('profiles').select('id,username').in('id', auids);
                    (pr.data || []).forEach(function (p) { anames[p.id] = p.username; });
                }
                box.innerHTML = anns.length ? anns.map(function (a) {
                    return '<div class="comment"><div class="comment-meta">' + esc(anames[a.author_id] || '未知') +
                        ' · ' + fmtDate(a.created_at) +
                        (isManager ? ' <button class="remove-btn" data-rm-ann="' + a.id + '">删除</button>' : '') +
                        '</div><p>' + esc(a.content) + '</p></div>';
                }).join('') : '<p class="works-note">暂无公告</p>';
                box.querySelectorAll('[data-rm-ann]').forEach(function (b) {
                    b.addEventListener('click', async function () {
                        if (!confirm('删除这条公告？')) return;
                        await sb.from('studio_announcements').delete().eq('id', b.getAttribute('data-rm-ann'));
                        loadAnnounces();
                    });
                });
            } catch (e) { box.innerHTML = '<p class="works-note">加载失败</p>'; }
        }
        await loadAnnounces();
        var annBtn = document.getElementById('announce-btn');
        if (annBtn) annBtn.addEventListener('click', async function () {
            var tx = document.getElementById('announce-input').value.trim();
            if (!tx) { alert('请填写公告内容'); return; }
            var r = await sb.from('studio_announcements').insert({ studio_id: sid, author_id: me.id, content: tx });
            if (r.error) alert('发布失败：' + r.error.message);
            else { document.getElementById('announce-input').value = ''; loadAnnounces(); }
        });

        /* 💬 内部讨论室：加载 + 发表 + 删除 */
        async function loadDiscussions() {
            var box = document.getElementById('discuss-list');
            if (!box) return;
            try {
                var r = await withTimeout(
                    sb.from('studio_discussions').select('*').eq('studio_id', sid).order('created_at', { ascending: false }).limit(100),
                    25000, '讨论加载超时，请检查网络后重试');
                var list = r.data || [];
                var duids = list.map(function (d) { return d.user_id; });
                var dusers = {};
                if (duids.length) {
                    var pr = await sb.from('profiles').select('id,username,avatar_url').in('id', duids);
                    (pr.data || []).forEach(function (p) { dusers[p.id] = p; });
                }
                var droles = {};
                members.forEach(function (m) { droles[m.user_id] = m.role; });
                box.innerHTML = list.length ? list.map(function (d) {
                    var u = dusers[d.user_id] || {};
                    var uav = u.avatar_url ? '<img src="' + esc(u.avatar_url) + '" alt="">' : '<img alt="">';
                    var role = droles[d.user_id] || 'member';
                    var canDel = (me && d.user_id === me.id) || isManager;
                    return '<div class="comment"><div class="comment-meta">' +
                        '<span class="member-chip" style="border:none;padding:0;background:none">' + uav + esc(u.username || '未知') + '</span>' +
                        ' <span class="role-tag ' + role + '">' + ROLE_TEXT[role] + '</span>' +
                        ' · ' + fmtDate(d.created_at) +
                        (canDel ? ' <button class="remove-btn" data-rm-dc="' + d.id + '">删除</button>' : '') +
                        '</div><div>' + md(d.content) + '</div></div>';
                }).join('') : '<p class="works-note">还没有讨论，来发第一条吧！</p>';
                box.querySelectorAll('[data-rm-dc]').forEach(function (b) {
                    b.addEventListener('click', async function () {
                        if (!confirm('删除这条讨论？')) return;
                        showLoading('删除中…');
                        try {
                            var dr = await withTimeout(sb.from('studio_discussions').delete().eq('id', b.getAttribute('data-rm-dc')), 25000, '删除超时，请重试');
                            if (dr.error) alert('删除失败：' + dr.error.message);
                            else loadDiscussions();
                        } catch (e) { alert(e.message || '删除失败'); }
                        finally { hideLoading(); }
                    });
                });
            } catch (e) { box.innerHTML = '<p class="works-note">加载失败</p>'; }
        }
        await loadDiscussions();
        var dcBtn = document.getElementById('dc-send');
        if (dcBtn) dcBtn.addEventListener('click', async function () {
            var tx = document.getElementById('dc-text').value.trim();
            if (!tx) { alert('请填写讨论内容'); return; }
            if (tx.length > 2000) { alert('内容最多 2000 字'); return; }
            showLoading('发送中…');
            try {
                var r = await withTimeout(sb.from('studio_discussions').insert({ studio_id: sid, user_id: me.id, content: tx }), 25000, '发送超时，请检查网络后重试');
                if (r.error) alert('发送失败：' + r.error.message);
                else { document.getElementById('dc-text').value = ''; loadDiscussions(); }
            } catch (e) { alert(e.message || '发送失败'); }
            finally { hideLoading(); }
        });

        /* 退出 */
        var leaveBtn = document.getElementById('leave-btn');
        if (leaveBtn) leaveBtn.addEventListener('click', async function () {
            if (!confirm('确认退出工作室吗？')) return;
            var r = await sb.from('studio_members').delete().eq('studio_id', sid).eq('user_id', me.id);
            if (r.error) alert('退出失败：' + r.error.message);
            else { alert('已退出'); load(); }
        });

        /* 添加作品 */
        var addBtn = document.getElementById('add-work-btn');
        if (addBtn) addBtn.addEventListener('click', async function () {
            var wid = document.getElementById('add-work-sel').value;
            if (!wid) { alert('请选择作品'); return; }
            var r = await sb.from('studio_works').insert({ studio_id: sid, work_id: wid, added_by: me.id });
            if (r.error) alert('添加失败：' + r.error.message);
            else load();
        });

        /* 移除作品 */
        document.querySelectorAll('[data-rm-work]').forEach(function (b) {
            b.addEventListener('click', async function () {
                if (!confirm('确认从工作室移除该作品吗？')) return;
                var r = await sb.from('studio_works').delete().eq('studio_id', sid).eq('work_id', b.getAttribute('data-rm-work'));
                if (r.error) alert('移除失败：' + r.error.message);
                else load();
            });
        });
    }

    (async function () {
        await renderSubHeader();
        await load();
    })();
    </script>
</body>
</html>
