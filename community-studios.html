    <script src="js/community.js?v=20261004h"></script>
    <script>
    var studioTab = 'hot', studioCat = '';
    var allStudios = [], studioCounts = {};
    function renderStudios() {
        var list = allStudios.filter(function (s) { return !studioCat || (s.category || '综合') === studioCat; });
        list.sort(function (a, b) {
            if (studioTab === 'hot') return (studioCounts[b.id] || 0) - (studioCounts[a.id] || 0);
            return new Date(b.created_at) - new Date(a.created_at);
        });
        if (!list.length) {
            document.getElementById('studio-list').innerHTML = '<p class="works-note">这个类别还没有工作室，来创建第一个吧！</p>';
            return;
        }
        document.getElementById('studio-list').innerHTML = '<div class="studio-grid">' +
            list.map(function (s) {
                var av = s.avatar_url ? '<img src="' + esc(s.avatar_url) + '" alt="" loading="lazy">' : '🏢';
                return '<a class="studio-card" href="community-studio.html?id=' + s.id + '">' +
                    '<div class="studio-avatar">' + av + '</div>' +
                    '<div class="studio-name">' + esc(s.name) + '</div>' +
                    (s.description ? '<div class="studio-desc">' + esc(s.description) + '</div>' : '') +
                    '<div class="studio-meta">👥 ' + (studioCounts[s.id] || 0) + ' 位成员 · ' + esc(s.category || '综合') + '</div></a>';
            }).join('') + '</div>';
    }
    async function load() {
        var r = await sb.from('studios').select('id,name,description,avatar_url,category,created_at').order('created_at', { ascending: false }).limit(100);
        allStudios = r.data || [];
        var ids = allStudios.map(function (s) { return s.id; });
        studioCounts = {};
        if (ids.length) {
            var mr = await sb.from('studio_members').select('studio_id').in('studio_id', ids);
            (mr.data || []).forEach(function (m) { studioCounts[m.studio_id] = (studioCounts[m.studio_id] || 0) + 1; });
        }
        renderStudios();
    }
    document.querySelectorAll('#studio-tabs [data-stab]').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#studio-tabs [data-stab]').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            studioTab = b.getAttribute('data-stab');
            renderStudios();
        });
    });
    document.querySelectorAll('#studio-cats [data-scat]').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#studio-cats [data-scat]').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            studioCat = b.getAttribute('data-scat');
            renderStudios();
        });
    });
    (async function () {
        await renderSubHeader();
        await load();
    })();
    </script>
