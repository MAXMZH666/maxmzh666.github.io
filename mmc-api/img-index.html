<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX 图床 · img.maxmzh.com</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0d1120; color: #e8ecf8; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; }
    .card { width: 100%; max-width: 520px; background: #151a2e; border: 1px solid rgba(255,255,255,.09); border-radius: 18px; padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
    h1 { margin: 0 0 6px; font-size: 24px; background: linear-gradient(90deg,#4d7cfe,#6d5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: #9aa5c7; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #c6cdea; margin: 12px 0 6px; }
    input[type=email], input[type=password] { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #0d1120; color: #fff; font-size: 14px; }
    button { background: linear-gradient(135deg,#4d7cfe,#6d5cff); color: #fff; border: none; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    .ghost { background: none; border: 1px solid rgba(255,255,255,.2); }
    .drop { border: 2px dashed rgba(109,92,255,.5); border-radius: 14px; padding: 30px 16px; text-align: center; color: #9aa5c7; cursor: pointer; }
    .drop.over { background: rgba(77,124,254,.1); color: #e8ecf8; }
    .note { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .ok { color: #5fd68a; } .err { color: #ff7a7a; }
    .result { display: none; margin-top: 16px; }
    .result input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #0d1120; color: #8fd0ff; font-size: 13px; }
    .result img { max-width: 100%; border-radius: 12px; margin-top: 12px; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    .who { font-size: 13px; color: #9aa5c7; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="card">
    <h1>MAX 图床</h1>
    <div class="sub">用 MAX 账号登录后上传图片，得到永久直链（单张 ≤ 5MB，支持 PNG / JPG / GIF / WebP）</div>

    <div id="login-box">
        <label>邮箱</label>
        <input type="email" id="email" autocomplete="username" placeholder="你的 MAX社区 账号邮箱">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="密码">
        <div class="row"><button id="login-btn">登录</button>
        <a href="https://maxmzh.com/community-auth.html" style="color:#8fd0ff;font-size:13px">没有账号？去注册</a></div>
        <div class="note" id="login-note"></div>
        <div class="sub" style="margin-top:10px">注：图床是独立域名，与主站登录态不共享，在本页登录一次即可。</div>
    </div>

    <div id="up-box" style="display:none">
        <div class="who">已登录：<span id="who"></span> <button class="ghost" id="logout-btn" style="padding:5px 12px;font-size:12px">退出</button></div>
        <div class="drop" id="drop">点击选择图片，或把图片拖到这里</div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
        <div class="note" id="up-note"></div>
        <div class="result" id="result">
            <label>图片直链</label>
            <input type="text" id="url" readonly>
            <div class="row"><button id="copy-btn">复制链接</button></div>
            <img id="preview" alt="预览">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
    var sb = window.supabase.createClient(
        'https://xkvpzxxtcnocofnsezpy.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrdnB6eHh0Y25vY29mbnNlenB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTY4MzQsImV4cCI6MjEwNjQ5MjgzNH0.zTpvyEsutA9hV_UIg36g5owBRnxdHaI-sy_fLUsu6ec');
    var session = null;
    var $ = function (id) { return document.getElementById(id); };

    function showUp() {
        $('login-box').style.display = 'none';
        $('up-box').style.display = 'block';
        $('who').textContent = (session && session.user && session.user.email) || '';
    }
    function showLogin() {
        $('up-box').style.display = 'none';
        $('login-box').style.display = 'block';
    }
    sb.auth.getSession().then(function (r) {
        session = r.data.session;
        if (session) showUp();
    });
    $('login-btn').addEventListener('click', function () {
        var note = $('login-note');
        note.textContent = '登录中…'; note.className = 'note';
        sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value })
            .then(function (r) {
                if (r.error) { note.textContent = '登录失败：' + r.error.message; note.className = 'note err'; return; }
                session = r.data.session; showUp();
            });
    });
    $('logout-btn').addEventListener('click', function () {
        sb.auth.signOut().then(function () { session = null; showLogin(); });
    });

    var drop = $('drop'), file = $('file');
    drop.addEventListener('click', function () { file.click(); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) {
        e.preventDefault(); drop.classList.remove('over');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
    });
    file.addEventListener('change', function () { if (file.files[0]) upload(file.files[0]); });

    function upload(f) {
        var note = $('up-note');
        if (f.size > 5 * 1024 * 1024) { note.textContent = '图片超过 5MB'; note.className = 'note err'; return; }
        note.textContent = '上传中…'; note.className = 'note';
        fetch('/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + (session && session.access_token), 'Content-Type': f.type },
            body: f
        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
              if (!res.ok) throw new Error(res.j.error || '上传失败');
              $('url').value = res.j.url;
              $('preview').src = res.j.url;
              $('result').style.display = 'block';
              note.textContent = '上传成功'; note.className = 'note ok';
          }).catch(function (e) {
              note.textContent = '上传失败：' + e.message; note.className = 'note err';
          });
    }
    $('copy-btn').addEventListener('click', function () {
        $('url').select();
        if (navigator.clipboard) navigator.clipboard.writeText($('url').value);
        else document.execCommand('copy');
        $('copy-btn').textContent = '已复制 ✓';
        setTimeout(function () { $('copy-btn').textContent = '复制链接'; }, 1500);
    });
})();
</script>
</body>
</html>
