<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MAX应用商店：MAXMZH 官方应用分发，Windows、Android、智能穿戴三平台。">
<title>MAX应用商店 - MAXMZH</title>
<link rel="icon" type="image/png" href="https://maxmzh.com/favicon.png">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0d1120; color: #e8ecf8; min-height: 100vh; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 18px 60px; }
    header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .logo { font-size: 28px; font-weight: 800; background: linear-gradient(90deg,#4d7cfe,#6d5cff); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
    .tag { color: #9aa5c7; font-size: 13px; }
    .search { margin-left: auto; }
    .search input { background: #151a2e; border: 1px solid rgba(255,255,255,.14); color: #fff; border-radius: 999px; padding: 9px 16px; font-size: 14px; width: 210px; outline: none; }
    .search input:focus { border-color: #4d7cfe; }
    .hero { margin: 30px 0 8px; }
    .hero h1 { font-size: 30px; margin: 0 0 8px; }
    .hero p { color: #9aa5c7; margin: 0; font-size: 14px; }
    .tabs { display: flex; gap: 10px; margin: 24px 0 20px; flex-wrap: wrap; }
    .tab { border: 1px solid rgba(255,255,255,.16); background: #151a2e; color: #c6cdea; border-radius: 999px; padding: 9px 20px; font-size: 15px; cursor: pointer; }
    .tab.active { background: linear-gradient(135deg,#4d7cfe,#6d5cff); color: #fff; border-color: transparent; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .app { background: #151a2e; border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .app .head { display: flex; align-items: center; gap: 14px; }
    .app .icon { font-size: 40px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: rgba(77,124,254,.12); border-radius: 14px; flex: none; }
    .app .name { font-size: 17px; font-weight: 700; }
    .app .meta { color: #9aa5c7; font-size: 12px; margin-top: 3px; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(109,92,255,.18); color: #b9aefc; margin-right: 6px; }
    .app .desc { color: #c6cdea; font-size: 13.5px; line-height: 1.6; flex: 1; }
    .btn { display: inline-block; text-align: center; background: linear-gradient(135deg,#4d7cfe,#6d5cff); color: #fff; text-decoration: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; }
    .btn.soon { background: #232946; color: #9aa5c7; pointer-events: none; }
    .empty { grid-column: 1 / -1; text-align: center; color: #9aa5c7; padding: 56px 20px; border: 1.5px dashed rgba(255,255,255,.14); border-radius: 16px; }
    .empty .big { font-size: 40px; margin-bottom: 10px; }
    footer { margin-top: 44px; text-align: center; color: #5f6a8c; font-size: 12.5px; line-height: 1.9; }
    footer a { color: #8fa3d9; }
</style>
</head>
<body>
<div data-max-account="float"></div>
<div class="wrap">
    <header class="top">
        <a class="logo" href="https://store.maxmzh.com/">MAX 应用商店</a>
        <span class="tag">MAXMZH 官方出品 · 免费下载</span>
        <div class="search"><input type="search" id="q" placeholder="搜索应用…"></div>
    </header>

    <div class="hero">
        <h1>把好用的，都装进口袋</h1>
        <p>这里是 MAX 系列应用的官方分发页，按你的设备选平台，直接下载最新版。</p>
    </div>

    <nav class="tabs" id="tabs">
        <button class="tab" data-p="all">全部</button>
        <button class="tab" data-p="windows">🪟 Windows</button>
        <button class="tab" data-p="android">🤖 Android</button>
        <button class="tab" data-p="wearable">⌚ 智能穿戴</button>
    </nav>

    <main class="grid" id="grid"><div class="empty"><div class="big">🛍️</div>正在上架…</div></main>

    <footer>
        应用均由 MAXMZH 开发与维护，下载文件托管于本站服务器。<br>
        <a href="https://maxmzh.com/">主站</a> · <a href="https://maxmzh.com/community.html">MAX社区</a> · <a href="https://forum.maxmzh.com/">MAX论坛</a> · <a href="https://img.maxmzh.com/">MAX图床</a>
    </footer>
</div>

<script src="https://maxmzh.com/js/max-account.js?v=20261114a"></script>
<script>
(function () {
    var NAMES = { windows: 'Windows', android: 'Android', wearable: '智能穿戴' };
    var ICONS = { windows: '🪟', android: '🤖', wearable: '⌚' };
    var apps = [], platform = 'all', query = '';
    var grid = document.getElementById('grid');

    function card(a) {
        var meta = [];
        if (a.version) meta.push('版本 ' + a.version);
        if (a.size) meta.push(a.size);
        var btn = a.action === 'soon'
            ? '<span class="btn soon">' + (a.actionText || '即将上架') + '</span>'
            : '<a class="btn" href="' + a.url + '"' + (a.action === 'download' ? ' download' : ' target="_blank" rel="noopener"') + '>' + (a.actionText || '打开') + '</a>';
        return '<article class="app"><div class="head"><div class="icon">' + (a.icon || '📱') + '</div>' +
            '<div><div class="name">' + a.name + '</div><div class="meta"><span class="badge">' + (NAMES[a.platform] || a.platform) + '</span>' + meta.join(' · ') + '</div></div></div>' +
            '<div class="desc">' + a.desc + '</div>' + btn + '</article>';
    }
    function render() {
        var list = apps.filter(function (a) {
            return (platform === 'all' || a.platform === platform) &&
                   (!query || (a.name + a.desc).toLowerCase().indexOf(query) >= 0);
        });
        if (!list.length) {
            grid.innerHTML = '<div class="empty"><div class="big">' + (ICONS[platform] || '🛍️') + '</div>' +
                (platform === 'wearable' ? '智能穿戴应用正在开发中，敬请期待。' : '这个分类下暂时没有匹配的应用。') + '</div>';
            return;
        }
        grid.innerHTML = list.map(card).join('');
    }
    document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('.tab'); if (!b) return;
        platform = b.dataset.p;
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === b); });
        render();
    });
    document.getElementById('q').addEventListener('input', function (e) {
        query = e.target.value.trim().toLowerCase(); render();
    });
    document.querySelector('.tab[data-p="all"]').classList.add('active');
    fetch('store-apps.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
        apps = d.apps || []; render();
    }).catch(function () {
        grid.innerHTML = '<div class="empty"><div class="big">⚠️</div>应用列表加载失败，请刷新重试。</div>';
    });
})();
</script>
</body>
</html>
