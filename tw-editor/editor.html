<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" value="notranslate"><meta name="description" content="TurboWarp is a Scratch mod with a compiler to run projects faster, dark mode for your eyes, a bunch of addons to improve the editor, and more."/><title>TurboWarp - Run Scratch projects faster</title><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><style>.splash-screen {

      }</style></head><body><noscript><div class="splash-screen"><div><h1>TurboWarp requires JavaScript</h1><p>Consider using <a href="https://desktop.turbowarp.org/">TurboWarp Desktop</a> if you are afraid of remote JavaScript.</p></div></div></noscript><div class="splash-screen spash-waiting-for-js" hidden><div class="splash-spinner"></div><div class="splash-error-title" hidden>Something went wrong. <a href="https://scratch.mit.edu/users/GarboMuffin/#comments" target="_blank" rel="noreferrer">Please report</a> with the information below.</div><div class="splash-errors" hidden></div><button class="splash-reset" hidden>Click here to reset caches (can fix some errors)</button></div><script>(function () {
        'use strict';

        var theme = '';
        var accent = '#ff4c4c';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.accent === 'purple') {
              accent = '#855cd6';
            } else if (parsed.accent === 'blue') {
              accent = '#4c97ff';
            }
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.querySelector('.spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        if (theme !== 'dark') {
          
            splash.style.backgroundColor = accent;
            splash.style.color = 'white';
          
        }
        splash.hidden = false;

        var splashErrorTitle = document.querySelector('.splash-error-title');
        var splashError = document.querySelector('.splash-errors');
        var splashReset = document.querySelector('.splash-reset');

        var totalErrors = 0;
        window.onerror = function (event, source, line, col, err) {
          if (++totalErrors > 5) return; // dont bother logging more
          splashErrorTitle.hidden = splashError.hidden = splashReset.hidden = false;
          var el = document.createElement('div');
          el.textContent = 'Error (splash) in ' + source + ' (' + line + ':' + col + '): ' + err;
          splashError.appendChild(el);
        };

        splashReset.onclick = function () {
          splashReset.disabled = true;
          function hardRefresh() {
            var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
            // This is a functional cookie used so that we respond with Clear-Site-Data just once. No tracking.
            // Can't use nocache parameter to trigger this because people might accidentally bookmark that, and
            // then we would be clearing their cache on every visit.
            document.cookie = 'tw_clear_cache_once=1; max-age=60; path=/; samesite=strict; secure';
            location.replace(location.pathname + search + (search ? '&' : '?') + 'nocache=' + Math.floor(Math.random() * 10000000));
          }
          if ('serviceWorker' in navigator) {
            setTimeout(hardRefresh, 5000);
            navigator.serviceWorker.getRegistration("")
              .then(function(registration) {
                if (registration) {
                  return registration.unregister();
                }
              })
              .then(hardRefresh)
              .catch(hardRefresh);
          } else {
            hardRefresh();
          }
        };

        window.SplashEnd = () => {
          splash.hidden = true;
          window.onerror = null;
        };
      })();</script><div id="app"></div><script src="js/pentapod/vendors~addon-settings~credits~editor~embed~fullscreen~player.a9c21474df6530cc7bcb.js"></script><script src="js/pentapod/vendors~editor~embed~fullscreen~player.ca27ef043ac01d536645.js"></script><script src="js/pentapod/addon-settings~addons~editor~fullscreen~player.d368c040af8d26993a1d.js"></script><script src="js/pentapod/addon-settings~editor~embed~fullscreen~player.ae55ed6b87fd5b016b19.js"></script><script src="js/pentapod/editor.c7aca82a8bf323a87f74.js"></script><script>
/* MAXMZH 社区：编辑器增强（注入，无需重新构建）
   - 文件菜单内注入「保存草稿 / 发布到社区」
   - 隐藏顶部「查看作品页面」「TurboWarp 反馈」按钮
   - 新标签页独立模式：直连 Supabase 保存草稿/发布 + 每90秒自动保存 */
(function () {
    'use strict';
    var EMBEDDED = window.parent !== window;
    var SITE = 'https://maxmzh666.github.io';
    var SB_URL = 'https://xkvpzxxtcnocofnsezpy.supabase.co';
    var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrdnB6eHh0Y25vY29mbnNlenB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTY4MzQsImV4cCI6MjEwNjQ5MjgzNH0.zTpvyEsutA9hV_UIg36g5owBRnxdHaI-sy_fLUsu6ec';
    var sb = null, sbReady = null;

    function toast(msg, ms) {
        var t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);' +
            'background:#222;color:#fff;padding:10px 18px;border-radius:8px;z-index:99999;font-size:14px;' +
            'box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:80vw;text-align:center;';
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, ms || 2600);
    }
    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
    }
    function ensureSb() {
        if (sbReady) return sbReady;
        sbReady = (async function () {
            if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
            sb = window.supabase.createClient(SB_URL, SB_ANON);
            return sb;
        })();
        return sbReady;
    }
    async function getSb3() {
        var store = window.ReduxStore;
        if (!store || !store.getState) throw new Error('编辑器还没准备好，稍后再试');
        var sg = store.getState().scratchGui;
        var vm = sg && sg.vm;
        if (!vm || typeof vm.saveProjectSb3 !== 'function') throw new Error('编辑器还没准备好，稍后再试');
        var buffer = await vm.saveProjectSb3('arraybuffer');
        var title = (sg && sg.projectTitle) || '未命名作品';
        return { buffer: buffer, title: title };
    }
    async function requireUser() {
        await ensureSb();
        var r = await sb.auth.getUser();
        var u = r.data && r.data.user;
        if (!u) {
            toast('请先登录社区账号', 2000);
            setTimeout(function () {
                location.href = SITE + '/community-auth.html?next=' + encodeURIComponent(location.href);
            }, 800);
            throw new Error('未登录');
        }
        return u;
    }
    async function uploadSb3(path, buffer) {
        var blob = buffer instanceof Blob ? buffer : new Blob([buffer], { type: 'application/octet-stream' });
        var s = await sb.storage.from('sb3').createSignedUploadUrl(path);
        if (s.error) throw s.error;
        var resp = await fetch(s.data.signedUrl, {
            method: 'PUT', body: blob,
            headers: { 'Content-Type': 'application/octet-stream' }
        });
        if (!resp.ok) throw new Error('上传失败(' + resp.status + ')');
        return sb.storage.from('sb3').getPublicUrl(path).data.publicUrl;
    }
    var draftKey = 'mmc_draft_scratch_id';
    async function saveDraft(auto) {
        try {
            var u = await requireUser();
            if (!auto) toast('正在保存草稿…', 1500);
            var got = await getSb3();
            var url = await uploadSb3('drafts/' + u.id + '/' + Date.now() + '.sb3', got.buffer);
            var row = {
                user_id: u.id, work_type: 'scratch',
                title: got.title || '未命名草稿',
                sb3_url: url, updated_at: new Date().toISOString()
            };
            var did = null;
            try { did = localStorage.getItem(draftKey); } catch (e) {}
            if (did) {
                var ur = await sb.from('drafts').update(row).eq('id', did).eq('user_id', u.id);
                if (ur.error) throw ur.error;
            } else {
                var ir = await sb.from('drafts').insert(row).select('id').single();
                if (ir.error) throw ir.error;
                did = ir.data.id;
                try { localStorage.setItem(draftKey, did); } catch (e) {}
            }
            setAutosaveLabel(auto ? true : false);
            toast(auto ? '☁️ 已自动保存 ' + new Date().toLocaleTimeString() : '草稿已保存', 2000);
        } catch (err) {
            if (String(err.message) !== '未登录') toast('保存失败：' + err.message, 3000);
        }
    }
    async function publishToCommunity() {
        if (EMBEDDED) { /* 内嵌模式：交给父页面处理 */
            try { window.parent.postMessage({ type: 'MMC_TOOLBAR_PUBLISH' }, '*'); } catch (e) {}
            return;
        }
        try {
            var u = await requireUser();
            toast('正在获取作品并上传…', 2000);
            var got = await getSb3();
            var url = await uploadSb3(u.id + '/' + Date.now() + '.sb3', got.buffer);
            location.href = SITE + '/community-publish.html?sb3=' + encodeURIComponent(url) +
                '&title=' + encodeURIComponent(got.title || '未命名作品');
        } catch (err) {
            if (String(err.message) !== '未登录') toast('发布失败：' + err.message + '，可改用文件 → 保存到电脑后手动上传', 4000);
        }
    }
    function setAutosaveLabel(show) {
        var el = document.getElementById('mmc-autosave');
        if (el) {
            el.textContent = show ? '☁️ 已自动保存 ' + new Date().toLocaleTimeString() : '☁️ 自动保存已开启';
            el.style.display = 'block';
        }
    }

    /* ---- 注入文件菜单项 + 隐藏顶部按钮 ---- */
    function cls(el) {
        var c = el.className;
        if (c && c.baseVal !== undefined) c = c.baseVal;
        return typeof c === 'string' ? c : '';
    }
    var SAVE_TEXTS = ['保存到电脑', '保存到文件', 'Save to your computer'];
    function tryInjectMenu() {
        /* 先清理旧注入（React 重渲染会重建菜单，防止重复） */
        var olds = document.querySelectorAll('[data-mmc-item]');
        for (var oi = 0; oi < olds.length; oi++) olds[oi].remove();
        /* 找到「保存到电脑/文件」叶子菜单项
           注意：TurboWarp 的下拉菜单渲染在 menu-bar 容器内部，不能按 menu-bar 排除 */
        var saveItem = null;
        var all = document.getElementsByTagName('*');
        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.children.length !== 0) continue;
            var t = (el.textContent || '').trim();
            if (SAVE_TEXTS.indexOf(t) !== -1) { saveItem = el; break; }
        }
        if (!saveItem) return;
        /* 向上找下拉菜单容器：第一个 class 含 menu、但不含 menu-item/menu-bar 的祖先 */
        var menu = saveItem.parentNode;
        while (menu && menu !== document.body) {
            var mcn = cls(menu);
            if (mcn.indexOf('menu') !== -1 && mcn.indexOf('menu-item') === -1 && mcn.indexOf('menu-bar') === -1) break;
            menu = menu.parentNode;
        }
        if (!menu || menu === document.body) return;
        /* 安全校验：容器内至少有 2 个菜单项，防止误插到顶栏 */
        var items = 0;
        var desc = menu.getElementsByTagName('*');
        for (var di = 0; di < desc.length; di++) {
            if (cls(desc[di]).indexOf('menu-item') !== -1) items++;
        }
        if (items < 2) return;
        /* 用真正的菜单项 div 作为样式模板 */
        var styleSrc = saveItem;
        if (cls(saveItem.parentNode).indexOf('menu-item') !== -1) styleSrc = saveItem.parentNode;
        function makeItem(label, fn) {
            var div = document.createElement('div');
            div.className = styleSrc.className;
            div.setAttribute('data-mmc-item', '1');
            div.textContent = label;
            div.style.cursor = 'pointer';
            div.addEventListener('click', function (ev) { ev.stopPropagation(); fn(); });
            return div;
        }
        menu.appendChild(makeItem('\uD83D\uDCBE \u4FDD\u5B58\u8349\u7A3F\u5230\u793E\u533A', function () { saveDraft(false); }));
        menu.appendChild(makeItem('\uD83D\uDCE4 \u53D1\u5E03\u5230\u793E\u533A', publishToCommunity));
    }
    var HIDE_KEYS = ['查看作品', '作品页面', 'See project page', 'TurboWarp Feedback', 'TurboWarp 反馈'];
    function hideTopButtons() {
        /* 全量叶子扫描：顶栏按钮可能是无 role 的普通 div；用子串匹配防翻译差异 */
        var all = document.getElementsByTagName('*');
        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.children.length !== 0) continue;
            var t = (el.textContent || '').trim();
            if (!t) continue;
            var hit = false;
            for (var k = 0; k < HIDE_KEYS.length; k++) {
                if (t.indexOf(HIDE_KEYS[k]) !== -1) { hit = true; break; }
            }
            if (!hit) continue;
            /* 向上找可点击容器隐藏 */
            var p = el, target = null;
            for (var d = 0; d < 4 && p && p !== document.body; d++) {
                var tag = (p.tagName || '').toLowerCase();
                var pc = cls(p);
                if (tag === 'button' || tag === 'a' || p.getAttribute('role') === 'button' ||
                    pc.indexOf('button') !== -1) { target = p; break; }
                p = p.parentNode;
            }
            (target || el.parentNode || el).style.display = 'none';
        }
    }
    /* 防抖：React 启动时有数千次 DOM 变更，全量扫描必须节流，否则页面卡死 */
    var _scanTimer = null;
    function scheduleScan() {
        if (_scanTimer) return;
        _scanTimer = setTimeout(function () {
            _scanTimer = null;
            try { tryInjectMenu(); } catch (e) {}
            try { hideTopButtons(); } catch (e) {}
        }, 400);
    }
    var obs = new MutationObserver(scheduleScan);

    function build() {
        if (document.getElementById('mmc-autosave')) return;
        /* 自动保存状态 pill（左下角） */
        var pill = document.createElement('div');
        pill.id = 'mmc-autosave';
        pill.textContent = '☁️ 自动保存已开启';
        pill.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:99999;' +
            'background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:6px 12px;border-radius:14px;' +
            'pointer-events:none;';
        document.body.appendChild(pill);
        if (document.body) obs.observe(document.body, { childList: true, subtree: true });
        try { tryInjectMenu(); } catch (e) {}
        try { hideTopButtons(); } catch (e) {}
        /* 兜底：React 懒渲染，30 秒内多次重试 */
        var retryN = 0;
        var retryTimer = setInterval(function () {
            try { tryInjectMenu(); } catch (e) {}
            try { hideTopButtons(); } catch (e) {}
            if (++retryN >= 15) clearInterval(retryTimer);
        }, 2000);
        /* 自动保存（仅新标签页独立模式；内嵌时由父页面负责）
           间隔可在社区「⚙️ 个人设置」里调整，存在 localStorage.mmc_autosave_interval */
        if (!EMBEDDED) {
            var AUTOSAVE_MS = 90000;
            try {
                var _ms = parseInt(localStorage.getItem('mmc_autosave_interval') || '90000', 10);
                if (!isNaN(_ms) && _ms >= 0) AUTOSAVE_MS = _ms;
            } catch (e) {}
            if (AUTOSAVE_MS > 0) {
                setInterval(function () { saveDraft(true); }, AUTOSAVE_MS);
            } else {
                var _pill = document.getElementById('mmc-autosave');
                if (_pill) _pill.textContent = '⏸️ 自动保存已关闭';
            }
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', build);
    } else { build(); }
    setTimeout(build, 3000);
})();
</script>
