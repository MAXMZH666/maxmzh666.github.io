<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK 专区 · MAX 应用商店</title>
<meta name="description" content="MAX 应用商店 Android（APK）专区：官方 Android 应用列表、安卓上同样能用的网页应用、APK 安装帮助与应用投稿入口。">
<style>
    * { box-sizing: border-box; }
    :root { --bg: #0d1120; --card: #151a2e; --panel: #171d33; --text: #e8ecf8; --sub: #c6cdea; --muted: #9aa5c7; --faint: #5f6a8c; --border: rgba(255,255,255,.15); --border-soft: rgba(255,255,255,.09); --soft-bg: rgba(255,255,255,.04); }
    :root[data-theme="light"] { --bg: #f2f4fb; --card: #ffffff; --panel: #ffffff; --text: #1d2436; --sub: #3d4763; --muted: #66718c; --faint: #98a1b8; --border: rgba(23,32,68,.16); --border-soft: rgba(23,32,68,.1); --soft-bg: rgba(23,32,68,.04); }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 22px 18px 60px; }
    header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .back { color: var(--sub); text-decoration: none; font-size: 14.5px; border: 1px solid var(--border-soft); background: var(--card); padding: 8px 14px; border-radius: 999px; }
    #theme-toggle { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 17px; cursor: pointer; }
    h1 { font-size: 28px; margin: 26px 0 8px; }
    h2.sec { font-size: 20px; margin: 30px 0 12px; }
    .intro { color: var(--muted); line-height: 1.8; margin: 0 0 8px; font-size: 15px; }
    .card { background: var(--card); border: 1px solid var(--border-soft); border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; }
    .card p, .card li { color: var(--muted); line-height: 1.85; font-size: 14.5px; }
    .app { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--border-soft); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .app .ic { font-size: 34px; background: var(--soft-bg); border-radius: 12px; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; flex: none; }
    .app .nm { font-weight: 700; font-size: 16.5px; }
    .app .ds { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .btn { margin-left: auto; flex: none; align-self: center; display: inline-block; background: linear-gradient(135deg, #4d7cfe, #6d5cff); color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 10px; font-size: 14px; }
    .btn.ghost { background: var(--soft-bg); border: 1px solid var(--border); color: var(--sub); }
    .empty { text-align: center; color: var(--muted); border: 1.5px dashed var(--border); border-radius: 16px; padding: 34px 18px; line-height: 1.9; font-size: 14.5px; }
    .empty .big { font-size: 38px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    footer { text-align: center; color: var(--faint); font-size: 13px; padding: 26px 0 6px; line-height: 2; }
    footer a { color: var(--muted); }
    a { color: #7ea2ff; }
</style>
<script>(function(){try{var t=localStorage.getItem('maxstore_theme')||'auto';if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
</head>
<body>
<div class="wrap">
    <header class="top">
        <a class="back" href="https://store.maxmzh.com/">← MAX 应用商店</a>
        <button id="theme-toggle" title="切换主题">🌗</button>
    </header>

    <h1>📱 APK 专区（Android）</h1>
    <p class="intro">这里汇总商店里给安卓手机用的应用。需要说明的是：MAX 官方应用目前以网页应用为主，安卓手机打开就能用、不必装 APK；真正的 APK 安装包上架后会出现在这里。</p>

    <h2 class="sec">官方 Android 应用</h2>
    <div id="apk-list"><div class="empty"><div class="big">⏳</div>正在加载…</div></div>

    <h2 class="sec">安卓上一样能用的网页应用</h2>
    <div id="web-list"></div>

    <div class="card">
        <p>📖 第一次装 APK 或遇到安装失败？看 <a href="https://store.maxmzh.com/tools.html">安装工具</a> 页里的通用步骤和排查办法。有好用的安卓应用想分享？欢迎 <a href="https://store.maxmzh.com/submit.html">投稿</a>。</p>
    </div>

    <footer>
        © 2026 MAXMZH · MAX 应用商店，由 MAXMZH 开发与维护<br>
        <a href="https://store.maxmzh.com/">商店首页</a> · <a href="https://forum.maxmzh.com/">MAX论坛</a> · <a href="https://maxmzh.com/">主站</a>
    </footer>
</div>
<script src="https://maxmzh.com/js/max-account.js?v=20261114c"></script>
<script>
(function () {
    var MODES = ['auto', 'light', 'dark'];
    function resolve(m) { return m === 'auto' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m; }
    document.getElementById('theme-toggle').addEventListener('click', function () {
        var cur = 'auto';
        try { cur = localStorage.getItem('maxstore_theme') || 'auto'; } catch (e) {}
        var next = MODES[(MODES.indexOf(cur) + 1) % MODES.length];
        try { localStorage.setItem('maxstore_theme', next); } catch (e) {}
        document.documentElement.dataset.theme = resolve(next);
    });
})();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function card(a, idx) {
    return '<div class="app"><div class="ic">' + esc(a.icon || '📱') + '</div>' +
        '<div><div class="nm">' + esc(a.name) + '</div><div class="ds">' + esc(a.desc || '') + '</div></div>' +
        '<a class="btn ghost" href="https://store.maxmzh.com/#app-' + idx + '">查看详情</a></div>';
}
fetch('store-apps.json').then(function (r) { return r.json(); }).then(function (d) {
    var apps = d.apps || [];
    var android = [], web = [];
    apps.forEach(function (a, i) {
        if (a.platform === 'android') android.push(card(a, i));
        if (a.platform === 'web') web.push(card(a, i));
    });
    document.getElementById('apk-list').innerHTML = android.length ? android.join('') :
        '<div class="empty"><div class="big">📱</div>目前还没有上架的官方 APK 应用。<br>先用下面的网页应用吧，安卓手机打开就能用，效果一样。</div>';
    document.getElementById('web-list').innerHTML = web.join('');
}).catch(function () {
    document.getElementById('apk-list').innerHTML = '<div class="empty"><div class="big">⚠️</div>列表加载失败，请刷新重试。</div>';
});
</script>
</body>
</html>
