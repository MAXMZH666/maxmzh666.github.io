    <script>
    (async function () {
        await renderSubHeader();
        var sb = window.sb;
        var id = new URLSearchParams(location.search).get('id');
        var wrap = document.getElementById('thread-wrap');
        if (!id) { wrap.innerHTML = '<p class="works-note">缺少帖子 ID。</p>'; return; }
        var me = await currentUser(), prof = me ? await currentProfile() : null;
        var isAdmin = !!(prof && prof.is_admin);
        var thread;
        try {
            var tr = await sb.from('forum_threads').select('*').eq('id', id).single();
            if (tr.error) throw tr.error;
            thread = tr.data;
            try { await sb.rpc('increment_thread_views', { tid: id }); } catch (e) {}
            var cr = await sb.from('forum_categories').select('name,icon').eq('id', thread.category_id).single();
            var cat = cr.data || {};
            var ar = await sb.from('profiles').select('username').eq('id', thread.author_id).single();
            var aname = (ar.data && ar.data.username) || '未知';
            document.title = thread.title + ' - MAXMZH 社区';
            var h = '<h1 class="section-title" style="font-size:1.4rem">' + (thread.is_pinned ? '📌 ' : '') + esc(thread.title) + '</h1>' +
                '<p class="section-sub"><span class="tag">' + esc((cat.icon || '') + ' ' + (cat.name || '')) + '</span> ' +
                esc(aname) + ' · ' + fmtDate(thread.created_at) + ' · 👁 ' + thread.views + ' · 💬 ' + thread.reply_count +
                (thread.is_locked ? ' · 🔒 已锁定' : '') + '</p>';
            /* 管理条 */
            var bar = document.getElementById('admin-bar'), btns = [];
            if (isAdmin) {
                btns.push('<button data-act="pin">' + (thread.is_pinned ? '取消置顶' : '📌 置顶') + '</button>');
                btns.push('<button data-act="lock">' + (thread.is_locked ? '解锁' : '🔒 锁定') + '</button>');
            }
            if (isAdmin || (me && me.id === thread.author_id)) {
                btns.push('<button data-act="del" class="danger">🗑 删除主题</button>');
            }
            if (btns.length) { bar.style.display = 'flex'; bar.innerHTML = btns.join(''); }
            wrap.innerHTML = h;
            bar.querySelectorAll('button').forEach(function (b) {
                b.addEventListener('click', async function () {
                    var act = b.getAttribute('data-act');
                    try {
                        if (act === 'del') {
                            if (!confirm('确定删除整个主题（含全部回帖）吗？')) return;
                            var dr = await sb.from('forum_threads').delete().eq('id', id);
                            if (dr.error) throw dr.error;
                            location.href = 'community-forum.html'; return;
                        }
                        var upd = act === 'pin' ? { is_pinned: !thread.is_pinned } : { is_locked: !thread.is_locked };
                        var ur = await sb.from('forum_threads').update(upd).eq('id', id);
                        if (ur.error) throw ur.error;
                        location.reload();
                    } catch (e) { alert('操作失败：' + e.message); }
                });
            });
        } catch (e) { wrap.innerHTML = '<p class="works-note">帖子不存在或加载失败。</p>'; return; }
        /* 回帖列表（含楼中楼回复） */
        var replyToPost = null; /* {id, name} 正在回复的回帖 */
        async function loadPosts() {
            var list = document.getElementById('post-list');
            try {
                var pr = await sb.from('forum_posts').select('*').eq('thread_id', id).order('created_at');
                if (pr.error) throw pr.error;
                var posts = pr.data || [];
                if (!posts.length) { list.innerHTML = '<p class="works-note">还没有回帖，来抢沙发！</p>'; return; }
                var aids = Array.from(new Set(posts.map(function (p) { return p.author_id; })));
                var unames = {};
                var ur2 = await sb.from('profiles').select('id,username').in('id', aids);
                (ur2.data || []).forEach(function (p) { unames[p.id] = p.username; });
                /* 建树：顶层楼按时间排楼层，子回复嵌套展示 */
                var byId = {};
                posts.forEach(function (p) { p.children = []; byId[p.id] = p; });
                var roots = [];
                posts.forEach(function (p) {
                    if (p.parent_id && byId[p.parent_id]) byId[p.parent_id].children.push(p);
                    else roots.push(p);
                });
                function renderPost(p, floor, depth) {
                    var canDel = isAdmin || (me && me.id === p.author_id);
                    var cls = 'post' + (depth > 0 ? ' post-reply' : '') + (floor === 1 && depth === 0 ? ' op' : '');
                    var h = '<div class="' + cls + '"><div class="post-head">' +
                        (depth === 0 ? '<span class="floor">' + floor + '楼</span>' : '<span class="floor">↳ 回复</span>') +
                        '<span class="uname">' + esc(unames[p.author_id] || '未知') + '</span>' +
                        '<span>' + fmtDate(p.created_at) + '</span></div>' +
                        '<div class="post-body">' + md(p.content) + '</div>' +
                        '<div class="post-actions">' +
                        (me ? '<a data-reply-post="' + p.id + '" data-reply-name="' + esc(unames[p.author_id] || '未知') + '">回复</a>' : '') +
                        (canDel ? '<a data-del="' + p.id + '">删除</a>' : '') + '</div></div>';
                    (p.children || []).forEach(function (ch) { h += renderPost(ch, 0, depth + 1); });
                    return h;
                }
                list.innerHTML = roots.map(function (p, i) { return renderPost(p, i + 1, 0); }).join('');
                list.querySelectorAll('[data-del]').forEach(function (a) {
                    a.addEventListener('click', async function () {
                        if (!confirm('确定删除这条回帖吗？子回复也会一起删除。')) return;
                        var dr = await sb.from('forum_posts').delete().eq('id', a.getAttribute('data-del'));
                        if (dr.error) { alert('删除失败：' + dr.error.message); return; }
                        loadPosts();
                    });
                });
                /* 回复某楼 */
                list.querySelectorAll('[data-reply-post]').forEach(function (a) {
                    a.addEventListener('click', function () {
                        replyToPost = { id: a.getAttribute('data-reply-post'), name: a.getAttribute('data-reply-name') };
                        var ta = document.getElementById('reply-content');
                        ta.placeholder = '回复 @' + replyToPost.name + '：';
                        ta.focus();
                        try { ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
                        document.getElementById('reply-msg').textContent = '正在回复 @' + replyToPost.name + '（点击可取消）';
                    });
                });
            } catch (e) { list.innerHTML = '<p class="works-note">回帖加载失败：' + esc(e.message) + '</p>'; }
        }
        /* 🧧 积分红包 */
        injectRedPacketCSS();
        initRedPacketModal();
        /* 红包按钮（仅登录可见） */
        if (me) document.getElementById('rp-btn-wrap').innerHTML = redPacketButton('comment', id);
        /* 红包发送成功回调：在回帖列表顶部插入红包卡片 */
        function onRedPacketSent(packetId) {
            renderRedPacket(packetId).then(function (html) {
                if (!html) return;
                var list = document.getElementById('post-list');
                var wrap = document.createElement('div');
                wrap.innerHTML = html;
                list.insertBefore(wrap.firstChild, list.firstChild);
            });
        }
        bindRedPacketButtons(document, onRedPacketSent);
        bindRedPacketClaim(document);
        /* 加载该帖子的红包，渲染在回帖列表顶部 */
        async function loadRedPackets() {
            var list = document.getElementById('post-list');
            if (!list) return;
            try {
                var r = await sb.from('red_packets').select('id')
                    .eq('context_type', 'comment').eq('context_id', id)
                    .order('created_at', { ascending: false }).limit(20);
                if (r.error || !r.data || !r.data.length) return;
                var ids = r.data.map(function (x) { return x.id; });
                var htmls = await Promise.all(ids.map(function (pid) { return renderRedPacket(pid); }));
                var html = htmls.filter(function (h) { return h; }).join('');
                if (html) {
                    var wrap = document.createElement('div');
                    wrap.innerHTML = html;
                    list.insertBefore(wrap, list.firstChild);
                }
            } catch (e) {}
        }
        await loadPosts();
        await loadRedPackets();
        /* 点击提示可取消回复目标 */
        document.getElementById('reply-msg').addEventListener('click', function () {
            if (replyToPost) {
                replyToPost = null;
                document.getElementById('reply-content').placeholder = '说点什么…（支持 Markdown）';
                this.textContent = '';
            }
        });
        /* 回帖框 */
        if (!me) document.getElementById('reply-need-login').style.display = '';
        else if (thread.is_locked && !isAdmin) document.getElementById('reply-locked').style.display = '';
        else {
            document.getElementById('reply-form').style.display = '';
            document.getElementById('reply-submit').addEventListener('click', async function () {
                var c = document.getElementById('reply-content').value.trim();
                var msg = document.getElementById('reply-msg');
                if (!c) { msg.textContent = '请填写回帖内容'; return; }
                /* 回复时自动 @ 被回复者 */
                var ppid = replyToPost ? replyToPost.id : null;
                if (replyToPost && c.indexOf('@' + replyToPost.name) === -1) c = '@' + replyToPost.name + ' ' + c;
                this.disabled = true; msg.textContent = '发表中…';
                try {
                    var payload = { thread_id: id, author_id: me.id, content: c };
                    if (ppid) payload.parent_id = ppid;
                    var ir = await sb.from('forum_posts').insert(payload);
                    if (ir.error) throw ir.error;
                    document.getElementById('reply-content').value = '';
                    document.getElementById('reply-content').placeholder = '说点什么…（支持 Markdown）';
                    replyToPost = null;
                    msg.textContent = '';
                    try { await sendMentions(c, me.id, id, 'thread'); } catch (e) {}
                    await loadPosts();
                } catch (e) { msg.textContent = '发表失败：' + e.message; }
                this.disabled = false;
            });
        }
    })();
        try { var rh = document.getElementById('reply-mdhelp'); if (rh) rh.innerHTML = mdHelpBtn('reply-content'); } catch (e) {}
</script>
