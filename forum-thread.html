    <style>
        .post { border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; background: var(--card, rgba(255,255,255,.02)); }
        .post.op { border-color: rgba(77,124,254,.4); }
        .post-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
        .post-head .floor { font-weight: 700; color: var(--accent, #4d7cfe); }
        .post-head .uname { font-weight: 600; color: inherit; }
        .post-body { white-space: pre-wrap; word-break: break-word; line-height: 1.7; }
        .post-actions { margin-top: 8px; font-size: .82rem; }
        .post-actions a { color: var(--muted); margin-right: 12px; cursor: pointer; text-decoration: none; }
        .post-actions a:hover { color: var(--accent, #4d7cfe); }
        .thread-admin { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        .thread-admin button { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: transparent; color: inherit; cursor: pointer; font-size: .85rem; }
        .thread-admin button.danger { color: #ff5d5d; border-color: rgba(255,93,93,.4); }
        #reply-box textarea { width: 100%; min-height: 110px; padding: 12px; border-radius: 10px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--card, rgba(255,255,255,.03)); color: inherit; font-size: .95rem; box-sizing: border-box; resize: vertical; }
        .post-head img.p-ava, .post-head .p-ava { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; }
        .p-ava-fallback { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #4d7cfe, #6d5cff); color: #fff; font-weight: 700; font-size: .8rem; }
        .badge-op, .badge-admin { font-size: .68rem; padding: 1px 7px; border-radius: 999px; font-weight: 700; }
        .badge-op { background: rgba(77,124,254,.18); color: #7ea4ff; border: 1px solid rgba(77,124,254,.45); }
        .badge-admin { background: rgba(245,197,66,.16); color: #f5c542; border: 1px solid rgba(245,197,66,.45); }
        .post-head a.floor { text-decoration: none; }
        .post-head a.uname { text-decoration: none; }
        .post-head a.uname:hover { color: var(--accent, #4d7cfe); }
        .post-actions a.liked { color: var(--accent, #4d7cfe); font-weight: 700; }
        .post-actions .like-static { color: var(--muted); margin-right: 12px; }
        .thread-tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; font-size: .88rem; }
        .thread-tools button { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: transparent; color: inherit; cursor: pointer; font-size: .85rem; }
        .thread-tools a { color: var(--muted); cursor: pointer; text-decoration: none; }
        .thread-tools a:hover { color: var(--accent, #4d7cfe); }
        .thread-tools label { color: var(--muted); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
        .edit-ta { width: 100%; min-height: 110px; padding: 10px; border-radius: 10px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--card, rgba(255,255,255,.03)); color: inherit; box-sizing: border-box; resize: vertical; font-size: .95rem; }
        .edit-save, .edit-cancel { padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: transparent; color: inherit; cursor: pointer; }
        .edit-save { background: var(--accent, #4d7cfe); color: #fff; border: none; }
        .rel-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--border, rgba(255,255,255,.06)); margin: 0; }
        .rel-row a { color: inherit; text-decoration: none; }
        .rel-row a:hover { color: var(--accent, #4d7cfe); }
        .rel-row span { color: var(--muted); font-size: .82rem; white-space: nowrap; }
    </style>

    <script>
    (async function () {
        var sb = window.sb;
        var id = new URLSearchParams(location.search).get('id');
        var wrap = document.getElementById('thread-wrap');
        if (!id) { wrap.innerHTML = '<p class="works-note">缺少帖子 ID。</p>'; return; }
        var me = await currentUser(), prof = me ? await currentProfile() : null;
        var isAdmin = !!(prof && prof.is_admin);
        var thread;
        try {
            var tr = await sb.from('forum_threads').select('*').eq('id', id).single();
            if (tr.error) throw tr.error;
            thread = tr.data;
            try { await sb.rpc('increment_thread_views', { tid: id }); } catch (e) {}
            var both = await Promise.all([
                sb.from('forum_categories').select('name,icon').eq('id', thread.category_id).single(),
                sb.from('profiles').select('username').eq('id', thread.author_id).single()
            ]);
            var cat = both[0].data || {};
            var aname = (both[1].data && both[1].data.username) || '未知';
            document.title = thread.title + ' - MAX论坛';
            var h = '<h1 class="section-title" style="font-size:1.4rem">' + (thread.is_pinned ? '📌 ' : '') + esc(thread.title) + '</h1>' +
                '<p class="section-sub"><span class="tag">' + esc((cat.icon || '') + ' ' + (cat.name || '')) + '</span> ' +
                esc(aname) + ' · ' + fmtDate(thread.created_at) + ' · 👁 ' + thread.views + ' · 💬 ' + thread.reply_count +
                (thread.is_locked ? ' · 🔒 已锁定' : '') + '</p>';
            /* 管理条 */
            var bar = document.getElementById('admin-bar'), btns = [];
            if (isAdmin) {
                btns.push('<button data-act="pin">' + (thread.is_pinned ? '取消置顶' : '📌 置顶') + '</button>');
                btns.push('<button data-act="lock">' + (thread.is_locked ? '解锁' : '🔒 锁定') + '</button>');
            }
            if (isAdmin || (me && me.id === thread.author_id)) {
                btns.push('<button data-act="title">✏️ 改标题</button>');
                btns.push('<button data-act="del" class="danger">🗑 删除主题</button>');
            }
            if (btns.length) { bar.style.display = 'flex'; bar.innerHTML = btns.join(''); }
            wrap.innerHTML = h;
            bar.querySelectorAll('button').forEach(function (b) {
                b.addEventListener('click', async function () {
                    var act = b.getAttribute('data-act');
                    try {
                        if (act === 'del') {
                            if (!confirm('确定删除整个主题（含全部回帖）吗？')) return;
                            var dr = await sb.from('forum_threads').delete().eq('id', id);
                            if (dr.error) throw dr.error;
                            location.href = 'forum.html'; return;
                        }
                        if (act === 'title') {
                            var nt = prompt('修改标题（最多 80 字）', thread.title);
                            if (nt && nt.trim() && nt.trim() !== thread.title) {
                                var tr2 = await sb.from('forum_threads').update({ title: nt.trim().slice(0, 80) }).eq('id', id);
                                if (tr2.error) throw tr2.error;
                                location.reload();
                            }
                            return;
                        }
                        var upd = act === 'pin' ? { is_pinned: !thread.is_pinned } : { is_locked: !thread.is_locked };
                        var ur = await sb.from('forum_threads').update(upd).eq('id', id);
                        if (ur.error) throw ur.error;
                        location.reload();
                    } catch (e) { alert('操作失败：' + e.message); }
                });
            });
        } catch (e) { wrap.innerHTML = '<p class="works-note">帖子不存在或加载失败。</p>'; return; }
        /* 回帖列表（含楼中楼回复）：头像/徽章、点赞、编辑、分批显示、只看楼主 */
        var replyToPost = null; /* {id, name} 正在回复的回帖 */
        var postRaw = {}, postAuthor = {}, decorMap = {}, likeCounts = {}, myLikes = {}, profMap = {};
        var allRoots = [], shownRoots = 20, onlyOp = false;
        function postAva(pid) {
            var p = profMap[pid] || {};
            var name = p.username || '未知';
            var dec = decorMap[pid] || {};
            var fc = dec.frame ? ' avatar-frame ' + dec.frame.item_data : '';
            return p.avatar_url
                ? '<img class="p-ava' + fc + '" src="' + esc(p.avatar_url) + '" alt="" loading="lazy">'
                : '<span class="p-ava p-ava-fallback' + fc + '">' + esc(name.slice(0, 1).toUpperCase()) + '</span>';
        }
        function renderPost(p, floor, depth) {
            var prof = profMap[p.author_id] || {};
            var name = prof.username || '未知';
            var canDel = isAdmin || (me && me.id === p.author_id);
            var canEdit = !!(me && me.id === p.author_id);
            var cls = 'post' + (depth > 0 ? ' post-reply' : '') + (floor === 1 && depth === 0 ? ' op' : '');
            var badges = '';
            if (p.author_id === thread.author_id) badges += ' <span class="badge-op">楼主</span>';
            if (prof.is_admin) badges += ' <span class="badge-admin">管理员</span>';
            var decP = decorMap[p.author_id] || {};
            var titleHtml = decP.title ? '<span class="title-pill">' + esc(decP.title.item_data) + '</span>' : '';
            var lvHtml = (window.Growth && prof.exp != null) ? Growth.badge(prof.exp) : '';
            var lc = likeCounts[p.id] || 0;
            var hh = '<div class="' + cls + '" id="post-' + p.id + '"><div class="post-head">' +
                postAva(p.author_id) +
                (depth === 0 ? '<a class="floor" href="#post-' + p.id + '">' + floor + '楼</a>' : '<span class="floor">↳ 回复</span>') +
                titleHtml + '<a class="uname" href="https://maxmzh.com/community-user.html?username=' + encodeURIComponent(name) + '">' + esc(name) + '</a>' + badges + lvHtml +
                '<span>' + fmtDate(p.created_at) + '</span>' +
                (p.edited_at ? '<span>· 已编辑</span>' : '') + '</div>' +
                '<div class="post-body">' + md(p.content) + '</div>' +
                '<div class="post-actions">' +
                (me ? '<a data-like="' + p.id + '"' + (myLikes[p.id] ? ' class="liked"' : '') + '>👍 ' + (lc ? lc : '赞') + '</a>' : '<span class="like-static">👍 ' + lc + '</span>') +
                (me ? '<a data-reply-post="' + p.id + '" data-reply-name="' + esc(name) + '">回复</a>' : '') +
                (canEdit ? '<a data-edit="' + p.id + '">编辑</a>' : '') +
                (canDel ? '<a data-del="' + p.id + '">删除</a>' : '') + '</div></div>';
            (p.children || []).forEach(function (ch) { hh += renderPost(ch, 0, depth + 1); });
            return hh;
        }
        function renderPosts() {
            var list = document.getElementById('post-list');
            var roots = onlyOp ? allRoots.filter(function (p) { return p.author_id === thread.author_id; }) : allRoots;
            if (!roots.length) {
                list.innerHTML = '<p class="works-note">' + (onlyOp ? '楼主还没有发言。' : '还没有回帖，来抢沙发！') + '</p>';
            } else {
                list.innerHTML = roots.slice(0, shownRoots).map(function (p) { return renderPost(p, allRoots.indexOf(p) + 1, 0); }).join('');
            }
            var mw = document.getElementById('posts-more-wrap');
            if (mw) mw.hidden = roots.length <= shownRoots;
            bindPostActions(list);
        }
        function bindPostActions(list) {
            list.querySelectorAll('[data-del]').forEach(function (a) {
                a.addEventListener('click', async function () {
                    if (!confirm('确定删除这条回帖吗？子回复也会一起删除。')) return;
                    var dr = await sb.from('forum_posts').delete().eq('id', a.getAttribute('data-del'));
                    if (dr.error) { alert('删除失败：' + dr.error.message); return; }
                    loadPosts();
                });
            });
            list.querySelectorAll('[data-reply-post]').forEach(function (a) {
                a.addEventListener('click', function () {
                    replyToPost = { id: a.getAttribute('data-reply-post'), name: a.getAttribute('data-reply-name') };
                    var ta = document.getElementById('reply-content');
                    ta.placeholder = '回复 @' + replyToPost.name + '：';
                    ta.focus();
                    try { ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
                    document.getElementById('reply-msg').textContent = '正在回复 @' + replyToPost.name + '（点击可取消）';
                });
            });
            list.querySelectorAll('[data-like]').forEach(function (a) {
                a.addEventListener('click', async function () {
                    var pid = a.getAttribute('data-like');
                    try {
                        if (myLikes[pid]) {
                            var dr = await sb.from('forum_post_likes').delete().eq('post_id', pid).eq('user_id', me.id);
                            if (dr.error) throw dr.error;
                            delete myLikes[pid]; likeCounts[pid] = Math.max(0, (likeCounts[pid] || 1) - 1);
                        } else {
                            var ir = await sb.from('forum_post_likes').insert({ post_id: pid, user_id: me.id });
                            if (ir.error) throw ir.error;
                            myLikes[pid] = 1; likeCounts[pid] = (likeCounts[pid] || 0) + 1;
                            if (window.Growth && postAuthor[pid] && postAuthor[pid] !== me.id) Growth.awardExp(sb, postAuthor[pid], 2, '回帖被点赞', 'like:' + pid + ':' + me.id);
                        }
                        renderPosts();
                    } catch (e) { alert('点赞失败：' + e.message); }
                });
            });
            list.querySelectorAll('[data-edit]').forEach(function (a) {
                a.addEventListener('click', function () {
                    var pid = a.getAttribute('data-edit');
                    var postEl = document.getElementById('post-' + pid);
                    if (!postEl) return;
                    var body = postEl.querySelector('.post-body');
                    if (body.querySelector('textarea')) return;
                    body.innerHTML = '<textarea class="edit-ta" maxlength="5000"></textarea>' +
                        '<p style="margin-top:8px"><button class="edit-save" type="button">保存</button> <button class="edit-cancel" type="button">取消</button> <span class="works-note edit-msg" style="display:inline"></span></p>';
                    var ta = body.querySelector('textarea');
                    ta.value = postRaw[pid] || '';
                    ta.focus();
                    body.querySelector('.edit-cancel').addEventListener('click', function () { renderPosts(); });
                    body.querySelector('.edit-save').addEventListener('click', async function () {
                        var v = ta.value.trim(), msg = body.querySelector('.edit-msg');
                        if (!v) { msg.textContent = '内容不能为空'; return; }
                        this.disabled = true; msg.textContent = '保存中…';
                        var ur = await sb.from('forum_posts').update({ content: v, edited_at: new Date().toISOString() }).eq('id', pid);
                        if (ur.error) { msg.textContent = '保存失败：' + ur.error.message; this.disabled = false; return; }
                        loadPosts();
                    });
                });
            });
        }
        async function loadPosts() {
            var list = document.getElementById('post-list');
            try {
                var pr = await sb.from('forum_posts').select('*').eq('thread_id', id).order('created_at');
                if (pr.error) throw pr.error;
                var posts = pr.data || [];
                postRaw = {}; postAuthor = {}; posts.forEach(function (p) { postRaw[p.id] = p.content; postAuthor[p.id] = p.author_id; });
                var aids = Array.from(new Set(posts.map(function (p) { return p.author_id; })));
                if (aids.length) {
                    var ur2 = await sb.from('profiles').select('id,username,avatar_url,is_admin,exp').in('id', aids);
                    (ur2.data || []).forEach(function (p) { profMap[p.id] = p; });
                }
                if (aids.length && window.Growth) { Growth.ensureCss(); decorMap = await Growth.decorOf(sb, aids); }
                likeCounts = {}; myLikes = {};
                if (posts.length) {
                    var lr = await sb.from('forum_post_likes').select('post_id,user_id').in('post_id', posts.map(function (p) { return p.id; }));
                    (lr.data || []).forEach(function (r) {
                        likeCounts[r.post_id] = (likeCounts[r.post_id] || 0) + 1;
                        if (me && r.user_id === me.id) myLikes[r.post_id] = 1;
                    });
                }
                var byId = {};
                posts.forEach(function (p) { p.children = []; byId[p.id] = p; });
                allRoots = [];
                posts.forEach(function (p) {
                    if (p.parent_id && byId[p.parent_id]) byId[p.parent_id].children.push(p);
                    else allRoots.push(p);
                });
                renderPosts();
            } catch (e) { list.innerHTML = '<p class="works-note">回帖加载失败：' + esc(e.message) + '</p>'; }
        }
        /* 🧧 积分红包 */
        injectRedPacketCSS();
        initRedPacketModal();
        if (me) document.getElementById('rp-btn-wrap').innerHTML = redPacketButton('comment', id);
        function onRedPacketSent(packetId) { loadRedPackets(); }
        bindRedPacketButtons(document, onRedPacketSent);
        bindRedPacketClaim(document);
        async function loadRedPackets() {
            var box = document.getElementById('rp-list');
            if (!box) return;
            try {
                var r = await sb.from('red_packets').select('id')
                    .eq('context_type', 'comment').eq('context_id', id)
                    .order('created_at', { ascending: false }).limit(20);
                if (r.error || !r.data || !r.data.length) { box.innerHTML = ''; return; }
                var ids = r.data.map(function (x) { return x.id; });
                var htmls = await Promise.all(ids.map(function (pid) { return renderRedPacket(pid); }));
                box.innerHTML = htmls.filter(function (hh) { return hh; }).join('');
            } catch (e) {}
        }
        await loadPosts();
        await loadRedPackets();
        /* 工具条：分享 / 只看楼主 / 跳到最新 / 加载更多 */
        (function () {
            var tools = document.getElementById('thread-tools');
            if (tools) tools.style.display = 'flex';
            var shareBtn = document.getElementById('share-btn');
            if (shareBtn) shareBtn.addEventListener('click', async function () {
                var url = location.href.split('#')[0];
                if (navigator.share) { try { await navigator.share({ title: thread.title, url: url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
                try { await navigator.clipboard.writeText(url); alert('链接已复制，去分享给朋友吧'); }
                catch (e2) { prompt('复制这个链接分享：', url); }
            });
            var opT = document.getElementById('op-toggle');
            if (opT) opT.addEventListener('change', function () { onlyOp = opT.checked; shownRoots = 20; renderPosts(); });
            var gl = document.getElementById('goto-last');
            if (gl) gl.addEventListener('click', function () {
                shownRoots = 100000; renderPosts();
                var ps = document.querySelectorAll('#post-list .post');
                if (ps.length) ps[ps.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
            var pm = document.getElementById('posts-more');
            if (pm) pm.addEventListener('click', function () { shownRoots += 20; renderPosts(); });
        })();
        /* 收藏主题 */
        if (me) {
            var favBtn = document.getElementById('fav-btn');
            if (favBtn) {
                favBtn.style.display = '';
                var favOn = false;
                sb.from('forum_favorites').select('thread_id').eq('thread_id', id).eq('user_id', me.id).then(function (r) {
                    favOn = !!(r.data && r.data.length);
                    favBtn.textContent = favOn ? '⭐ 已收藏' : '☆ 收藏';
                });
                favBtn.addEventListener('click', async function () {
                    try {
                        if (favOn) {
                            var dr = await sb.from('forum_favorites').delete().eq('thread_id', id).eq('user_id', me.id);
                            if (dr.error) throw dr.error;
                            favOn = false;
                        } else {
                            var ir = await sb.from('forum_favorites').insert({ thread_id: id, user_id: me.id });
                            if (ir.error) throw ir.error;
                            favOn = true;
                        }
                        favBtn.textContent = favOn ? '⭐ 已收藏' : '☆ 收藏';
                    } catch (e) { alert('收藏操作失败：' + e.message); }
                });
            }
        }
        /* 相关帖子：同版块最近活跃（排除本帖） */
        (async function () {
            try {
                var rr = await sb.from('forum_threads').select('id,title,reply_count,views').eq('category_id', thread.category_id).neq('id', id).order('updated_at', { ascending: false }).limit(5);
                var rel = rr.data || [];
                if (!rel.length) return;
                document.getElementById('related-wrap').innerHTML =
                    '<h2 class="section-title" style="font-size:1.15rem;margin-top:30px">📌 相关帖子</h2>' +
                    rel.map(function (t) {
                        return '<p class="rel-row"><a href="forum-thread.html?id=' + t.id + '">' + esc(t.title) + '</a><span>💬 ' + t.reply_count + ' · 👁 ' + t.views + '</span></p>';
                    }).join('');
            } catch (e) {}
        })();
        /* 回帖草稿自动保存 + Markdown 预览 */
        (function () {
            var ta = document.getElementById('reply-content');
            if (!ta || !me) return;
            var key = 'forum_draft_' + id;
            try { var d = localStorage.getItem(key); if (d && !ta.value) ta.value = d; } catch (e) {}
            ta.addEventListener('input', function () { try { localStorage.setItem(key, ta.value); } catch (e) {} });
            var pv = document.getElementById('reply-preview-btn'), box = document.getElementById('reply-preview');
            if (pv && box) pv.addEventListener('click', function () {
                if (box.style.display !== 'none') { box.style.display = 'none'; pv.textContent = '👁 预览'; return; }
                box.innerHTML = '<div class="post-body">' + md(ta.value || '（暂无内容）') + '</div>';
                box.style.display = ''; pv.textContent = '收起预览';
            });
        })();
        /* 点击提示可取消回复目标 */
        document.getElementById('reply-msg').addEventListener('click', function () {
            if (replyToPost) {
                replyToPost = null;
                document.getElementById('reply-content').placeholder = '说点什么…（支持 Markdown）';
                this.textContent = '';
            }
        });
        /* 回帖框 */
        if (!me) {
            var rl = document.getElementById('reply-login-a');
            if (rl) rl.href = 'login.html?next=' + encodeURIComponent(location.href);
            document.getElementById('reply-need-login').style.display = '';
        }
        else if (thread.is_locked && !isAdmin) document.getElementById('reply-locked').style.display = '';
        else {
            document.getElementById('reply-form').style.display = '';
            document.getElementById('reply-submit').addEventListener('click', async function () {
                var c = document.getElementById('reply-content').value.trim();
                var msg = document.getElementById('reply-msg');
                if (!c) { msg.textContent = '请填写回帖内容'; return; }
                /* 回复时自动 @ 被回复者 */
                var ppid = replyToPost ? replyToPost.id : null;
                if (replyToPost && c.indexOf('@' + replyToPost.name) === -1) c = '@' + replyToPost.name + ' ' + c;
                this.disabled = true; msg.textContent = '发表中…';
                try {
                    var payload = { thread_id: id, author_id: me.id, content: c };
                    if (ppid) payload.parent_id = ppid;
                    var ir = await sb.from('forum_posts').insert(payload);
                    if (ir.error) throw ir.error;
                    document.getElementById('reply-content').value = '';
                    try { localStorage.removeItem('forum_draft_' + id); } catch (e) {}
                    document.getElementById('reply-content').placeholder = '说点什么…（支持 Markdown）';
                    replyToPost = null;
                    msg.textContent = '';
                    try { await sendMentions(c, me.id, id, 'thread'); } catch (e) {}
                    if (window.Growth) Growth.awardExp(sb, me.id, 3, '发表回帖', null);
                    shownRoots = 100000;
                    await loadPosts();
                } catch (e) { msg.textContent = '发表失败：' + e.message; }
                this.disabled = false;
            });
        }
    })();
        try { var rh = document.getElementById('reply-mdhelp'); if (rh) rh.innerHTML = mdHelpBtn('reply-content'); } catch (e) {}
</script>
    <script>
    /* 论坛账号区：登录走 MAX 账号登录页（同源 login.html，不跳社区登录界面）；已登录显示用户名和退出 */
    (function () {
        var el = document.getElementById('sub-auth');
        if (!el || !window.sb) return;
        function escn(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function render() {
            window.sb.auth.getSession().then(function (r) {
                var s = r && r.data && r.data.session;
                if (!s) { el.innerHTML = '<a href="login.html?next=' + encodeURIComponent(location.href) + '">登录</a>'; return; }
                window.sb.from('profiles').select('username').eq('id', s.user.id).single().then(function (pr) {
                    var name = (pr.data && pr.data.username) || (s.user.email || '').split('@')[0];
                    el.innerHTML = '<a href="https://maxmzh.com/community-user.html?username=' + encodeURIComponent(name) + '">' + escn(name) + '</a> · <a href="#" id="sub-logout">退出</a>';
                    var lo = document.getElementById('sub-logout');
                    if (lo) lo.addEventListener('click', function (e) { e.preventDefault(); window.sb.auth.signOut().then(function () { location.reload(); }); });
                });
            }).catch(function () {});
        }
        render();
        try { window.sb.auth.onAuthStateChange(render); } catch (e) {}
    })();
    </script>
