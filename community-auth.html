            <div id="already" style="display:none;text-align:center">

                <p><a class="btn btn-blue" href="community.html">去社区逛逛</a>

                        </div>

                            我已阅读并同意 <a href="community-legal.html" target="_blank">《用户协议》</a> 和 <a href="community-legal.html" target="_blank">《隐私政策》</a></label>

    <script>
    (async function () {
        await renderSubHeader();
        var params = new URLSearchParams(location.search);
        var next = params.get('next') || 'community.html';
        var verified = params.get('verified') === '1';
        var urlMode = params.get('mode');
        var isRecovery = /type=recovery/.test(location.hash) || params.get('type') === 'recovery' || urlMode === 'recover';

        var sess0 = null;
        try { sess0 = (await sb.auth.getSession()).data.session; } catch (e) {}
        var me = sess0 ? sess0.user : (await currentUser());

        if (me && !verified && !isRecovery) {
            var p = await currentProfile();
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('already').style.display = 'block';
            document.getElementById('already-text').textContent = '你已登录：' + (p ? p.username : me.email);
            document.getElementById('logout-btn').addEventListener('click', async function (e) {
                e.preventDefault();
                await sb.auth.signOut();
                location.reload();
            });
            return;
        }

        var mode = 'login';
        var signupStep2 = false;
        var tabLogin = document.getElementById('tab-login');
        var tabSignup = document.getElementById('tab-signup');
        var rowUser = document.getElementById('row-username');
        var btn = document.getElementById('auth-btn');
        var note = document.getElementById('auth-note');

        function setMode(m) {
            mode = m;
            var isSignup = m === 'signup';
            tabLogin.classList.toggle('active', m === 'login');
            tabSignup.classList.toggle('active', m === 'signup');
            rowUser.style.display = isSignup ? 'block' : 'none';
            document.getElementById('row-email').style.display = 'block';
            document.getElementById('row-email-code').style.display = isSignup ? 'block' : 'none';
            document.getElementById('row-captcha').style.display = 'block';
            /* 注册步骤1：只填用户名/邮箱/验证码并发送验证邮件，密码在点邮件链接回来后设置 */
            document.getElementById('row-password').style.display = isSignup ? 'none' : 'block';
            document.getElementById('forgot-row').style.display = isSignup ? 'none' : 'block';
            document.getElementById('row-legal').style.display = 'block';
            btn.style.display = isSignup ? 'none' : 'block';
            btn.textContent = '登录';
            note.textContent = '';
            note.className = 'form-note';
            drawCaptcha();
            document.getElementById('a-captcha').value = '';
        }

        /* 注册步骤2：从邮件链接回来，设置登录密码 */
        function enterSignupStep2() {
            signupStep2 = true;
            setMode('signup');
            ['row-username', 'row-email', 'row-email-code', 'row-captcha'].forEach(function (id) {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById('row-password').style.display = 'block';
            document.getElementById('row-legal').style.display = 'block';
            document.getElementById('a-legal').checked = false;
            btn.style.display = 'block';
            btn.textContent = '完成注册';
            note.textContent = '邮箱验证成功！设置登录密码即可完成注册';
            note.className = 'form-note ok';
        }
        tabLogin.addEventListener('click', function () { setMode('login'); });
        tabSignup.addEventListener('click', function () { setMode('signup'); });

        /* 图形验证码（防机器人） */
        var captchaCode = '';
        var captchaCanvas = document.getElementById('captcha-canvas');
        function drawCaptcha() {
            var chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            captchaCode = '';
            for (var i = 0; i < 4; i++) captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));
            var ctx = captchaCanvas.getContext('2d');
            ctx.fillStyle = '#16161c';
            ctx.fillRect(0, 0, 120, 44);
            for (var n = 0; n < 5; n++) {
                ctx.strokeStyle = 'rgba(255,204,0,' + (0.15 + Math.random() * 0.25) + ')';
                ctx.beginPath();
                ctx.moveTo(Math.random() * 120, Math.random() * 44);
                ctx.lineTo(Math.random() * 120, Math.random() * 44);
                ctx.stroke();
            }
            for (var j = 0; j < 4; j++) {
                var ch = captchaCode.charAt(j);
                ctx.font = 'bold ' + (24 + Math.floor(Math.random() * 6)) + 'px sans-serif';
                ctx.fillStyle = ['#ffcc00', '#51cf66', '#74c0fc', '#ffa94d'][j % 4];
                ctx.save();
                ctx.translate(18 + j * 26, 30);
                ctx.rotate((Math.random() - 0.5) * 0.5);
                ctx.fillText(ch, 0, 0);
                ctx.restore();
            }
            for (var d = 0; d < 40; d++) {
                ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.3) + ')';
                ctx.fillRect(Math.random() * 120, Math.random() * 44, 1.5, 1.5);
            }
        }
        drawCaptcha();
        captchaCanvas.addEventListener('click', drawCaptcha);

        /* 注册步骤1：发送验证邮件（免费版邮件模板不可自定义，改点链接验证，不用 6 位码） */
        var otpBtn = document.getElementById('send-otp');
        var otpTimer = null;
        otpBtn.addEventListener('click', async function () {
            var email = document.getElementById('a-email').value.trim();
            var username = document.getElementById('a-username').value.trim();
            var captchaInput = document.getElementById('a-captcha').value.trim();
            if (!email) { note.textContent = '请先填写邮箱'; note.className = 'form-note err'; return; }
            if (!username) { note.textContent = '请先填写用户名'; note.className = 'form-note err'; return; }
            if (captchaInput.toLowerCase() !== captchaCode.toLowerCase()) {
                note.textContent = '图形验证码不对，换一张再试试';
                note.className = 'form-note err';
                drawCaptcha();
                document.getElementById('a-captcha').value = '';
                return;
            }
            if (!document.getElementById('a-legal').checked) {
                note.textContent = '请先阅读并同意《用户协议》和《隐私政策》';
                note.className = 'form-note err';
                return;
            }
            otpBtn.disabled = true;
            note.textContent = '正在发送验证邮件…';
            note.className = 'form-note sending';
            try {
                var redirectTo = 'https://maxmzh666.github.io/community-auth.html?mode=signup&verified=1&next=' + encodeURIComponent(next);
                var r = await sb.auth.signInWithOtp({
                    email: email,
                    options: { data: { username: username }, emailRedirectTo: redirectTo }
                });
                if (r.error) throw r.error;
                note.textContent = '验证邮件已发送到 ' + email + '，请去邮箱点击链接完成注册（10 分钟内有效）';
                note.className = 'form-note ok';
                var sec = 60;
                otpBtn.textContent = sec + 's 后重发';
                otpTimer = setInterval(function () {
                    sec--;
                    if (sec <= 0) { clearInterval(otpTimer); otpBtn.disabled = false; otpBtn.textContent = '发送验证邮件'; }
                    else otpBtn.textContent = sec + 's 后重发';
                }, 1000);
            } catch (err) {
                note.textContent = '发送失败：' + (err.message || '请稍后再试');
                note.className = 'form-note err';
                otpBtn.disabled = false;
            }
        });

        document.getElementById('auth-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            /* 重置密码：从邮件链接回来设置新密码 */
            if (recoverMode) {
                var pw3 = document.getElementById('a-password').value;
                if (!pw3 || pw3.length < 6) { note.textContent = '密码至少 6 位'; note.className = 'form-note err'; return; }
                if (btn.disabled) return;
                btn.disabled = true;
                showLoading('正在设置新密码…');
                try {
                    var u3 = await withTimeout(sb.auth.updateUser({ password: pw3 }), 25000, '请求超时，请重试');
                    if (u3.error) throw u3.error;
                    showLoading('设置成功，跳转中…');
                    location.href = 'community.html';
                } catch (err) {
                    hideLoading();
                    note.textContent = '设置失败：' + (err.message || '链接可能已过期，请重新发送重置邮件');
                    note.className = 'form-note err';
                    btn.disabled = false;
                }
                return;
            }
            /* 注册步骤2：从邮件链接回来，只需设置密码 */
            if (signupStep2) {
                var pw2 = document.getElementById('a-password').value;
                if (!pw2 || pw2.length < 6) { note.textContent = '密码至少 6 位'; note.className = 'form-note err'; return; }
                if (!document.getElementById('a-legal').checked) {
                    note.textContent = '请先阅读并同意《用户协议》和《隐私政策》';
                    note.className = 'form-note err';
                    return;
                }
                if (btn.disabled) return;
                btn.disabled = true;
                showLoading('正在完成注册…');
                note.textContent = '正在完成注册…';
                note.className = 'form-note sending';
                try {
                    var u = await withTimeout(sb.auth.updateUser({ password: pw2 }), 25000, '设置密码超时，请检查网络后重试');
                    if (u.error) throw u.error;
                    try { await withTimeout(ensureProfile(), 15000, '创建档案超时'); } catch (e2) {}
                    hideLoading();
                    showLoading('注册成功，跳转中…');
                    location.href = next;
                } catch (err) {
                    hideLoading();
                    note.textContent = '设置密码失败：' + (err.message || '请稍后再试');
                    note.className = 'form-note err';
                    btn.disabled = false;
                }
                return;
            }
            /* 登录：邮箱 + 密码 */
            var email = document.getElementById('a-email').value.trim();
            var password = document.getElementById('a-password').value;
            var captchaInput = document.getElementById('a-captcha').value.trim();
            if (!email || !password) { note.textContent = '请填写邮箱和密码'; note.className = 'form-note err'; return; }
            if (captchaInput.toLowerCase() !== captchaCode.toLowerCase()) {
                note.textContent = '验证码不对，换一张再试试';
                note.className = 'form-note err';
                drawCaptcha();
                document.getElementById('a-captcha').value = '';
                return;
            }
            if (btn.disabled) return;
            btn.disabled = true;
            showLoading('登录中…');
            note.textContent = '登录中…';
            note.className = 'form-note sending';
            try {
                var r2 = await withTimeout(sb.auth.signInWithPassword({ email: email, password: password }), 25000, '登录超时，请检查网络后重试');
                if (r2.error) throw r2.error;
                try { await withTimeout(ensureProfile(), 15000, '加载档案超时'); } catch (e3) {}
                showLoading('登录成功，跳转中…');
                location.href = next;
            } catch (err) {
                hideLoading();
                var msg = err.message || '操作失败';
                if (/invalid login credentials/i.test(msg)) msg = '邮箱或密码不对';
                note.textContent = msg;
                note.className = 'form-note err';
                btn.disabled = false;
            }
        });

        /* 从验证邮件链接回来：已自动登录 */
        if (me && verified) {
            var createdAt = me.created_at ? new Date(me.created_at).getTime() : 0;
            var isNew = (Date.now() - createdAt) < 30 * 60 * 1000;
            if (isNew) { enterSignupStep2(); return; }
            try { await ensureProfile(); } catch (e2) {}
            location.href = next;
            return;
        }

        /* 忘记密码：发重置邮件 */
        document.getElementById('forgot-link').addEventListener('click', async function () {
            var email = document.getElementById('a-email').value.trim();
            if (!email) { note.textContent = '请先在上面填写邮箱'; note.className = 'form-note err'; return; }
            note.textContent = '正在发送重置邮件…';
            note.className = 'form-note sending';
            try {
                var r = await withTimeout(sb.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://maxmzh666.github.io/community-auth.html?mode=recover'
                }), 25000, '发送超时，请检查网络后重试');
                if (r.error) throw r.error;
                note.textContent = '重置邮件已发送到 ' + email + '，请去邮箱点击链接设置新密码';
                note.className = 'form-note ok';
            } catch (err) {
                note.textContent = '发送失败：' + (err.message || '请稍后再试');
                note.className = 'form-note err';
            }
        });

        /* 从重置密码邮件回来：设置新密码 */
        function enterRecover() {
            recoverMode = true;
            tabLogin.classList.add('active'); tabSignup.classList.remove('active');
            ['row-username', 'row-email', 'row-email-code', 'row-captcha'].forEach(function (id) {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById('row-password').style.display = 'block';
            document.getElementById('forgot-row').style.display = 'none';
            document.getElementById('row-legal').style.display = 'none';
            document.querySelector('#row-password label').textContent = '新密码';
            btn.style.display = 'block';
            btn.textContent = '设置新密码';
            note.textContent = '请设置新的登录密码';
            note.className = 'form-note ok';
        }
        var recoverMode = false;

        /* 支持 ?mode=signup 直达注册 */
        setMode(urlMode === 'signup' ? 'signup' : 'login');
        if (verified && !me) {
            note.textContent = '验证链接无效或已过期，请重新发送验证邮件';
            note.className = 'form-note err';
        }
        if (isRecovery && me) { enterRecover(); }
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
