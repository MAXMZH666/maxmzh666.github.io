    <script>
    var TASK_ICONS = {
        login: '📅', publish_work: '📤', like_work: '❤', comment: '💬',
        post_thread: '📝', follow_user: '👥', profile_complete: '👤',
        work_liked: '🌟', followers: '💖'
    };

    function taskCard(t, row) {
        var pct = Math.min(100, Math.round((row.progress / t.target_count) * 100));
        var done = row.completed;
        var btn;
        if (row.claimed) btn = '<button class="btn btn-claim" disabled>已领取</button>';
        else if (done) btn = '<button class="btn btn-blue btn-claim" data-claim="' + row.id + '">领取</button>';
        else btn = '<button class="btn btn-claim" disabled>' + row.progress + '/' + t.target_count + '</button>';
        return '<div class="task-card' + (done ? ' done' : '') + '">' +
            '<div class="task-icon">' + (TASK_ICONS[t.action_type] || '🎯') + '</div>' +
            '<div class="task-main"><div class="task-title">' + esc(t.title) + '</div>' +
            '<div class="task-desc">' + esc(t.description || '') + '</div>' +
            '<div class="task-bar"><div style="width:' + pct + '%"></div></div>' +
            '<div class="task-prog">' + row.progress + ' / ' + t.target_count + '</div></div>' +
            '<div class="task-reward"><div class="tr-pts">+' + t.points + ' 🪙</div>' + btn + '</div></div>';
    }

    async function checkStateTasks(me) {
        /* 状态型任务：完善资料 / 作品获赞 / 粉丝数，打开任务页时结算 */
        try {
            var pr = await sb.from('profiles').select('avatar_url,bio').eq('id', me.id).single();
            if (pr.data && pr.data.avatar_url && pr.data.bio) {
                await recordTaskProgress('profile_complete', 1);
            }
            var wr = await sb.from('works').select('id').eq('author_id', me.id);
            var wids = (wr.data || []).map(function (w) { return w.id; });
            if (wids.length) {
                var lr = await sb.from('likes').select('id').in('work_id', wids);
                var lc = (lr.data || []).length;
                if (lc >= 10) await recordTaskProgress('work_liked', 10);
            }
            var fr = await sb.from('follows').select('id').eq('following_id', me.id);
            if ((fr.data || []).length >= 5) await recordTaskProgress('followers', 5);
        } catch (e) {}
    }

    async function load() {
        var me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('tasks-wrap').style.display = '';
        /* 每日登录任务：打开任务页即算 */
        await recordTaskProgress('login', 1);
        await checkStateTasks(me);
        document.getElementById('my-points').textContent = await myPoints();

        var today = new Date().toISOString().slice(0, 10);
        var tr = await sb.from('tasks').select('*').eq('is_active', true).order('sort_order');
        var tasks = tr.data || [];
        var ur = await sb.from('user_tasks').select('*').eq('user_id', me.id);
        var rows = ur.data || [];
        function findRow(t) {
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                if (r.task_id !== t.id) continue;
                if (t.task_type === 'daily' ? r.task_date === today : !r.task_date) return r;
            }
            return { id: null, progress: 0, completed: false, claimed: false };
        }
        var dailyHtml = '', onceHtml = '';
        tasks.forEach(function (t) {
            var html = taskCard(t, findRow(t));
            if (t.task_type === 'daily') dailyHtml += html; else onceHtml += html;
        });
        document.getElementById('daily-list').innerHTML = dailyHtml || '<p class="works-note">暂无每日任务</p>';
        document.getElementById('once-list').innerHTML = onceHtml || '<p class="works-note">暂无成长任务</p>';

        document.querySelectorAll('[data-claim]').forEach(function (b) {
            b.addEventListener('click', async function () {
                b.disabled = true; b.textContent = '领取中…';
                var r = await claimTaskReward(b.getAttribute('data-claim'));
                if (r.ok) {
                    alert('领取成功，+' + r.points + ' 积分！');
                    load();
                } else {
                    alert('领取失败，请重试');
                    b.disabled = false; b.textContent = '领取';
                }
            });
        });
    }

    (async function () {
        await renderSubHeader();
        await load();
    })();
    </script>
