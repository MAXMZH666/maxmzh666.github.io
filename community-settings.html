    <style>
        .set-card { border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 14px; padding: 20px; margin-bottom: 18px; background: var(--card, rgba(255,255,255,.02)); }
        .set-card h2 { font-size: 1.05rem; margin: 0 0 12px; }
        .set-card label { display: block; margin: 10px 0 4px; font-size: .9rem; }
        .set-card input[type=text], .set-card input[type=password], .set-card input[type=email], .set-card select { width: 100%; max-width: 380px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--bg, #141419); color: inherit; }
        .set-note { font-size: .85rem; margin-top: 8px; min-height: 1.2em; }
        .set-note.ok { color: #51cf66; }
        .set-note.err { color: #ff6b6b; }
        .cur-email { color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
    </style>
</head>
<body>

        <nav class="nav" aria-label="主导航">
            <a class="brand" href="index.html"><img src="logo.png" alt="MAXMZH"></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>
                <button class="nav-toggle" aria-expanded="false" aria-label="打开菜单">☰</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">主页</a></li>
                <li><a href="about.html">个人简介</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="community-home.html" class="active">社区</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </nav>
    </header>
    <div class="sub-header">
        <div class="sub-header-inner">
            <a class="sub-brand" href="community-home.html">🎮 <span>MAX社区</span></a>
            <nav class="sub-links" aria-label="社区导航">
                <a href="community-home.html" data-sub="home">首页</a>
                <a href="community.html" data-sub="works">🔍 发现</a>
                <a href="community-forum.html" data-sub="forum">💬 论坛</a>
                <a href="community-studios.html" data-sub="studios">🏢 工作室</a>
                <a href="community-shop.html" data-sub="shop">🎁 任务商城</a>
                <a href="community-contests.html" data-sub="contests">🏁 赛事</a>
                <a href="community-moderation.html" data-sub="moderation">⚖️ 共建</a>
                <a href="community-publish.html" data-sub="publish">🚀 发布</a>
                <span id="sub-auth"><a href="community-auth.html">登录</a></span>
            </nav>
        </div>
    </div>

    <main>
        <section class="portfolio" style="max-width:640px">
            <p class="article-back"><a href="community-user.html" id="back-link">← 返回我的主页</a></p>
            <h1 class="section-title">⚙️ 个人设置</h1>
            <div id="need-login" class="works-note" style="display:none">请先<a href="community-auth.html">登录</a>后再修改设置。</div>
            <div id="set-wrap" style="display:none">

                <div class="set-card">
                    <h2>🔐 修改密码</h2>
                    <label for="pw0">原密码</label>
                    <input type="password" id="pw0" autocomplete="current-password" placeholder="输入原密码">
                    <label for="pw1">新密码（至少 6 位）</label>
                    <input type="password" id="pw1" autocomplete="new-password" placeholder="输入新密码">
                    <label for="pw2">确认新密码</label>
                    <input type="password" id="pw2" autocomplete="new-password" placeholder="再输入一次">
                    <p style="margin-top:10px"><button class="btn btn-blue" id="pw-btn">更新密码</button>
                        <a href="javascript:void(0)" id="pw-forgot" style="margin-left:12px;font-size:.85rem">忘记密码？</a></p>
                    <p class="set-note" id="pw-note"></p>
                </div>

                <div class="set-card">
                    <h2>📧 修改邮箱</h2>
                    <p class="cur-email">当前邮箱：<span id="cur-email">—</span></p>
                    <label for="em1">新邮箱</label>
                    <input type="email" id="em1" autocomplete="email" placeholder="输入新邮箱地址">
                    <p style="margin-top:10px"><button class="btn btn-blue" id="em-btn">发送确认邮件</button></p>
                    <p class="set-note" id="em-note"></p>
                    <p class="form-hint">修改邮箱后，系统会向新邮箱发送确认链接，点击后才生效。</p>
                </div>

                <div class="set-card">
                    <h2>🚫 屏蔽列表</h2>
                    <div id="block-list"><p class="works-note">加载中…</p></div>
                </div>

                <div class="set-card">
                    <h2>🎛️ 个人喜好</h2>
                    <label for="pf-autosave">在线编辑器自动保存间隔</label>
                    <select id="pf-autosave">
                        <option value="30000">每 30 秒</option>
                        <option value="60000">每 60 秒</option>
                        <option value="90000">每 90 秒（默认）</option>
                        <option value="180000">每 3 分钟</option>
                        <option value="0">关闭自动保存</option>
                    </select>
                    <label for="pf-category">发布作品时的默认分类</label>
                    <select id="pf-category">
                        <option>游戏</option><option>动画</option><option>工具</option><option>音乐</option><option>其他</option>
                    </select>
                    <p style="margin-top:10px"><button class="btn btn-blue" id="pf-btn">保存偏好</button></p>
                    <p class="set-note" id="pf-note"></p>
                </div>

            </div>
        </section>
    </main>

    <footer>

            <a href="https://github.com/MAXMZH666" target="_blank" rel="noopener">GitHub</a>
        </div>

        <p>本站托管于 GitHub Pages</p>
    </footer>

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.js?v=20261004k"></script>
    <script>
    (async function () {
        await renderSubHeader();
        var me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('set-wrap').style.display = '';
        document.getElementById('back-link').href = 'community-user.html?id=' + me.id;
        /* 🚫 屏蔽列表 */
        (async function loadBlockList() {
            var box = document.getElementById('block-list');
            try {
                var br = await sb.from('blocks').select('blocked_id,created_at').eq('blocker_id', me.id)
                    .order('created_at', { ascending: false });
                var rows = br.data || [];
                if (!rows.length) { box.innerHTML = '<p class="works-note">没有屏蔽任何人。</p>'; return; }
                var pr = await sb.from('profiles').select('id,username').in('id', rows.map(function (x) { return x.blocked_id; }));
                var nm = {};
                (pr.data || []).forEach(function (p) { nm[p.id] = p.username; });
                box.innerHTML = rows.map(function (x) {
                    return '<div class="user-row"><a href="community-user.html?id=' + x.blocked_id + '">' +
                        esc(nm[x.blocked_id] || '未知用户') + '</a>' +
                        '<button class="btn btn-ghost" style="margin-left:auto;font-size:.8rem;padding:6px 12px" ' +
                        'data-unblock="' + x.blocked_id + '">解除</button></div>';
                }).join('');
                box.querySelectorAll('[data-unblock]').forEach(function (btn) {
                    btn.addEventListener('click', async function () {
                        if (!confirm('确定要解除屏蔽吗？')) return;
                        try {
                            await sb.from('blocks').delete()
                                .eq('blocker_id', me.id).eq('blocked_id', btn.getAttribute('data-unblock'));
                            loadBlockList();
                        } catch (e) { alert('操作失败：' + e.message); }
                    });
                });
            } catch (e) { box.innerHTML = '<p class="works-note">加载失败：' + esc(e.message) + '</p>'; }
        })();
        document.getElementById('cur-email').textContent = me.email || '—';

        function note(id, msg, ok) {
            var n = document.getElementById(id);
            n.textContent = msg;
            n.className = 'set-note ' + (ok ? 'ok' : 'err');
        }

        /* 修改密码：先验证原密码 */
        document.getElementById('pw-btn').addEventListener('click', async function () {
            var p0 = document.getElementById('pw0').value;
            var p1 = document.getElementById('pw1').value;
            var p2 = document.getElementById('pw2').value;
            if (!p0) { note('pw-note', '请输入原密码', false); return; }
            if (p1.length < 6) { note('pw-note', '新密码至少 6 位', false); return; }
            if (p1 !== p2) { note('pw-note', '两次输入不一致', false); return; }
            var btn = document.getElementById('pw-btn');
            if (btn.disabled) return;
            btn.disabled = true;
            showLoading('更新中…');
            note('pw-note', '验证原密码…', true);
            try {
                var v = await withTimeout(sb.auth.signInWithPassword({ email: me.email, password: p0 }), 20000, '验证超时，请重试');
                if (v.error) throw new Error('原密码不正确');
                note('pw-note', '更新中…', true);
                var r = await withTimeout(sb.auth.updateUser({ password: p1 }), 20000, '更新超时，请重试');
                if (r.error) throw r.error;
                note('pw-note', '✅ 密码已更新', true);
                document.getElementById('pw0').value = '';
                document.getElementById('pw1').value = '';
                document.getElementById('pw2').value = '';
            } catch (err) {
                note('pw-note', '更新失败：' + (err.message || '请稍后再试'), false);
            } finally {
                hideLoading();
                btn.disabled = false;
            }
        });
        /* 忘记密码：发重置邮件 */
        document.getElementById('pw-forgot').addEventListener('click', async function () {
            note('pw-note', '正在发送重置邮件…', true);
            try {
                var r = await withTimeout(sb.auth.resetPasswordForEmail(me.email, {
                    redirectTo: 'https://maxmzh666.github.io/community-auth.html?mode=recover'
                }), 20000, '发送超时，请重试');
                if (r.error) throw r.error;
                note('pw-note', '✅ 重置邮件已发送到 ' + me.email + '，请去邮箱点击链接设置新密码', true);
            } catch (err) {
                note('pw-note', '发送失败：' + (err.message || '请稍后再试'), false);
            }
        });

        /* 修改邮箱 */
        document.getElementById('em-btn').addEventListener('click', async function () {
            var em = document.getElementById('em1').value.trim();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { note('em-note', '请输入有效的邮箱地址', false); return; }
            if (em === me.email) { note('em-note', '与当前邮箱相同，无需修改', false); return; }
            note('em-note', '发送中…', true);
            var r = await withTimeout(sb.auth.updateUser({ email: em }, {
                emailRedirectTo: 'https://maxmzh666.github.io/community-settings.html?email_changed=1'
            }), 20000, '发送超时，请重试');
            if (r.error) note('em-note', '发送失败：' + r.error.message, false);
            else note('em-note', '✅ 确认邮件已发送到 ' + em + '，请点击邮件中的链接完成更换', true);
        });
        /* 从改邮箱确认链接回来 */
        if (new URLSearchParams(location.search).get('email_changed') === '1') {
            note('em-note', '✅ 邮箱已更换为 ' + (me.email || '新邮箱'), true);
            try { document.getElementById('cur-email').textContent = me.email || '—'; } catch (e) {}
        }

        /* 偏好：读取 */
        var settings = {};
        try {
            var pr = await sb.from('profiles').select('settings').eq('id', me.id).single();
            if (pr.data && pr.data.settings) settings = pr.data.settings;
        } catch (e) {}
        var savedMs = settings.autosave_ms;
        if (savedMs === undefined || savedMs === null) {
            try { savedMs = parseInt(localStorage.getItem('mmc_autosave_interval') || '90000', 10); } catch (e) { savedMs = 90000; }
        }
        document.getElementById('pf-autosave').value = String(savedMs);
        document.getElementById('pf-category').value = settings.default_category || '游戏';

        /* 偏好：保存 */
        document.getElementById('pf-btn').addEventListener('click', async function () {
            var ms = parseInt(document.getElementById('pf-autosave').value, 10);
            var cat = document.getElementById('pf-category').value;
            settings.autosave_ms = ms;
            settings.default_category = cat;
            try { localStorage.setItem('mmc_autosave_interval', String(ms)); } catch (e) {}
            note('pf-note', '保存中…', true);
            var r = await sb.from('profiles').update({ settings: settings }).eq('id', me.id);
            if (r.error) note('pf-note', '保存失败：' + r.error.message, false);
            else note('pf-note', '✅ 偏好已保存' + (ms === 0 ? '（自动保存已关闭）' : ''), true);
        });
    })();
    </script>
</body>
