    <style>
        .dm-wrap { display: flex; gap: 16px; margin-top: 20px; min-height: 60vh; }
        .dm-list { width: 300px; flex-shrink: 0; border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }

        .dm-conv:hover { background: rgba(255,255,255,.03); }
        .dm-conv.active { background: rgba(77,124,254,.08); }
        .dm-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#4d7cfe,#9b59ff); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: #fff; flex-shrink: 0; }
        .dm-conv-main { flex: 1; min-width: 0; }
        .dm-conv-name { font-weight: 600; font-size: .92rem; display: flex; justify-content: space-between; align-items: center; }
        .dm-conv-time { font-size: .72rem; color: var(--muted); font-weight: 400; }
        .dm-conv-last { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
        .dm-unread { background: #ff6b6b; color: #fff; font-size: .7rem; min-width: 20px; height: 20px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }
        .dm-chat { flex: 1; border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        .dm-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; max-height: 55vh; }

        .dm-input-bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border, rgba(255,255,255,.08)); position: relative; }
        .dm-input-bar input { flex: 1; min-height: 44px; }
        .dm-tool-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 6px; border-radius: 8px; line-height: 1; }
        .dm-tool-btn:hover { background: rgba(255,255,255,.08); }
        .dm-emoji-panel { position: absolute; bottom: 60px; left: 12px; background: var(--surface, #1a1a1f); border: 1px solid var(--border, rgba(255,255,255,.12)); border-radius: 12px; padding: 10px; display: none; grid-template-columns: repeat(5, 1fr); gap: 4px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.4); }

        .dm-msg img.dm-img { max-width: 220px; max-height: 220px; border-radius: 10px; cursor: zoom-in; display: block; }
        .dm-msg-del { display: none; font-size: .72rem; color: rgba(255,255,255,.6); cursor: pointer; margin-left: 6px; }
        .dm-msg.mine:hover .dm-msg-del { display: inline; }
        .dm-msg-del:hover { color: #ff6b6b; }
        .dm-read { font-size: .68rem; color: rgba(255,255,255,.55); text-align: right; margin-top: 2px; }
        .dm-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: .85rem; z-index: 9999; display: none; }
        .dm-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); padding: 40px 20px; text-align: center; }
        .dm-list-head { display: flex; justify-content: space-between; align-items: center; }
        .dm-create-btn { background: none; border: 1px solid var(--border, rgba(255,255,255,.12)); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: .8rem; cursor: pointer; }

        .dm-chat-head.clickable { cursor: pointer; }
        .dm-chat-head.clickable:hover { color: var(--gold, #ffcc00); }
        .dm-sender { font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
        .dm-msg.mine .dm-sender { display: none; }
        .dm-modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 9998; padding: 16px; }
        .dm-modal-backdrop.open { display: flex; }
        .dm-modal { background: var(--surface, #1a1a1f); border: 1px solid var(--border, rgba(255,255,255,.12)); border-radius: 12px; padding: 20px; width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; }
        .dm-modal h3 { margin: 0 0 14px; font-size: 1.05rem; }

        .dm-friend-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 8px; margin-bottom: 12px; }
        .dm-friend-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border, rgba(255,255,255,.05)); cursor: pointer; }
        .dm-friend-item:last-child { border-bottom: none; }
        .dm-friend-item:hover { background: rgba(255,255,255,.03); }
        .dm-friend-item input { width: auto; margin: 0; }
        .dm-member-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--border, rgba(255,255,255,.05)); }
        .dm-member-row:last-child { border-bottom: none; }

        .dm-mini-btn { background: none; border: 1px solid var(--border, rgba(255,255,255,.12)); color: var(--text); border-radius: 6px; padding: 3px 10px; font-size: .78rem; cursor: pointer; }
        .dm-mini-btn:hover { background: rgba(255,255,255,.08); }
        .dm-mini-btn.danger { color: #ff6b6b; border-color: rgba(255,107,107,.4); }
        .dm-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
        @media (max-width: 760px) {
            .dm-wrap { flex-direction: column; }
            .dm-list { width: 100%; max-height: 40vh; }
            .dm-list.hide-mobile { display: none; }

    <script>
    (function () {
        var me = null, convs = [], activeUid = null, activeGroupId = null, nameMap = {}, groupMap = {}, pollTimer = null, sending = false;

        function qp(name) {
            try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
        }

        async function loadConvs() {
            var r = await withTimeout(sb.from('direct_messages')
                .select('id,sender_id,receiver_id,content,created_at,read_at,msg_type')
                .is('group_id', null)
                .or('sender_id.eq.' + me.id + ',receiver_id.eq.' + me.id)
                .order('created_at', { ascending: false })
                .limit(200), 15000, '加载超时');
            if (r.error) throw r.error;
            var msgs = r.data || [];
            var map = {};
            msgs.forEach(function (m) {
                var other = m.sender_id === me.id ? m.receiver_id : m.sender_id;
                if (!map[other]) map[other] = { uid: other, last: m, unread: 0 };
                if (m.receiver_id === me.id && !m.read_at) map[other].unread++;
            });
            convs = Object.keys(map).map(function (k) { return map[k]; })
                .sort(function (a, b) { return new Date(b.last.created_at) - new Date(a.last.created_at); });
            /* 🚫 过滤被屏蔽用户的会话 */
            try {
                var blockedIds = await getBlockedIds();
                if (blockedIds.length) {
                    convs = convs.filter(function (c) { return blockedIds.indexOf(c.uid) < 0; });
                }
            } catch (e) {}
            /* 用户名 */
            var uids = convs.map(function (c) { return c.uid; });
            if (uids.length) {
                try {
                    var pr = await sb.from('profiles').select('id,username').in('id', uids);
                    (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
                } catch (e) {}
            }
            /* 群聊：我加入的群 */
            try {
                var gm = await sb.from('chat_group_members').select('group_id').eq('user_id', me.id);
                var gids = (gm.data || []).map(function (x) { return x.group_id; });
                if (gids.length) {
                    var gr = await sb.from('chat_groups').select('id,name,owner_id,created_at').in('id', gids);
                    var groups = gr.data || [];
                    groups.forEach(function (g) { groupMap[g.id] = g; });
                    /* 各群最后一条消息 */
                    var lr = await sb.from('direct_messages')
                        .select('id,group_id,sender_id,content,created_at,msg_type')
                        .in('group_id', gids)
                        .order('created_at', { ascending: false })
                        .limit(200);
                    var lastByGroup = {};
                    (lr.data || []).forEach(function (m) {
                        if (!lastByGroup[m.group_id]) lastByGroup[m.group_id] = m;
                    });
                    /* 群成员数 */
                    var mc = await sb.from('chat_group_members').select('group_id').in('group_id', gids);
                    var countByGroup = {};
                    (mc.data || []).forEach(function (x) {
                        countByGroup[x.group_id] = (countByGroup[x.group_id] || 0) + 1;
                    });
                    groups.forEach(function (g) {
                        convs.push({
                            isGroup: true,
                            groupId: g.id,
                            groupName: g.name,
                            ownerId: g.owner_id,
                            memberCount: countByGroup[g.id] || 0,
                            last: lastByGroup[g.id] || { sender_id: '', content: '', created_at: g.created_at },
                            unread: 0
                        });
                    });
                    /* 发送者用户名（群消息用） */
                    var senderIds = [];
                    Object.keys(lastByGroup).forEach(function (gid) {
                        var sid = lastByGroup[gid].sender_id;
                        if (sid && senderIds.indexOf(sid) < 0) senderIds.push(sid);
                    });
                    if (senderIds.length) {
                        try {
                            var gpr = await sb.from('profiles').select('id,username').in('id', senderIds);
                            (gpr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
                        } catch (e) {}
                    }
                }
            } catch (e) {}
            convs.sort(function (a, b) { return new Date(b.last.created_at) - new Date(a.last.created_at); });
            renderConvs();
            updateDmDot();
        }

        function renderConvs() {
            var box = document.getElementById('dm-convs');
            if (!convs.length) {
                box.innerHTML = '<div class="dm-empty">暂无会话<br>去用户主页点「💬 私信」开始聊天吧</div>';
                return;
            }
            box.innerHTML = convs.map(function (c) {
                if (c.isGroup) {
                    /* 群聊条目 */
                    var gLastText = c.last.msg_type === 'image' ? '[图片]'
                        : (c.last.msg_type === 'redpacket' ? '[红包]' : (c.last.content || ''));
                    var gPrefix = c.last.sender_id ? ((c.last.sender_id === me.id ? '我' : (nameMap[c.last.sender_id] || '成员')) + '：') : '';
                    return '<div class="dm-conv' + (c.groupId === activeGroupId ? ' active' : '') + '" data-group="' + c.groupId + '">' +
                        '<div class="dm-avatar">👥</div>' +
                        '<div class="dm-conv-main"><div class="dm-conv-name"><span>👥 ' + esc(c.groupName) + '</span>' +
                        '<span class="dm-conv-time">' + fmtDate(c.last.created_at) + '</span></div>' +
                        '<div class="dm-conv-last">' + esc(gPrefix + gLastText) + '</div></div>' +
                        '</div>';
                }
                var nm = esc(nameMap[c.uid] || '未知用户');
                var lastText = c.last.msg_type === 'image' ? '[图片]'
                    : (c.last.msg_type === 'redpacket' ? '[红包]' : c.last.content);
                var last = c.last.sender_id === me.id ? '我：' + lastText : lastText;
                return '<div class="dm-conv' + (c.uid === activeUid ? ' active' : '') + '" data-uid="' + c.uid + '">' +
                    '<div class="dm-avatar">' + esc(nm.charAt(0)) + '</div>' +
                    '<div class="dm-conv-main"><div class="dm-conv-name"><span>' + nm + '</span>' +
                    '<span class="dm-conv-time">' + fmtDate(c.last.created_at) + '</span></div>' +
                    '<div class="dm-conv-last">' + esc(last) + '</div></div>' +
                    (c.unread ? '<span class="dm-unread">' + c.unread + '</span>' : '') +
                    '</div>';
            }).join('');
            box.querySelectorAll('.dm-conv').forEach(function (el) {
                el.addEventListener('click', function () {
                    if (el.getAttribute('data-group')) { openGroup(el.getAttribute('data-group')); }
                    else { openConv(el.getAttribute('data-uid')); }
                });
            });
        }

        function updateDmDot() {
            var total = convs.reduce(function (s, c) { return s + c.unread; }, 0);
            var dot = document.getElementById('dm-dot');
            if (dot) dot.style.display = total > 0 ? 'inline' : 'none';
        }

        async function openConv(uid) {
            activeUid = uid;
            activeGroupId = null;
            document.getElementById('dm-empty').style.display = 'none';
            var act = document.getElementById('dm-active');
            act.style.display = 'flex';
            document.getElementById('dm-list').classList.add('hide-mobile');
            var nm = esc(nameMap[uid] || '未知用户');
            var headEl = document.getElementById('dm-chat-head');
            headEl.classList.remove('clickable');
            headEl.onclick = null;
            headEl.innerHTML =
                '<a href="community-user.html?id=' + uid + '">' + nm + '</a>';
            renderConvs();
            await loadMsgs();
            /* 标为已读 */
            try {
                await sb.from('direct_messages').update({ read_at: new Date().toISOString() })
                    .eq('receiver_id', me.id).eq('sender_id', uid).is('read_at', null);
            } catch (e) {}
            var c = convs.find(function (x) { return x.uid === uid; });
            if (c) { c.unread = 0; renderConvs(); updateDmDot(); }
            if (window.innerWidth <= 760) document.getElementById('dm-chat').scrollIntoView();
        }

        async function openGroup(gid) {
            activeGroupId = gid;
            activeUid = null;
            document.getElementById('dm-empty').style.display = 'none';
            var act = document.getElementById('dm-active');
            act.style.display = 'flex';
            document.getElementById('dm-list').classList.add('hide-mobile');
            var g = groupMap[gid] || {};
            var c = convs.find(function (x) { return x.isGroup && x.groupId === gid; });
            var count = c ? c.memberCount : 0;
            var head = document.getElementById('dm-chat-head');
            head.classList.add('clickable');
            head.innerHTML = '👥 ' + esc(g.name || '群聊') + ' <span style="font-weight:400;font-size:.8rem;color:var(--muted)">(' + count + '人，点击查看成员)</span>';
            head.onclick = function () { openMemberList(gid); };
            renderConvs();
            await loadMsgs();
            if (window.innerWidth <= 760) document.getElementById('dm-chat').scrollIntoView();
        }

        async function loadMsgs() {
            if (activeGroupId) { await loadGroupMsgs(); return; }
            if (!activeUid) return;
            var r = await withTimeout(sb.from('direct_messages')
                .select('id,sender_id,content,created_at,read_at,msg_type')
                .is('group_id', null)
                .or('and(sender_id.eq.' + me.id + ',receiver_id.eq.' + activeUid + '),and(sender_id.eq.' + activeUid + ',receiver_id.eq.' + me.id + ')')
                .order('created_at', { ascending: true })
                .limit(200), 15000, '加载超时');
            if (r.error) return;
            var box = document.getElementById('dm-msgs');
            box.innerHTML = (r.data || []).map(function (m) {
                var mine = m.sender_id === me.id;
                var isImg = m.msg_type === 'image';
                var isRp = m.msg_type === 'redpacket';
                var body;
                if (isRp) {
                    /* 🧧 红包消息：先占位，异步渲染卡片 */
                    body = '<div class="dm-rp-slot" data-rp-id="' + esc(m.content) + '">🧧 红包加载中…</div>';
                } else if (isImg) {
                    body = '<img class="dm-img" src="' + esc(m.content) + '" alt="图片消息" loading="lazy" data-full="' + esc(m.content) + '">';
                } else {
                    body = '<span class="dm-text">' + esc(m.content) + '</span>';
                }
                var readTag = (mine && m.read_at) ? '<div class="dm-read">已读</div>' : '';
                return '<div class="dm-msg ' + (mine ? 'mine' : 'theirs') + '" data-mid="' + m.id + '">' +
                    body +
                    (mine ? '<span class="dm-msg-del" data-del-msg="' + m.id + '" title="删除">✕</span>' : '') +
                    '<div class="dm-msg-time">' + fmtDate(m.created_at) + '</div>' + readTag + '</div>';
            }).join('') || '<div class="dm-empty">还没有消息，打个招呼吧 👋</div>';
            box.scrollTop = box.scrollHeight;
            /* 🧧 异步渲染红包卡片 */
            renderRpSlots(box);
            /* 图片点击放大 */
            box.querySelectorAll('.dm-img').forEach(function (img) {
                img.addEventListener('click', function () { window.open(img.getAttribute('data-full'), '_blank'); });
            });
            /* 删除自己的消息 */
            box.querySelectorAll('[data-del-msg]').forEach(function (b) {
                b.addEventListener('click', async function (e) {
                    e.stopPropagation();
                    if (!confirm('删除这条消息？')) return;
                    try {
                        var dr = await withTimeout(sb.from('direct_messages').delete().eq('id', b.getAttribute('data-del-msg')).eq('sender_id', me.id), 15000, '删除超时');
                        if (dr.error) throw dr.error;
                        await loadMsgs(); await loadConvs();
                    } catch (err) { alert('删除失败：' + (err.message || '')); }
                });
            });
            /* 右键复制文本 */
            box.querySelectorAll('.dm-text').forEach(function (t) {
                t.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                    copyText(t.textContent);
                });
            });
        }

        async function loadGroupMsgs() {
            if (!activeGroupId) return;
            var r = await withTimeout(sb.from('direct_messages')
                .select('id,sender_id,content,created_at,msg_type')
                .eq('group_id', activeGroupId)
                .order('created_at', { ascending: true })
                .limit(200), 15000, '加载超时');
            if (r.error) return;
            /* 补全发送者用户名 */
            var sids = [];
            (r.data || []).forEach(function (m) {
                if (m.sender_id && !nameMap[m.sender_id] && sids.indexOf(m.sender_id) < 0) sids.push(m.sender_id);
            });
            if (sids.length) {
                try {
                    var pr = await sb.from('profiles').select('id,username').in('id', sids);
                    (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
                } catch (e) {}
            }
            var box = document.getElementById('dm-msgs');
            box.innerHTML = (r.data || []).map(function (m) {
                var mine = m.sender_id === me.id;
                var isImg = m.msg_type === 'image';
                var isRp = m.msg_type === 'redpacket';
                var body;
                if (isRp) {
                    /* 🧧 红包消息：先占位，异步渲染卡片 */
                    body = '<div class="dm-rp-slot" data-rp-id="' + esc(m.content) + '">🧧 红包加载中…</div>';
                } else if (isImg) {
                    body = '<img class="dm-img" src="' + esc(m.content) + '" alt="图片消息" loading="lazy" data-full="' + esc(m.content) + '">';
                } else {
                    body = '<span class="dm-text">' + esc(m.content) + '</span>';
                }
                var senderTag = mine ? '' : '<div class="dm-sender">' + esc(nameMap[m.sender_id] || '成员') + '</div>';
                return '<div class="dm-msg ' + (mine ? 'mine' : 'theirs') + '" data-mid="' + m.id + '">' +
                    senderTag + body +
                    (mine ? '<span class="dm-msg-del" data-del-msg="' + m.id + '" title="删除">✕</span>' : '') +
                    '<div class="dm-msg-time">' + fmtDate(m.created_at) + '</div></div>';
            }).join('') || '<div class="dm-empty">还没有消息，打个招呼吧 👋</div>';
            box.scrollTop = box.scrollHeight;
            /* 🧧 异步渲染红包卡片 */
            renderRpSlots(box);
            /* 图片点击放大 */
            box.querySelectorAll('.dm-img').forEach(function (img) {
                img.addEventListener('click', function () { window.open(img.getAttribute('data-full'), '_blank'); });
            });
            /* 删除自己的消息 */
            box.querySelectorAll('[data-del-msg]').forEach(function (b) {
                b.addEventListener('click', async function (e) {
                    e.stopPropagation();
                    if (!confirm('删除这条消息？')) return;
                    try {
                        var dr = await withTimeout(sb.from('direct_messages').delete().eq('id', b.getAttribute('data-del-msg')).eq('sender_id', me.id), 15000, '删除超时');
                        if (dr.error) throw dr.error;
                        await loadMsgs(); await loadConvs();
                    } catch (err) { alert('删除失败：' + (err.message || '')); }
                });
            });
            /* 右键复制文本 */
            box.querySelectorAll('.dm-text').forEach(function (t) {
                t.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                    copyText(t.textContent);
                });
            });
        }

        function copyText(s) {
            function done() { toast('已复制'); }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(s).then(done, function () { fallback(); });
            } else fallback();
            function fallback() {
                var ta = document.createElement('textarea');
                ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); done(); } catch (e) {}
                document.body.removeChild(ta);
            }
        }

        function toast(s) {
            var t = document.getElementById('dm-toast');
            t.textContent = s; t.style.display = 'block';
            setTimeout(function () { t.style.display = 'none'; }, 1500);
        }

        /* 🧧 红包发完回调：把红包作为特殊消息插入 direct_messages */
        async function onRedPacketSent(packetId, info) {
            if (!packetId) return;
            try {
                var payload = activeGroupId
                    ? { sender_id: me.id, receiver_id: null, group_id: activeGroupId, content: packetId, msg_type: 'redpacket' }
                    : { sender_id: me.id, receiver_id: activeUid, content: packetId, msg_type: 'redpacket' };
                var r = await withTimeout(sb.from('direct_messages').insert(payload), 15000, '发送超时');
                if (r.error) throw r.error;
                await loadMsgs();
                await loadConvs();
            } catch (e) {
                alert('红包消息发送失败：' + (e.message || ''));
            }
        }

        /* 🧧 异步渲染消息区内的红包卡片占位 */
        function renderRpSlots(box) {
            box.querySelectorAll('.dm-rp-slot').forEach(function (slot) {
                var pid = slot.getAttribute('data-rp-id');
                if (!pid) return;
                renderRedPacket(pid).then(function (html) {
                    if (html) slot.innerHTML = html;
                    else slot.textContent = '🧧 红包';
                });
            });
        }

        async function sendMsg() {
            if (sending || (!activeUid && !activeGroupId)) return;
            var input = document.getElementById('dm-input');
            var text = input.value.trim();
            if (!text) return;
            /* 🚫 不能给已屏蔽的人发消息 */
            if (activeUid && !activeGroupId) {
                try {
                    var _br = await sb.from('blocks').select('blocker_id')
                        .eq('blocker_id', me.id).eq('blocked_id', activeUid).maybeSingle();
                    if (_br.data) { alert('你已屏蔽该用户，请先在设置中解除屏蔽'); return; }
                } catch (e) {}
            }
            sending = true;
            showLoading('发送中…');
            try {
                /* 群消息：group_id 非空，receiver_id 填自己占位（列暂为 NOT NULL） */
                var payload = activeGroupId
                    ? { sender_id: me.id, receiver_id: me.id, group_id: activeGroupId, content: text }
                    : { sender_id: me.id, receiver_id: activeUid, content: text };
                var r = await withTimeout(sb.from('direct_messages').insert(payload), 15000, '发送超时');
                if (r.error) throw r.error;
                input.value = '';
                await loadMsgs();
                await loadConvs();
            } catch (e) {
                alert('发送失败：' + (e.message || ''));
            }
            hideLoading();
            sending = false;
            input.focus();
        }

        /* 📷 图片发送 */
        async function sendImage(file) {
            if ((!activeUid && !activeGroupId) || !file) return;
            if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
            if (file.size > 5 * 1024 * 1024) { alert('图片不能超过 5MB'); return; }
            showLoading('图片上传中…');
            try {
                var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
                var url = await uploadWithProgress('covers', 'dm/' + me.id + '_' + Date.now() + '.' + ext, file, file.type || 'image/jpeg', null);
                var imgPayload = activeGroupId
                    ? { sender_id: me.id, receiver_id: me.id, group_id: activeGroupId, content: url, msg_type: 'image' }
                    : { sender_id: me.id, receiver_id: activeUid, content: url, msg_type: 'image' };
                var r = await withTimeout(sb.from('direct_messages').insert(imgPayload), 15000, '发送超时');
                if (r.error) throw r.error;
                await loadMsgs(); await loadConvs();
            } catch (e) { alert('发送失败：' + (e.message || '')); }
            hideLoading();
        }

        /* 😀 Emoji 面板 */
        var EMOJIS = ['😀','😁','😂','🤣','😊','😍','😘','😎','🤔','😅','😭','😡','👍','👎','👏','🙏','💪','🎉','🔥','❤️'];
        function buildEmojiPanel() {
            var panel = document.getElementById('dm-emoji-panel');
            panel.innerHTML = EMOJIS.map(function (e) {
                return '<button type="button" data-emoji="' + e + '">' + e + '</button>';
            }).join('');
            panel.querySelectorAll('[data-emoji]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var input = document.getElementById('dm-input');
                    var s = input.selectionStart || 0, epos = input.selectionEnd || 0;
                    var v = input.value;
                    input.value = v.slice(0, s) + b.getAttribute('data-emoji') + v.slice(epos);
                    input.focus();
                    var pos = s + b.getAttribute('data-emoji').length;
                    try { input.setSelectionRange(pos, pos); } catch (err) {}
                    panel.classList.remove('open');
                });
            });
        }

        function startPoll() {
            stopPoll();
            pollTimer = setInterval(function () {
                if (document.hidden) return;
                if (activeUid || activeGroupId) loadMsgs();
                loadConvs();
            }, 10000);
        }
        function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

        /* ---------- 群聊：建群 / 成员管理 ---------- */
        function openModal(html) {
            document.getElementById('dm-modal-box').innerHTML = html;
            document.getElementById('dm-modal-backdrop').classList.add('open');
        }
        function closeModal() {
            document.getElementById('dm-modal-backdrop').classList.remove('open');
            document.getElementById('dm-modal-box').innerHTML = '';
        }

        /* 生成 UUID v4（建群用，避免 insert+select 受 RLS 限制） */
        function genUuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        /* 建群弹窗：输入群名，从关注列表选好友（排除已屏蔽） */
        async function openCreateGroup() {
            openModal('<h3>＋ 创建群聊</h3>' +
                '<input type="text" id="dm-group-name" maxlength="30" placeholder="群名称（最多30字）" autocomplete="off">' +
                '<p class="works-note" style="margin:0 0 8px">选择好友加入（被屏蔽的用户不可选）：</p>' +
                '<div class="dm-friend-list" id="dm-friend-list"><p class="works-note" style="padding:12px">加载中…</p></div>' +
                '<div class="dm-modal-actions">' +
                '<button class="btn" id="dm-group-cancel">取消</button>' +
                '<button class="btn btn-blue" id="dm-group-confirm">创建</button></div>');
            document.getElementById('dm-group-cancel').addEventListener('click', closeModal);
            var listBox = document.getElementById('dm-friend-list');
            try {
                /* 我的关注 */
                var fr = await sb.from('follows').select('following_id').eq('follower_id', me.id).limit(200);
                var fids = (fr.data || []).map(function (x) { return x.following_id; });
                /* 我屏蔽的用户 */
                var br = await sb.from('blocks').select('blocked_id').eq('blocker_id', me.id);
                var blocked = {};
                (br.data || []).forEach(function (x) { blocked[x.blocked_id] = 1; });
                fids = fids.filter(function (id) { return !blocked[id]; });
                if (!fids.length) {
                    listBox.innerHTML = '<p class="works-note" style="padding:12px">还没有可邀请的好友，先去关注一些用户吧</p>';
                } else {
                    var pr = await sb.from('profiles').select('id,username').in('id', fids);
                    var users = pr.data || [];
                    listBox.innerHTML = users.map(function (u) {
                        return '<label class="dm-friend-item"><input type="checkbox" value="' + u.id + '">' +
                            '<span>' + esc(u.username) + '</span></label>';
                    }).join('') || '<p class="works-note" style="padding:12px">暂无可选好友</p>';
                }
            } catch (e) {
                listBox.innerHTML = '<p class="works-note" style="padding:12px">加载失败：' + esc(e.message || '') + '</p>';
            }
            document.getElementById('dm-group-confirm').addEventListener('click', async function () {
                var name = document.getElementById('dm-group-name').value.trim();
                if (!name) { alert('请填写群名称'); return; }
                var checked = [];
                listBox.querySelectorAll('input[type="checkbox"]:checked').forEach(function (cb) {
                    checked.push(cb.value);
                });
                var btn = document.getElementById('dm-group-confirm');
                btn.disabled = true; btn.textContent = '创建中…';
                try {
                    /* 建群（客户端生成 ID，避免 RETURNING 受成员可见策略限制） */
                    var gid = genUuid();
                    var gr = await sb.from('chat_groups').insert({ id: gid, name: name, owner_id: me.id });
                    if (gr.error) throw gr.error;
                    /* 拉成员：自己 + 所选好友（群主可拉人） */
                    var members = [{ group_id: gid, user_id: me.id }];
                    checked.forEach(function (uid) { members.push({ group_id: gid, user_id: uid }); });
                    var mr = await sb.from('chat_group_members').insert(members);
                    if (mr.error) throw mr.error;
                    closeModal();
                    toast('群聊创建成功');
                    await loadConvs();
                    openGroup(gid);
                } catch (e) {
                    var errEl = document.getElementById('dm-group-err');
                    if (!errEl) {
                        btn.insertAdjacentHTML('beforebegin', '<p id="dm-group-err" style="color:#ff6b6b"></p>');
                        errEl = document.getElementById('dm-group-err');
                    }
                    errEl.textContent = '创建失败：' + (e.message || JSON.stringify(e));
                    btn.disabled = false; btn.textContent = '创建';
                }
            });
        }

        /* 群成员列表：群主可踢人/解散，成员可退群 */
        async function openMemberList(gid) {
            openModal('<h3>👥 群成员</h3><div id="dm-member-list"><p class="works-note">加载中…</p></div>' +
                '<div class="dm-modal-actions"><button class="btn" id="dm-member-close">关闭</button></div>');
            document.getElementById('dm-member-close').addEventListener('click', closeModal);
            var box = document.getElementById('dm-member-list');
            try {
                var g = groupMap[gid] || {};
                var isOwner = g.owner_id === me.id;
                var mr = await sb.from('chat_group_members').select('user_id,joined_at').eq('group_id', gid).order('joined_at', { ascending: true });
                var members = mr.data || [];
                var uids = members.map(function (x) { return x.user_id; });
                var pr = await sb.from('profiles').select('id,username').in('id', uids);
                var umap = {};
                (pr.data || []).forEach(function (p) { umap[p.id] = p.username; });
                box.innerHTML = members.map(function (x) {
                    var uname = esc(umap[x.user_id] || '未知用户');
                    var role = x.user_id === g.owner_id ? '<span class="dm-member-role">群主</span>' : '';
                    var kickBtn = (isOwner && x.user_id !== me.id)
                        ? ' <button class="dm-mini-btn danger" data-kick="' + x.user_id + '">踢出</button>' : '';
                    return '<div class="dm-member-row"><span class="dm-member-name">' + uname + role + '</span>' +
                        '<span>' + kickBtn + '</span></div>';
                }).join('');
                /* 管理操作区 */
                var actions = '<div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">';
                if (isOwner) {
                    actions += '<button class="dm-mini-btn danger" id="dm-disband">解散群</button>';
                } else {
                    actions += '<button class="dm-mini-btn danger" id="dm-leave">退群</button>';
                }
                actions += '</div>';
                box.insertAdjacentHTML('afterend', actions);
                /* 踢人 */
                box.querySelectorAll('[data-kick]').forEach(function (b) {
                    b.addEventListener('click', async function () {
                        if (!confirm('确定将该成员移出群聊？')) return;
                        try {
                            var dr = await sb.from('chat_group_members').delete()
                                .eq('group_id', gid).eq('user_id', b.getAttribute('data-kick'));
                            if (dr.error) throw dr.error;
                            toast('已移出');
                            closeModal();
                            await loadConvs();
                            openGroup(gid);
                        } catch (e) { alert('操作失败：' + (e.message || '')); }
                    });
                });
                /* 解散群 */
                var disbandBtn = document.getElementById('dm-disband');
                if (disbandBtn) disbandBtn.addEventListener('click', async function () {
                    if (!confirm('确定解散该群？所有聊天记录将被删除！')) return;
                    if (!confirm('再次确认：真的要解散吗？')) return;
                    try {
                        var dr = await sb.from('chat_groups').delete().eq('id', gid);
                        if (dr.error) throw dr.error;
                        closeModal();
                        toast('群已解散');
                        activeGroupId = null;
                        document.getElementById('dm-active').style.display = 'none';
                        document.getElementById('dm-empty').style.display = '';
                        await loadConvs();
                    } catch (e) { alert('解散失败：' + (e.message || '')); }
                });
                /* 退群 */
                var leaveBtn = document.getElementById('dm-leave');
                if (leaveBtn) leaveBtn.addEventListener('click', async function () {
                    if (!confirm('确定退出该群？')) return;
                    try {
                        var dr = await sb.from('chat_group_members').delete()
                            .eq('group_id', gid).eq('user_id', me.id);
                        if (dr.error) throw dr.error;
                        closeModal();
                        toast('已退群');
                        activeGroupId = null;
                        document.getElementById('dm-active').style.display = 'none';
                        document.getElementById('dm-empty').style.display = '';
                        await loadConvs();
                    } catch (e) { alert('退群失败：' + (e.message || '')); }
                });
            } catch (e) {
                box.innerHTML = '<p class="works-note">加载失败：' + esc(e.message || '') + '</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            try { me = await currentUser(); } catch (e) {}
            if (!me) {
                document.getElementById('dm-login-tip').style.display = '';
                return;
            }
            document.getElementById('dm-wrap').style.display = '';
            /* 🧧 红包模块初始化 */
            injectRedPacketCSS();
            initRedPacketModal();
            bindRedPacketClaim(document);
            document.getElementById('dm-rp-btn').addEventListener('click', function () {
                if (!activeUid && !activeGroupId) { toast('请先选择一个会话'); return; }
                if (activeGroupId) {
                    /* 群聊发红包 */
                    window.openRedPacket('group', activeGroupId, onRedPacketSent);
                } else {
                    /* 私聊发红包 */
                    window.openRedPacket('dm', activeUid, onRedPacketSent);
                }
            });
            document.getElementById('dm-send').addEventListener('click', sendMsg);
            document.getElementById('dm-create-group-btn').addEventListener('click', openCreateGroup);
            document.getElementById('dm-modal-backdrop').addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });
            buildEmojiPanel();
            var emojiBtn = document.getElementById('dm-emoji-btn');
            var emojiPanel = document.getElementById('dm-emoji-panel');
            emojiBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                emojiPanel.classList.toggle('open');
            });
            document.addEventListener('click', function (e) {
                if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) emojiPanel.classList.remove('open');
            });
            var imgBtn = document.getElementById('dm-img-btn');
            var imgInput = document.getElementById('dm-img-input');
            imgBtn.addEventListener('click', function () { imgInput.click(); });
            imgInput.addEventListener('change', function () {
                if (imgInput.files[0]) sendImage(imgInput.files[0]);
                imgInput.value = '';
            });
            document.getElementById('dm-input').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); sendMsg(); }
            });
            await loadConvs();
            var to = qp('to');
            if (to && to !== me.id) {
                /* 🚫 ?to= 直接打开前检查是否被屏蔽 */
                try {
                    var _br2 = await sb.from('blocks').select('blocker_id')
                        .eq('blocker_id', me.id).eq('blocked_id', to).maybeSingle();
                    if (_br2.data) {
                        document.getElementById('dm-empty').innerHTML =
                            '你已屏蔽该用户，请先在<a href="community-settings.html">设置</a>中解除屏蔽';
                        return;
                    }
                } catch (e) {}
                /* ?to= 直接打开会话（对方可能不在列表中，先查用户名） */
                if (!nameMap[to]) {
                    try {
                        var pr = await sb.from('profiles').select('id,username').eq('id', to).single();
                        if (pr.data) nameMap[to] = pr.data.username;
                    } catch (e) {}
                }
                if (nameMap[to]) {
                    if (!convs.find(function (c) { return c.uid === to; })) {
                        convs.unshift({ uid: to, last: { sender_id: to, content: '', created_at: new Date().toISOString() }, unread: 0 });
                        renderConvs();
                    }
                    openConv(to);
                }
            }
            startPoll();
        });
        window.addEventListener('beforeunload', stopPoll);
    })();
