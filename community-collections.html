    <div class="modal-backdrop" id="col-modal" style="display:none">
        <div class="modal" style="max-width:480px"><h3>＋ 新建合集</h3>
            <label>合集标题</label><input type="text" id="nc-title" maxlength="40" placeholder="如：审判行动系列">
            <label>简介</label><textarea id="nc-desc" rows="3" maxlength="300" placeholder="介绍一下这个合集…"></textarea>
            <label>封面图（可选）</label><input type="file" id="nc-cover" accept="image/*">
            <p class="form-note" id="nc-note"></p>
            <div class="modal-actions"><button class="btn" id="nc-cancel" type="button">取消</button>
            <button class="btn btn-blue" id="nc-save" type="button">创建</button></div></div>
    </div>
    <script>
    async function loadCols(me) {
        var box = document.getElementById('col-list');
        try {
            var r = await sb.from('collections').select('id,title,description,cover_url,created_at')
                .eq('owner_id', me.id).order('created_at', { ascending: false });
            var cols = r.data || [];
            var counts = {};
            if (cols.length) {
                var cr = await sb.from('collection_works').select('collection_id')
                    .in('collection_id', cols.map(function (c) { return c.id; }));
                (cr.data || []).forEach(function (x) { counts[x.collection_id] = (counts[x.collection_id] || 0) + 1; });
            }
            box.innerHTML = cols.length ? cols.map(function (c) {
                var cover = c.cover_url
                    ? '<img src="' + esc(c.cover_url) + '" alt="' + esc(c.title) + '" loading="lazy">'
                    : '<span class="monogram">📚</span>';
                return '<a class="card" href="community-collection.html?id=' + c.id + '">' +
                    '<div class="card-cover">' + cover + '</div>' +
                    '<div class="card-body"><h3>' + esc(c.title) + '</h3>' +
                    '<p>' + (counts[c.id] || 0) + ' 件作品 · ' + fmtDate(c.created_at) + '</p></div></a>';
            }).join('') : '<p class="works-note">还没有合集，创建一个吧。</p>';
        } catch (e) {
            box.innerHTML = '<p class="works-note">加载失败：' + esc(e.message || '') + '</p>';
        }
    }

    async function load() {
        var me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('col-wrap').style.display = '';
        await loadCols(me);

        var modal = document.getElementById('col-modal');
        document.getElementById('new-col-btn').addEventListener('click', function () {
            document.getElementById('nc-title').value = '';
            document.getElementById('nc-desc').value = '';
            document.getElementById('nc-cover').value = '';
            document.getElementById('nc-note').textContent = '';
            modal.style.display = 'flex';
        });
        document.getElementById('nc-cancel').addEventListener('click', function () { modal.style.display = 'none'; });
        modal.addEventListener('click', function (e) { if (e.target === modal) modal.style.display = 'none'; });
        document.getElementById('nc-save').addEventListener('click', async function () {
            var t = document.getElementById('nc-title').value.trim();
            var d = document.getElementById('nc-desc').value.trim();
            var n = document.getElementById('nc-note');
            if (!t) { n.textContent = '请填写标题'; n.className = 'form-note err'; return; }
            n.textContent = '创建中…'; n.className = 'form-note sending';
            var payload = { owner_id: me.id, title: t, description: d || null };
            try {
                var cf = document.getElementById('nc-cover').files[0];
                if (cf) {
                    var ext = (cf.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
                    payload.cover_url = await uploadWithProgress('covers', 'collection/' + me.id + '_' + Date.now() + '.' + ext, cf, cf.type || 'image/jpeg', null);
                }
                var r = await withTimeout(sb.from('collections').insert(payload).select('id').single(), 20000, '创建超时');
                if (r.error) throw r.error;
                modal.style.display = 'none';
                location.href = 'community-collection.html?id=' + r.data.id;
            } catch (e) {
                n.textContent = '创建失败：' + (e.message || '');
                n.className = 'form-note err';
            }
        });
    }
    load();
    </script>
