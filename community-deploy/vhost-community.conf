# MAX编程社区子域名站点（community.maxmzh.com，与主站共用根目录和证书）
server {
    listen 80;
    server_name community.maxmzh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name community.maxmzh.com;
    ssl_certificate @CERT@;
    ssl_certificate_key @KEY@;

    root /var/www/maxmzh;
    index index.html;

    # 子域名根路径直接进社区首页
    location = / {
        return 302 /community-home.html;
    }

    # 邮箱验证码注册接口（mmc-api，8791）
    location /auth/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # 自建访问统计接口（mmc-api，8791）
    location /stats/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # 应用商店后台接口（mmc-api，8791）
    location /store-api/ {
        proxy_pass http://127.0.0.1:8791/store/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # 后台接口（8790）
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存（与主站一致）
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|mp3|mp4)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
