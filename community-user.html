    <main>

    <footer>

        <p class="foot-stats"><span id="busuanzi_container_site_pv">本站总访问量 <span id="busuanzi_value_site_pv">统计中…</span> 次</span><span> · </span><span id="busuanzi_container_page_pv">本页访问 <span id="busuanzi_value_page_pv">统计中…</span> 次</span></p>
    </footer>

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.js?v=20261004h"></script>
    <script>
    (async function () {
        await renderSubHeader();
        var wrap = document.getElementById('user-wrap');
        var qs0 = new URLSearchParams(location.search);
        var uid = qs0.get('id');
        if (!uid && qs0.get('username')) {
            var ur = await sb.from('profiles').select('id').eq('username', qs0.get('username')).single();
            if (ur.data) uid = ur.data.id;
        }
        if (!uid && qs0.get('mine')) {
            var me0 = await currentUser();
            if (me0) uid = me0.id;
        }
        if (!uid) { wrap.innerHTML = '<p class="works-note">用户不存在。<a href="community.html">返回社区</a></p>'; return; }
        try {
            var pr = await sb.from('profiles').select('username,created_at,avatar_url,bio,background_url').eq('id', uid).single();
            if (pr.error || !pr.data) throw new Error('用户不存在');
            var works = (await sb.from('works').select('id,title,cover_url,created_at,category,views,work_type')
                .eq('author_id', uid).order('created_at', { ascending: false })).data || [];
            var ids = works.map(function (w) { return w.id; });
            var likes = 0, views = 0;
            works.forEach(function (w) { views += (w.views || 0); });
            if (ids.length) {
                var lr = await sb.from('likes').select('work_id').in('work_id', ids);
                likes = (lr.data || []).length;
            }
            var followingCount = 0, followerCount = 0, followingList = [], followerList = [];
            try {
                var f1 = await sb.from('follows').select('following_id').eq('follower_id', uid);
                followingCount = (f1.data || []).length;
                var f2 = await sb.from('follows').select('follower_id').eq('following_id', uid);
                followerCount = (f2.data || []).length;
                var fids = (f1.data || []).map(function (x) { return x.following_id; })
                    .concat((f2.data || []).map(function (x) { return x.follower_id; }));
                if (fids.length) {
                    var pu = await sb.from('profiles').select('id,username').in('id', Array.from(new Set(fids)));
                    var pmap = {};
                    (pu.data || []).forEach(function (p) { pmap[p.id] = p.username; });
                    followingList = (f1.data || []).map(function (x) { return { id: x.following_id, name: pmap[x.following_id] || '未知' }; });
                    followerList = (f2.data || []).map(function (x) { return { id: x.follower_id, name: pmap[x.follower_id] || '未知' }; });
                }
            } catch (e) {}
            var me = await currentUser();
            var isSelf = me && me.id === uid;
            document.title = pr.data.username + ' - MAXMZH 社区';
            var userListHtml = function (arr) {
                return arr.length
                    ? '<div class="mini-user-list">' + arr.map(function (u) {
                        return '<a href="community-user.html?id=' + u.id + '">' + esc(u.name) + '</a>';
                    }).join('') + '</div>'
                    : '<p class="stat-line">暂无</p>';
            };
            /* 未发布的作品：草稿箱（仅自己可见） */
            var draftHtml = '';
            if (isSelf) {
                try {
                    var dr = await sb.from('drafts').select('*').eq('user_id', uid).order('updated_at', { ascending: false });
                    var drafts = dr.data || [];
                    var typeIcon = { scratch: '🎮', python: '🐍', cpp: '\u2699\uFE0F' };
                    draftHtml = '<h2 class="feat-title">📝 未发布的作品</h2>' +
                        (drafts.length
                            ? drafts.map(function (d) {
                                var pubUrl = d.work_type === 'scratch'
                                    ? 'community-publish.html?sb3=' + encodeURIComponent(d.sb3_url || '') + '&title=' + encodeURIComponent(d.title || '') + '&draft=' + d.id
                                    : 'community-publish.html?type=' + d.work_type + '&code=' + encodeURIComponent(d.code || '') + '&title=' + encodeURIComponent(d.title || '') + '&draft=' + d.id;
                                return '<div class="version-row">' +
                                    '<span class="version-no">' + (typeIcon[d.work_type] || '🎮') + '</span>' +
                                    '<span class="version-meta">' + esc(d.title || '未命名草稿') +
                                    '<br><span class="form-hint">更新于 ' + fmtDate(d.updated_at) + '</span></span>' +
                                    '<span class="version-btns">' +
                                    '<a class="btn btn-ghost btn-sm" href="community-code.html?draft=' + d.id + '">继续编辑</a>' +
                                    '<a class="btn btn-ghost btn-sm" href="' + pubUrl + '">发布</a>' +
                                    '<button class="btn btn-ghost btn-sm" data-deldraft="' + d.id + '">删除</button>' +
                                    '</span></div>';
                            }).join('')
                            : '<p class="works-note">还没有草稿，去在线编程写点东西吧，系统会自动保存。</p>');
                } catch (e) {}
            }
            /* MAXMZH 的作品集 */
            var portfolioHtml = '';
            if (pr.data.username === 'MAXMZH') {
                var pfItems = [
                    ['审判行动系列', 'project1.html', 'picture/spxd.png', '一系列模拟类型的狙击游戏。'],
                    ['穿越火线系列', 'project2.html', 'picture/cyhx.png', '一系列拟 3D 的 FPS 射击游戏。'],
                    ['审判战争', 'project3.html', '', '一款沙盒类多人竞技射击游戏。'],
                    ['PUBG-PVZ', 'project5.html', 'picture/PUBG-PVZ.png', '植物大战僵尸题材射击游戏。'],
                    ['审判行动：致命瞄准', 'project9.html', 'picture/spxdzmmz1.png', '审判行动系列最新作。'],
                    ['Space Waves（太空波）', 'project8.html', 'picture/Spaces%20Waves.jpg', '太空题材 waves 游戏。'],
                    ['MAX Agar', 'project7.html', 'picture/Agar.png', 'agar.io 同人版。'],
                    ['MAX 科技云（APP）', 'project4.html', '', 'MAX 科技云手机应用。'],
                    ['MAX 微信步数修改', 'project6.html', 'picture/MAX%E4%B8%80%E9%94%AE%E5%88%B7%E5%BE%AE%E4%BF%A1%E6%AD%A5%E6%95%B0.png', '微信步数修改工具。'],
                    ['Banana', 'https://world.xiaomawang.com/community/main/compose/bv2F666J', '', '小码王社区作品。'],
                    ['避难所 - 生存 2 · 正式版', 'https://gitblock.cn/Projects/878270', '', 'GitBlock 社区作品。']
                ];
                portfolioHtml = '<h2 class="feat-title">🖼 作品集</h2>' +
                    '<div class="card-grid">' + pfItems.map(function (it) {
                        var cover = it[2]
                            ? '<img src="' + it[2] + '" alt="' + esc(it[0]) + '" loading="lazy">'
                            : '<span class="monogram">' + esc(it[0].charAt(0)) + '</span>';
                        var ext = /^https?:/.test(it[1]) ? ' target="_blank" rel="noopener"' : '';
                        return '<a class="card" href="' + it[1] + '"' + ext + '>' +
                            '<div class="card-cover">' + cover + '</div>' +
                            '<div class="card-body"><h3>' + esc(it[0]) + '</h3><p>' + esc(it[3]) + '</p></div></a>';
                    }).join('') + '</div>';
            }
            /* 我的收藏（仅自己可见） */
            var favHtml = '';
            if (isSelf) {
                try {
                    var favR = await sb.from('favorites').select('work_id')
                        .eq('user_id', uid).order('created_at', { ascending: false });
                    var fids = (favR.data || []).map(function (x) { return x.work_id; });
                    var fworks = [];
                    if (fids.length) {
                        var fwR = await sb.from('works').select('id,title,cover_url,created_at,category,views,work_type')
                            .in('id', fids);
                        var fwMap = {};
                        (fwR.data || []).forEach(function (x) { fwMap[x.id] = x; });
                        fids.forEach(function (fid) { if (fwMap[fid]) fworks.push(fwMap[fid]); });
                    }
                    favHtml = '<h2 class="feat-title">\u2b50 我的收藏</h2>' +
                        (fworks.length
                            ? '<div class="card-grid">' + fworks.map(function (w) {
                                var fcover = w.cover_url
                                    ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                                    : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                                return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                                    '<div class="card-cover">' + fcover + '</div>' +
                                    '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                                    '<p>' + fmtDate(w.created_at) + ' · 👁 ' + (w.views || 0) + '</p>' +
                                    '<div class="card-tags">' + typeBadge(workTypeOf(w)) +
                                    (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + '</div>' +
                                    '</div></a>';
                            }).join('') + '</div>'
                            : '<p class="works-note">还没有收藏，去社区逛逛吧。</p>');
                } catch (e) {}
            }
            /* 🏢 所属工作室 */
            var studioHtml = '';
            try {
                var smr = await sb.from('studio_members').select('role,studio_id').eq('user_id', uid);
                var myStudios = [];
                if (smr.data && smr.data.length) {
                    var sr = await sb.from('studios').select('id,name,description,avatar_url,category')
                        .in('id', smr.data.map(function (x) { return x.studio_id; }));
                    var roleMap = {};
                    smr.data.forEach(function (x) { roleMap[x.studio_id] = x.role; });
                    myStudios = (sr.data || []).map(function (s) { s._role = roleMap[s.id]; return s; });
                }
                studioHtml = '<h2 class="feat-title">🏢 所属工作室</h2>' +
                    (myStudios.length
                        ? '<div class="card-grid">' + myStudios.map(function (s) {
                            var scover = s.avatar_url
                                ? '<img src="' + esc(s.avatar_url) + '" alt="' + esc(s.name) + '" loading="lazy">'
                                : '<span class="monogram">🏢</span>';
                            var roleName = s._role === 'owner' ? '室长' : (s._role === 'admin' ? '管理员' : '成员');
                            return '<a class="card" href="community-studio.html?id=' + s.id + '">' +
                                '<div class="card-cover">' + scover + '</div>' +
                                '<div class="card-body"><h3>' + esc(s.name) + '</h3>' +
                                '<p>' + esc(roleName) + (s.category ? ' · ' + esc(s.category) : '') + '</p></div></a>';
                        }).join('') + '</div>'
                        : '<p class="works-note">' + (isSelf ? '还没有加入工作室，<a href="community-studios.html">去看看</a>吧。' : 'TA 还没有加入工作室。') + '</p>');
            } catch (e) {}
            /* 📚 合集 */
            var colHtml = '';
            try {
                var colR = await sb.from('collections').select('id,title,description,cover_url,created_at')
                    .eq('owner_id', uid).order('created_at', { ascending: false }).limit(12);
                var cols = colR.data || [];
                var colCounts = {};
                if (cols.length) {
                    var cwr = await sb.from('collection_works').select('collection_id')
                        .in('collection_id', cols.map(function (c) { return c.id; }));
                    (cwr.data || []).forEach(function (x) { colCounts[x.collection_id] = (colCounts[x.collection_id] || 0) + 1; });
                }
                colHtml = '<h2 class="feat-title" id="collections">📚 合集' +
                    (isSelf ? ' <a href="community-collections.html" class="btn btn-ghost" style="font-size:.8rem;padding:6px 14px;margin-left:8px">⚙️ 管理</a>' : '') + '</h2>' +
                    (cols.length
                        ? '<div class="card-grid">' + cols.map(function (c) {
                            var ccover = c.cover_url
                                ? '<img src="' + esc(c.cover_url) + '" alt="' + esc(c.title) + '" loading="lazy">'
                                : '<span class="monogram">📚</span>';
                            return '<a class="card" href="community-collection.html?id=' + c.id + '">' +
                                '<div class="card-cover">' + ccover + '</div>' +
                                '<div class="card-body"><h3>' + esc(c.title) + '</h3>' +
                                '<p>' + (colCounts[c.id] || 0) + ' 件作品</p></div></a>';
                        }).join('') + '</div>'
                        : '<p class="works-note">' + (isSelf ? '还没有合集，<a href="community-collections.html">去创建一个</a>吧。' : 'TA 还没有创建合集。') + '</p>');
            } catch (e) {}
            wrap.innerHTML =
                '<p class="article-back"><a href="community.html">← 返回社区</a></p>' +
                '<div class="profile-bg-wrap" id="profile-head">' +
                '<div class="profile-head-inner">' +
                (pr.data.avatar_url ? '<img src="' + esc(pr.data.avatar_url) + '" alt="头像" id="u-avatar" class="profile-avatar">' : '<span class="profile-avatar" style="display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--surface-2)" id="u-avatar">👤</span>') +
                '<div style="flex:1;min-width:200px"><h1 class="section-title" style="margin:0"><span id="u-title"></span>' + esc(pr.data.username) + '<span id="u-badges"></span></h1>' +
                (pr.data.bio ? '<p class="section-sub" style="margin:4px 0 0">' + esc(pr.data.bio) + '</p>' : '') + '</div></div>' +
                (isSelf ? '<p><a class="btn btn-blue" href="community-profile-edit.html">✏️ 编辑个人资料</a> <a class="btn btn-ghost" href="community-settings.html">⚙️ 个人设置</a></p></div>' : '</div>') +
                '<div class="profile-stats">' +
                '<span class="stat">📅 加入于 ' + fmtDate(pr.data.created_at) + '</span>' +
                '<span class="stat"><b>' + works.length + '</b>作品</span>' +
                '<span class="stat"><b>' + likes + '</b>获赞</span>' +
                '<span class="stat"><b>' + views + '</b>浏览</span>' +
                '<span class="stat"><b>' + followingCount + '</b>关注</span>' +
                '<span class="stat"><b>' + followerCount + '</b>粉丝</span></div>' +
                '<div class="work-actions">' +
                (!isSelf && me ? '<button class="follow-btn" id="u-follow-btn">＋ 关注</button>' : '') +
                (!isSelf && me ? ' <a class="btn btn-ghost" href="community-dm.html?to=' + uid + '">💬 私信</a>' : '') +
                (!isSelf && me ? ' <button class="btn btn-ghost" id="u-block-btn">🚫 屏蔽</button>' : '') +
                (!isSelf && !me ? '<a class="btn btn-blue" href="community-auth.html">登录后关注</a>' : '') +
                '</div>' +
                '<h2 class="feat-title">TA 的作品</h2>' +
                (works.length
                    ? '<div class="card-grid">' + works.map(function (w) {
                        var cover = w.cover_url
                            ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                            : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                        return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                            '<div class="card-cover">' + cover + '</div>' +
                            '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                            '<p>' + fmtDate(w.created_at) + ' · 👁 ' + (w.views || 0) + '</p>' +
                            '<div class="card-tags">' + typeBadge(workTypeOf(w)) +
                            (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + '</div>' +
                            '</div></a>';
                    }).join('') + '</div>'
                    : '<p class="works-note">TA 还没有发布作品。</p>') +
                colHtml + studioHtml + favHtml + draftHtml + portfolioHtml +
                '<div class="profile-duo">' +
                '<div><h2 class="feat-title">关注的人</h2>' + userListHtml(followingList) + '</div>' +
                '<div><h2 class="feat-title">粉丝</h2>' + userListHtml(followerList) + '</div></div>' +
                '<h2 class="feat-title">💬 留言板</h2><div id="gb-list"><p class="works-note">加载中…</p></div><div id="gb-form" style="margin-top:12px"></div>';
            /* 个人背景 */
            function applyBg(bg) {
                var head = document.getElementById('profile-head');
                if (!head) return;
                head.classList.remove('animated-bg-nebula', 'animated-bg-aurora', 'animated-bg-cyber');
                head.style.background = '';
                if (!bg) return;
                if (bg.indexOf('animated:') === 0) {
                    head.classList.add('animated-bg-' + bg.slice(9));
                } else {
                    head.style.background = bg;
                }
            }
            applyBg(pr.data.background_url);
            if (isSelf) {
                var bgBtnHtml = '<p><button class="btn btn-ghost" id="change-bg-btn">🎨 换背景</button> ' +
                    '<button class="btn btn-ghost" id="change-avatar-btn">🖼️ 换头像</button>' +
                    '<input type="file" id="avatar-upload-input" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none"></p>';
                var editBtn = document.querySelector('a[href="community-profile-edit.html"]');
                if (editBtn && editBtn.parentNode) editBtn.parentNode.insertAdjacentHTML('afterend', bgBtnHtml);
                document.getElementById('change-bg-btn').addEventListener('click', openBgPicker);
                document.getElementById('change-avatar-btn').addEventListener('click', function () {
                    document.getElementById('avatar-upload-input').click();
                });
                document.getElementById('avatar-upload-input').addEventListener('change', async function () {
                    var f = this.files[0];
                    if (!f) return;
                    if (!/^image\/(png|jpeg|gif|webp)$/.test(f.type)) { alert('只支持 png/jpg/gif/webp 图片'); return; }
                    if (f.size > 2 * 1024 * 1024) { alert('头像不能超过 2MB'); return; }
                    var btn = document.getElementById('change-avatar-btn');
                    btn.disabled = true; btn.textContent = '上传中…';
                    try {
                        var ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
                        var key = 'avatars/' + uid + '/' + Date.now() + '.' + ext;
                        var url = await uploadWithProgress('covers', key, f, f.type, null);
                        var r = await sb.from('profiles').update({ avatar_url: url }).eq('id', uid);
                        if (r.error) throw r.error;
                        var av = document.getElementById('u-avatar');
                        if (av) {
                            if (av.tagName === 'IMG') { av.src = url; }
                            else {
                                var img = document.createElement('img');
                                img.src = url; img.alt = '头像'; img.id = 'u-avatar';
                                img.className = 'profile-avatar';
                                av.replaceWith(img);
                            }
                        }
                    } catch (e) { alert('上传失败：' + e.message); }
                    btn.disabled = false; btn.textContent = '🖼️ 换头像';
                    this.value = '';
                });
            }
            async function openBgPicker() {
                var modalId = 'bg-picker-modal';
                var oldM = document.getElementById(modalId);
                if (oldM) oldM.remove();
                var mHtml = '<div class="modal-backdrop" id="' + modalId + '" style="display:flex">' +
                    '<div class="modal" style="max-width:520px"><h3>🎨 选择背景</h3>' +
                    '<div id="bg-options"><p class="works-note">加载中…</p></div>' +
                    '<div class="modal-actions"><button class="btn" id="bg-cancel" type="button">关闭</button></div></div></div>';
                document.body.insertAdjacentHTML('beforeend', mHtml);
                var modal = document.getElementById(modalId);
                document.getElementById('bg-cancel').addEventListener('click', function () { modal.remove(); });
                modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
                /* 默认 + 已购背景 */
                var opts = [{ name: '默认', data: '' }];
                try {
                    var ir = await sb.from('shop_items').select('id,name,item_data,price').eq('item_type', 'background').eq('is_active', true);
                    var items = ir.data || [];
                    var ur = await sb.from('user_items').select('item_id').eq('user_id', uid);
                    var ownedIds = {};
                    (ur.data || []).forEach(function (r) { ownedIds[r.item_id] = 1; });
                    items.forEach(function (it) {
                        if (it.item_data && (ownedIds[it.id] || it.price === 0)) opts.push({ name: it.name, data: it.item_data });
                    });
                } catch (e) {}
                var cur = pr.data.background_url || '';
                document.getElementById('bg-options').innerHTML = opts.map(function (o) {
                    var cls = 'bg-option' + (o.data === cur ? ' selected' : '');
                    var style = o.data.indexOf('animated:') === 0
                        ? 'class="bg-option animated-bg-' + o.data.slice(9) + (o.data === cur ? ' selected' : '') + '"'
                        : 'class="' + cls + '" style="background:' + (o.data || 'var(--surface-2)') + '"';
                    return '<div ' + style + ' data-bg="' + esc(o.data) + '"><span class="bg-name">' + esc(o.name) + '</span></div>';
                }).join('') + '<p class="form-hint">更多背景可在 <a href="community-shop.html#shop">任务商城</a> 购买</p>';
                modal.querySelectorAll('.bg-option').forEach(function (el) {
                    el.addEventListener('click', async function () {
                        var bg = el.getAttribute('data-bg');
                        var r = await sb.from('profiles').update({ background_url: bg || null }).eq('id', uid);
                        if (r.error) { alert('设置失败：' + r.error.message); return; }
                        pr.data.background_url = bg;
                        applyBg(bg);
                        modal.remove();
                    });
                });
            }
            /* 商城装备展示 */
            try {
                injectFrameCSS();
                var eq = await equippedItemsOf(uid);
                if (eq.frame) {
                    var av = document.getElementById('u-avatar');
                    if (av) av.className = (av.className + ' avatar-frame ' + eq.frame.item_data).trim();
                }
                if (eq.title) {
                    var te = document.getElementById('u-title');
                    if (te) te.innerHTML = '<span style="font-size:.55em;color:#ffd43b;border:1px solid #ffd43b;border-radius:12px;padding:2px 10px;margin-right:8px;vertical-align:middle">' + esc(eq.title.item_data) + '</span>';
                }
                if (eq.badges.length) {
                    var be = document.getElementById('u-badges');
                    if (be) be.innerHTML = ' ' + eq.badges.map(function (b) {
                        return '<span title="' + esc(b.name) + '" style="font-size:.7em;vertical-align:middle">' + esc(b.item_data) + '</span>';
                    }).join('');
                }
            } catch (e) {}
        } catch (e) {
            wrap.innerHTML = '<p class="works-note">' + esc(e.message) + '。<a href="community.html">返回社区</a></p>';
            return;
        }

        /* 删除草稿 */
        wrap.addEventListener('click', async function (e) {
            var del = e.target.closest('button[data-deldraft]');
            if (!del) return;
            if (!confirm('删除这篇草稿？')) return;
            await sb.from('drafts').delete().eq('id', del.getAttribute('data-deldraft'));
            location.reload();
        });

        /* 关注 / 取关 */
        var uFollowBtn = document.getElementById('u-follow-btn');
        if (uFollowBtn && me && !isSelf) {
            var uFollowing = false;
            var uf = await sb.from('follows').select('follower_id')
                .eq('follower_id', me.id).eq('following_id', uid).maybeSingle();
            uFollowing = !!uf.data;
            var paintU = function () {
                uFollowBtn.textContent = uFollowing ? '已关注' : '＋ 关注';
                uFollowBtn.classList.toggle('following', uFollowing);
            };
            paintU();
            uFollowBtn.addEventListener('click', async function () {
                try {
                    if (uFollowing) {
                        await sb.from('follows').delete().eq('follower_id', me.id).eq('following_id', uid);
                        uFollowing = false;
                    } else {
                        var ir = await sb.from('follows').insert({ follower_id: me.id, following_id: uid });
                        if (ir.error) throw ir.error;
                        uFollowing = true;
                        try { await recordTaskProgress('follow_user', 1); } catch (e) {}
                    }
                } catch (e) { alert('操作失败：' + e.message); }
                paintU();
            });
        }

        /* 🚫 屏蔽 / 解除屏蔽 */
        var uBlockBtn = document.getElementById('u-block-btn');
        if (uBlockBtn && me && !isSelf) {
            var uBlocked = false;
            var paintBlock = function () {
                uBlockBtn.textContent = uBlocked ? '✅ 已屏蔽，点击解除' : '🚫 屏蔽';
            };
            try {
                var br = await sb.from('blocks').select('blocker_id')
                    .eq('blocker_id', me.id).eq('blocked_id', uid).maybeSingle();
                uBlocked = !!br.data;
            } catch (e) {}
            paintBlock();
            uBlockBtn.addEventListener('click', async function () {
                try {
                    if (uBlocked) {
                        if (!confirm('确定要解除屏蔽吗？')) return;
                        await sb.from('blocks').delete().eq('blocker_id', me.id).eq('blocked_id', uid);
                        uBlocked = false;
                    } else {
                        if (!confirm('屏蔽后将不再看到 TA 的动态和消息，确定吗？')) return;
                        var ir = await sb.from('blocks').insert({ blocker_id: me.id, blocked_id: uid });
                        if (ir.error) throw ir.error;
                        uBlocked = true;
                    }
                } catch (e) { alert('操作失败：' + e.message); }
                paintBlock();
            });
        }

        /* 💬 留言板 */
        async function loadGuestbook() {
            var listEl = document.getElementById('gb-list');
            var formEl = document.getElementById('gb-form');
            if (!listEl) return;
            var siteAdmin = me ? await isAdmin() : false;
            try {
                var gr = await withTimeout(
                    sb.from('profile_guestbook').select('id,user_id,content,created_at')
                        .eq('profile_id', uid).order('created_at', { ascending: false }).limit(50),
                    25000, '留言加载超时');
                var msgs = gr.data || [];
                var amap = {};
                var authorIds = Array.from(new Set(msgs.map(function (m) { return m.user_id; })));
                if (authorIds.length) {
                    var ar = await sb.from('profiles').select('id,username,avatar_url').in('id', authorIds);
                    (ar.data || []).forEach(function (p) { amap[p.id] = p; });
                }
                listEl.innerHTML = msgs.length ? msgs.map(function (m) {
                    var a = amap[m.user_id] || {};
                    var canDel = (me && me.id === m.user_id) || isSelf || siteAdmin;
                    var av = a.avatar_url
                        ? '<img src="' + esc(a.avatar_url) + '" alt="头像" style="width:36px;height:36px;border-radius:50%;object-fit:cover" loading="lazy">'
                        : '<span style="width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem">👤</span>';
                    return '<div class="card" style="margin-bottom:10px"><div class="card-body">' +
                        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
                        '<a href="community-user.html?id=' + m.user_id + '" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">' +
                        av + '<b>' + esc(a.username || '未知用户') + '</b></a>' +
                        '<span class="form-hint">' + fmtDate(m.created_at) + '</span>' +
                        (canDel ? '<button class="btn btn-ghost btn-sm" data-delgb="' + m.id + '" style="margin-left:auto">删除</button>' : '') +
                        '</div><div>' + md(m.content) + '</div>' +
                        '</div></div>';
                }).join('') : '<p class="works-note">还没有留言，来抢沙发吧！</p>';
            } catch (e) {
                listEl.innerHTML = '<p class="works-note">留言加载失败：' + esc(e.message) + '</p>';
            }
            if (formEl) {
                if (me) {
                    formEl.innerHTML = '<div class="card"><div class="card-body">' +
                        '<b>✍️ 写留言</b>' + mdHelpBtn('gb-text') +
                        '<textarea id="gb-text" maxlength="2000" rows="3" placeholder="说点什么吧…支持 Markdown 语法" style="width:100%;margin:8px 0;padding:10px;border-radius:10px;border:1px solid var(--border,#333);background:var(--surface-2);color:inherit;box-sizing:border-box"></textarea>' +
                        '<p class="form-hint">最多 2000 字</p>' +
                        '<button class="btn btn-blue" id="gb-send">发送留言</button>' +
                        '</div></div>';
                    document.getElementById('gb-send').addEventListener('click', async function () {
                        var ta = document.getElementById('gb-text');
                        var content = ta.value.trim();
                        if (!content) { alert('留言内容不能为空'); return; }
                        if (content.length > 2000) { alert('留言最多 2000 字'); return; }
                        showLoading('发送中…');
                        try {
                            var ir = await withTimeout(
                                sb.from('profile_guestbook').insert({ profile_id: uid, user_id: me.id, content: content }),
                                25000, '发送超时，请检查网络后重试');
                            if (ir.error) throw ir.error;
                            ta.value = '';
                            try { await sendMentions(content, me.id, uid, 'profile'); } catch (e) {}
                            await loadGuestbook();
                        } catch (e2) {
                            alert('发送失败：' + e2.message);
                        } finally {
                            hideLoading();
                        }
                    });
                } else {
                    formEl.innerHTML = '<p class="works-note"><a href="community-auth.html">登录后留言</a></p>';
                }
            }
        }
        loadGuestbook();

        /* 删除留言（作者 / 主页主人 / 站长） */
        wrap.addEventListener('click', async function (e) {
            var del = e.target.closest('button[data-delgb]');
            if (!del) return;
            if (!confirm('删除这条留言？')) return;
            showLoading('删除中…');
            try {
                var r = await withTimeout(
                    sb.from('profile_guestbook').delete().eq('id', del.getAttribute('data-delgb')),
                    25000, '删除超时，请检查网络后重试');
                if (r.error) throw r.error;
                await loadGuestbook();
            } catch (e2) {
                alert('删除失败：' + e2.message);
            } finally {
                hideLoading();
            }
        });
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
</body>
</html>
