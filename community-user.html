<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="description" content="MAX社区用户主页。">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script>try{if(localStorage.getItem("maxmzh-theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="主导航">
            <a class="brand" href="index.html"><img src="logo.png" alt="MAXMZH"></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>
                <button class="nav-toggle" aria-expanded="false" aria-label="打开菜单">☰</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">主页</a></li>
                <li><a href="about.html">个人简介</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="community-home.html" class="active">社区</a></li>

        </nav>
    </header>
    <div class="sub-header">
        <div class="sub-header-inner">
            <a class="sub-brand" href="community-home.html">🎮 <span>MAX社区</span></a>
            <nav class="sub-links" aria-label="社区导航">
                <a href="community-home.html" data-sub="home">首页</a>
                <a href="community.html" data-sub="works">作品</a>
                <a href="community-shop.html" data-sub="shop">🎁 任务商城</a>
                <a href="community-contests.html" data-sub="contests">🏁 赛事</a>
                <a href="community-moderation.html" data-sub="moderation">⚖️ 共建</a>
                <a href="community-studios.html" data-sub="studios">🏢 工作室</a>
                <a href="community-publish.html" data-sub="publish">🚀 发布</a>
                <a href="community-feed.html" data-sub="feed" id="sub-bell">💬 动态</a>
                <span id="sub-auth"><a href="community-auth.html">登录</a></span>
            </nav>
        </div>
    </div>

    <main>
        <section class="portfolio" id="user-wrap">
            <p class="works-note">加载中…</p>
        </section>
    </main>

    <footer>
        <div class="foot-links">
            <a href="index.html">主页</a>
            <a href="about.html">个人简介</a>
            <a href="blog.html">博客</a>
            <a href="community-home.html">社区</a>
            <a href="forum.html">论坛</a>
            <a href="contact.html">联系方式</a>
            <a href="https://github.com/MAXMZH666" target="_blank" rel="noopener">GitHub</a>
        </div>
        <p>&copy; <span data-year>2026</span> MAXMZH. 保留所有权利。</p>
        <p>本站托管于 GitHub Pages</p>
        <p class="foot-stats"><span id="busuanzi_container_site_pv">本站总访问量 <span id="busuanzi_value_site_pv">统计中…</span> 次</span><span> · </span><span id="busuanzi_container_page_pv">本页访问 <span id="busuanzi_value_page_pv">统计中…</span> 次</span></p>
    </footer>

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.js?v=20261003n"></script>
    <script>
    (async function () {
        await renderSubHeader();
        var wrap = document.getElementById('user-wrap');
        var qs0 = new URLSearchParams(location.search);
        var uid = qs0.get('id');
        if (!uid && qs0.get('username')) {
            var ur = await sb.from('profiles').select('id').eq('username', qs0.get('username')).single();
            if (ur.data) uid = ur.data.id;
        }
        if (!uid) { wrap.innerHTML = '<p class="works-note">用户不存在。<a href="community.html">返回社区</a></p>'; return; }
        try {
            var pr = await sb.from('profiles').select('username,created_at,avatar_url,bio,background_url').eq('id', uid).single();
            if (pr.error || !pr.data) throw new Error('用户不存在');
            var works = (await sb.from('works').select('id,title,cover_url,created_at,category,views,work_type')
                .eq('author_id', uid).order('created_at', { ascending: false })).data || [];
            var ids = works.map(function (w) { return w.id; });
            var likes = 0, views = 0;
            works.forEach(function (w) { views += (w.views || 0); });
            if (ids.length) {
                var lr = await sb.from('likes').select('work_id').in('work_id', ids);
                likes = (lr.data || []).length;
            }
            var followingCount = 0, followerCount = 0, followingList = [], followerList = [];
            try {
                var f1 = await sb.from('follows').select('following_id').eq('follower_id', uid);
                followingCount = (f1.data || []).length;
                var f2 = await sb.from('follows').select('follower_id').eq('following_id', uid);
                followerCount = (f2.data || []).length;
                var fids = (f1.data || []).map(function (x) { return x.following_id; })
                    .concat((f2.data || []).map(function (x) { return x.follower_id; }));
                if (fids.length) {
                    var pu = await sb.from('profiles').select('id,username').in('id', Array.from(new Set(fids)));
                    var pmap = {};
                    (pu.data || []).forEach(function (p) { pmap[p.id] = p.username; });
                    followingList = (f1.data || []).map(function (x) { return { id: x.following_id, name: pmap[x.following_id] || '未知' }; });
                    followerList = (f2.data || []).map(function (x) { return { id: x.follower_id, name: pmap[x.follower_id] || '未知' }; });
                }
            } catch (e) {}
            var me = await currentUser();
            var isSelf = me && me.id === uid;
            document.title = pr.data.username + ' - MAXMZH 社区';
            var userListHtml = function (arr) {
                return arr.length
                    ? '<div class="mini-user-list">' + arr.map(function (u) {
                        return '<a href="community-user.html?id=' + u.id + '">' + esc(u.name) + '</a>';
                    }).join('') + '</div>'
                    : '<p class="stat-line">暂无</p>';
            };
            /* 未发布的作品：草稿箱（仅自己可见） */
            var draftHtml = '';
            if (isSelf) {
                try {
                    var dr = await sb.from('drafts').select('*').eq('user_id', uid).order('updated_at', { ascending: false });
                    var drafts = dr.data || [];
                    var typeIcon = { scratch: '🎮', python: '🐍', cpp: '\u2699\uFE0F' };
                    draftHtml = '<h2 class="feat-title">📝 未发布的作品</h2>' +
                        (drafts.length
                            ? drafts.map(function (d) {
                                var pubUrl = d.work_type === 'scratch'
                                    ? 'community-publish.html?sb3=' + encodeURIComponent(d.sb3_url || '') + '&title=' + encodeURIComponent(d.title || '') + '&draft=' + d.id
                                    : 'community-publish.html?type=' + d.work_type + '&code=' + encodeURIComponent(d.code || '') + '&title=' + encodeURIComponent(d.title || '') + '&draft=' + d.id;
                                return '<div class="version-row">' +
                                    '<span class="version-no">' + (typeIcon[d.work_type] || '🎮') + '</span>' +
                                    '<span class="version-meta">' + esc(d.title || '未命名草稿') +
                                    '<br><span class="form-hint">更新于 ' + fmtDate(d.updated_at) + '</span></span>' +
                                    '<span class="version-btns">' +
                                    '<a class="btn btn-ghost btn-sm" href="community-code.html?draft=' + d.id + '">继续编辑</a>' +
                                    '<a class="btn btn-ghost btn-sm" href="' + pubUrl + '">发布</a>' +
                                    '<button class="btn btn-ghost btn-sm" data-deldraft="' + d.id + '">删除</button>' +
                                    '</span></div>';
                            }).join('')
                            : '<p class="works-note">还没有草稿，去在线编程写点东西吧，系统会自动保存。</p>');
                } catch (e) {}
            }
            /* MAXMZH 的作品集 */
            var portfolioHtml = '';
            if (pr.data.username === 'MAXMZH') {
                var pfItems = [
                    ['审判行动系列', 'project1.html', 'picture/spxd.png', '一系列模拟类型的狙击游戏。'],
                    ['穿越火线系列', 'project2.html', 'picture/cyhx.png', '一系列拟 3D 的 FPS 射击游戏。'],
                    ['审判战争', 'project3.html', '', '一款沙盒类多人竞技射击游戏。'],
                    ['PUBG-PVZ', 'project5.html', 'picture/PUBG-PVZ.png', '植物大战僵尸题材射击游戏。'],
                    ['审判行动：致命瞄准', 'project9.html', 'picture/spxdzmmz1.png', '审判行动系列最新作。'],
                    ['Space Waves（太空波）', 'project8.html', 'picture/Spaces%20Waves.jpg', '太空题材 waves 游戏。'],
                    ['MAX Agar', 'project7.html', 'picture/Agar.png', 'agar.io 同人版。'],
                    ['MAX 科技云（APP）', 'project4.html', '', 'MAX 科技云手机应用。'],
                    ['MAX 微信步数修改', 'project6.html', 'picture/MAX%E4%B8%80%E9%94%AE%E5%88%B7%E5%BE%AE%E4%BF%A1%E6%AD%A5%E6%95%B0.png', '微信步数修改工具。'],
                    ['Banana', 'https://world.xiaomawang.com/community/main/compose/bv2F666J', '', '小码王社区作品。'],
                    ['避难所 - 生存 2 · 正式版', 'https://gitblock.cn/Projects/878270', '', 'GitBlock 社区作品。']
                ];
                portfolioHtml = '<h2 class="feat-title">🖼 作品集</h2>' +
                    '<div class="card-grid">' + pfItems.map(function (it) {
                        var cover = it[2]
                            ? '<img src="' + it[2] + '" alt="' + esc(it[0]) + '" loading="lazy">'
                            : '<span class="monogram">' + esc(it[0].charAt(0)) + '</span>';
                        var ext = /^https?:/.test(it[1]) ? ' target="_blank" rel="noopener"' : '';
                        return '<a class="card" href="' + it[1] + '"' + ext + '>' +
                            '<div class="card-cover">' + cover + '</div>' +
                            '<div class="card-body"><h3>' + esc(it[0]) + '</h3><p>' + esc(it[3]) + '</p></div></a>';
                    }).join('') + '</div>';
            }
            /* 我的收藏（仅自己可见） */
            var favHtml = '';
            if (isSelf) {
                try {
                    var favR = await sb.from('favorites').select('work_id')
                        .eq('user_id', uid).order('created_at', { ascending: false });
                    var fids = (favR.data || []).map(function (x) { return x.work_id; });
                    var fworks = [];
                    if (fids.length) {
                        var fwR = await sb.from('works').select('id,title,cover_url,created_at,category,views,work_type')
                            .in('id', fids);
                        var fwMap = {};
                        (fwR.data || []).forEach(function (x) { fwMap[x.id] = x; });
                        fids.forEach(function (fid) { if (fwMap[fid]) fworks.push(fwMap[fid]); });
                    }
                    favHtml = '<h2 class="feat-title">\u2b50 我的收藏</h2>' +
                        (fworks.length
                            ? '<div class="card-grid">' + fworks.map(function (w) {
                                var fcover = w.cover_url
                                    ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                                    : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                                return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                                    '<div class="card-cover">' + fcover + '</div>' +
                                    '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                                    '<p>' + fmtDate(w.created_at) + ' · 👁 ' + (w.views || 0) + '</p>' +
                                    '<div class="card-tags">' + typeBadge(workTypeOf(w)) +
                                    (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + '</div>' +
                                    '</div></a>';
                            }).join('') + '</div>'
                            : '<p class="works-note">还没有收藏，去社区逛逛吧。</p>');
                } catch (e) {}
            }
            wrap.innerHTML =
                '<p class="article-back"><a href="community.html">← 返回社区</a></p>' +
                '<div class="profile-bg-wrap" id="profile-head">' +
                '<div style="display:flex;gap:16px;align-items:center;margin-bottom:8px">' +
                (pr.data.avatar_url ? '<img src="' + esc(pr.data.avatar_url) + '" alt="头像" id="u-avatar" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--border,rgba(255,255,255,.12))">' : '') +
                '<div><h1 class="section-title" style="margin:0"><span id="u-title"></span>' + esc(pr.data.username) + '<span id="u-badges"></span></h1>' +
                (pr.data.bio ? '<p class="section-sub" style="margin:4px 0 0">' + esc(pr.data.bio) + '</p>' : '') + '</div></div>' +
                (isSelf ? '<p><a class="btn btn-blue" href="community-profile-edit.html">✏️ 编辑个人资料</a></p></div>' : '</div>') +
                '<p class="stat-line">加入于 ' + fmtDate(pr.data.created_at) +
                ' · 作品 ' + works.length + ' · 获赞 ' + likes + ' · 总浏览 ' + views +
                ' · 关注 ' + followingCount + ' · 粉丝 ' + followerCount + '</p>' +
                '<div class="work-actions">' +
                (!isSelf && me ? '<button class="follow-btn" id="u-follow-btn">＋ 关注</button>' : '') +
                (!isSelf && !me ? '<a class="btn btn-blue" href="community-auth.html">登录后关注</a>' : '') +
                '</div>' +
                '<h2 class="feat-title">关注的人</h2>' + userListHtml(followingList) +
                '<h2 class="feat-title">粉丝</h2>' + userListHtml(followerList) +
                '<h2 class="feat-title">TA 的作品</h2>' +
                (works.length
                    ? '<div class="card-grid">' + works.map(function (w) {
                        var cover = w.cover_url
                            ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                            : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                        return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                            '<div class="card-cover">' + cover + '</div>' +
                            '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                            '<p>' + fmtDate(w.created_at) + ' · 👁 ' + (w.views || 0) + '</p>' +
                            '<div class="card-tags">' + typeBadge(workTypeOf(w)) +
                            (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + '</div>' +
                            '</div></a>';
                    }).join('') + '</div>'
                    : '<p class="works-note">TA 还没有发布作品。</p>') +
                draftHtml + favHtml + portfolioHtml;
            /* 个人背景 */
            function applyBg(bg) {
                var head = document.getElementById('profile-head');
                if (!head) return;
                head.classList.remove('animated-bg-nebula', 'animated-bg-aurora', 'animated-bg-cyber');
                head.style.background = '';
                if (!bg) return;
                if (bg.indexOf('animated:') === 0) {
                    head.classList.add('animated-bg-' + bg.slice(9));
                } else {
                    head.style.background = bg;
                }
            }
            applyBg(pr.data.background_url);
            if (isSelf) {
                var bgBtnHtml = '<p><button class="btn btn-ghost" id="change-bg-btn">🎨 换背景</button></p>';
                var editBtn = document.querySelector('a[href="community-profile-edit.html"]');
                if (editBtn && editBtn.parentNode) editBtn.parentNode.insertAdjacentHTML('afterend', bgBtnHtml);
                document.getElementById('change-bg-btn').addEventListener('click', openBgPicker);
            }
            async function openBgPicker() {
                var modalId = 'bg-picker-modal';
                var oldM = document.getElementById(modalId);
                if (oldM) oldM.remove();
                var mHtml = '<div class="modal-backdrop" id="' + modalId + '" style="display:flex">' +
                    '<div class="modal" style="max-width:520px"><h3>🎨 选择背景</h3>' +
                    '<div id="bg-options"><p class="works-note">加载中…</p></div>' +
                    '<div class="modal-actions"><button class="btn" id="bg-cancel" type="button">关闭</button></div></div></div>';
                document.body.insertAdjacentHTML('beforeend', mHtml);
                var modal = document.getElementById(modalId);
                document.getElementById('bg-cancel').addEventListener('click', function () { modal.remove(); });
                modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
                /* 默认 + 已购背景 */
                var opts = [{ name: '默认', data: '' }];
                try {
                    var ir = await sb.from('shop_items').select('id,name,item_data,price').eq('item_type', 'background').eq('is_active', true);
                    var items = ir.data || [];
                    var ur = await sb.from('user_items').select('item_id').eq('user_id', uid);
                    var ownedIds = {};
                    (ur.data || []).forEach(function (r) { ownedIds[r.item_id] = 1; });
                    items.forEach(function (it) {
                        if (it.item_data && (ownedIds[it.id] || it.price === 0)) opts.push({ name: it.name, data: it.item_data });
                    });
                } catch (e) {}
                var cur = pr.data.background_url || '';
                document.getElementById('bg-options').innerHTML = opts.map(function (o) {
                    var cls = 'bg-option' + (o.data === cur ? ' selected' : '');
                    var style = o.data.indexOf('animated:') === 0
                        ? 'class="bg-option animated-bg-' + o.data.slice(9) + (o.data === cur ? ' selected' : '') + '"'
                        : 'class="' + cls + '" style="background:' + (o.data || 'var(--surface-2)') + '"';
                    return '<div ' + style + ' data-bg="' + esc(o.data) + '"><span class="bg-name">' + esc(o.name) + '</span></div>';
                }).join('') + '<p class="form-hint">更多背景可在 <a href="community-shop.html#shop">任务商城</a> 购买</p>';
                modal.querySelectorAll('.bg-option').forEach(function (el) {
                    el.addEventListener('click', async function () {
                        var bg = el.getAttribute('data-bg');
                        var r = await sb.from('profiles').update({ background_url: bg || null }).eq('id', uid);
                        if (r.error) { alert('设置失败：' + r.error.message); return; }
                        pr.data.background_url = bg;
                        applyBg(bg);
                        modal.remove();
                    });
                });
            }
            /* 商城装备展示 */
            try {
                injectFrameCSS();
                var eq = await equippedItemsOf(uid);
                if (eq.frame) {
                    var av = document.getElementById('u-avatar');
                    if (av) av.className = (av.className + ' avatar-frame ' + eq.frame.item_data).trim();
                }
                if (eq.title) {
                    var te = document.getElementById('u-title');
                    if (te) te.innerHTML = '<span style="font-size:.55em;color:#ffd43b;border:1px solid #ffd43b;border-radius:12px;padding:2px 10px;margin-right:8px;vertical-align:middle">' + esc(eq.title.item_data) + '</span>';
                }
                if (eq.badges.length) {
                    var be = document.getElementById('u-badges');
                    if (be) be.innerHTML = ' ' + eq.badges.map(function (b) {
                        return '<span title="' + esc(b.name) + '" style="font-size:.7em;vertical-align:middle">' + esc(b.item_data) + '</span>';
                    }).join('');
                }
            } catch (e) {}
        } catch (e) {
            wrap.innerHTML = '<p class="works-note">' + esc(e.message) + '。<a href="community.html">返回社区</a></p>';
            return;
        }

        /* 删除草稿 */
        wrap.addEventListener('click', async function (e) {
            var del = e.target.closest('button[data-deldraft]');
            if (!del) return;
            if (!confirm('删除这篇草稿？')) return;
            await sb.from('drafts').delete().eq('id', del.getAttribute('data-deldraft'));
            location.reload();
        });

        /* 关注 / 取关 */
        var uFollowBtn = document.getElementById('u-follow-btn');
        if (uFollowBtn && me && !isSelf) {
            var uFollowing = false;
            var uf = await sb.from('follows').select('follower_id')
                .eq('follower_id', me.id).eq('following_id', uid).maybeSingle();
            uFollowing = !!uf.data;
            var paintU = function () {
                uFollowBtn.textContent = uFollowing ? '已关注' : '＋ 关注';
                uFollowBtn.classList.toggle('following', uFollowing);
            };
            paintU();
            uFollowBtn.addEventListener('click', async function () {
                try {
                    if (uFollowing) {
                        await sb.from('follows').delete().eq('follower_id', me.id).eq('following_id', uid);
                        uFollowing = false;
                    } else {
                        var ir = await sb.from('follows').insert({ follower_id: me.id, following_id: uid });
                        if (ir.error) throw ir.error;
                        uFollowing = true;
                        try { await recordTaskProgress('follow_user', 1); } catch (e) {}
                    }
                } catch (e) { alert('操作失败：' + e.message); }
                paintU();
            });
        }
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
</body>
</html>
