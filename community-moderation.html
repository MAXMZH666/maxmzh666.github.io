        .case-cover { width: 72px; height: 72px; border-radius: 10px; background: rgba(255,255,255,.05); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; flex-shrink: 0; }

        .case-title { font-weight: 700; font-size: 1.05rem; }
        .case-reason { font-size: .85rem; color: var(--muted); margin: 6px 0; }

        .vote-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.06); margin: 12px 0 6px; }

        .vote-nums { font-size: .85rem; margin-bottom: 10px; }

        .vote-nums .r { color: #ff6b6b; font-weight: 700; }
        .case-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .status-tag { display: inline-block; font-size: .75rem; padding: 3px 10px; border-radius: 12px; margin-bottom: 8px; }
        .status-tag.voting { background: rgba(255,212,59,.15); color: #ffd43b; }
        .status-tag.closed-keep { background: rgba(81,207,102,.15); color: #51cf66; }
        .status-tag.closed-remove { background: rgba(255,107,107,.15); color: #ff6b6b; }
        .admin-box { border-top: 1px dashed var(--border, rgba(255,255,255,.12)); margin-top: 12px; padding-top: 12px; }

    <div class="modal-backdrop" id="vote-modal" style="display:none">
        <div class="modal"><h3 id="vote-title">投票裁决</h3>
            <p class="form-hint" id="vote-hint"></p>
            <div class="modal-actions"><button class="btn" id="vote-cancel" type="button">取消</button>
            <button class="btn btn-blue" id="vote-confirm" type="button">确认</button></div></div>
    </div>
    <script>
    var _pendingCase = null, _pendingVerdict = null;

    function bindVoteModalOnce() {
        if (bindVoteModalOnce.done) return;
        bindVoteModalOnce.done = true;
        document.getElementById('vote-cancel').addEventListener('click', function () {
            document.getElementById('vote-modal').style.display = 'none';
        });
        document.getElementById('vote-modal').addEventListener('click', function (e) {
            if (e.target.id === 'vote-modal') e.target.style.display = 'none';
        });
        document.getElementById('vote-confirm').addEventListener('click', async function () {
            if (!_pendingCase || !_pendingVerdict) return;
            var me = await currentUser();
            if (!me) { location.href = 'community-auth.html'; return; }
            this.disabled = true; this.textContent = '投票中…';
            var r = await sb.from('report_votes').insert({
                case_id: _pendingCase, voter_id: me.id, verdict: _pendingVerdict
            });
            document.getElementById('vote-modal').style.display = 'none';
            this.disabled = false; this.textContent = '确认';
            _pendingCase = null; _pendingVerdict = null;
            if (r.error) alert('投票失败：' + r.error.message);
            else { alert('投票成功！'); load(); }
        });
    }

    async function load() {
        var wrap = document.getElementById('case-list');
        var me = await currentUser();
        var admin = me ? await isAdmin() : false;

        var cr = await sb.from('report_cases').select('*').order('created_at', { ascending: false }).limit(50);
        var cases = cr.data || [];
        if (!cases.length) {
            wrap.innerHTML = '<p class="works-note">暂无举报案件，社区环境良好 👏</p>';
            return;
        }

        /* 批量取作品信息 */
        var workIds = cases.map(function (c) { return c.work_id; });
        var works = {};
        if (workIds.length) {
            var wr = await sb.from('works').select('id,title,cover_url,author_id').in('id', workIds);
            (wr.data || []).forEach(function (w) { works[w.id] = w; });
        }
        /* 批量取票数 */
        var caseIds = cases.map(function (c) { return c.id; });
        var vr = await sb.from('report_votes').select('case_id,verdict').in('case_id', caseIds);
        var votes = {};
        (vr.data || []).forEach(function (v) {
            if (!votes[v.case_id]) votes[v.case_id] = { keep: 0, remove: 0 };
            votes[v.case_id][v.verdict]++;
        });
        /* 我的投票 */
        var myVotes = {};
        if (me) {
            var mvr = await sb.from('report_votes').select('case_id,verdict').in('case_id', caseIds).eq('voter_id', me.id);
            (mvr.data || []).forEach(function (v) { myVotes[v.case_id] = v.verdict; });
        }

        wrap.innerHTML = cases.map(function (c) {
            var w = works[c.work_id] || {};
            var v = votes[c.id] || { keep: 0, remove: 0 };
            var total = v.keep + v.remove;
            var keepPct = total ? Math.round(v.keep / total * 100) : 50;
            var myV = myVotes[c.id];
            var isVoting = c.status === 'voting';
            var tagCls = isVoting ? 'voting' : (c.verdict === 'keep' ? 'closed-keep' : 'closed-remove');
            var tagTxt = isVoting ? '🗳️ 裁决中' : (c.verdict === 'keep' ? '✅ 已保留' : '🗑️ 已下架');
            var cover = w.cover_url ? '<img src="' + esc(w.cover_url) + '" alt="">' : '🎮';

            var html = '<div class="case-card' + (isVoting ? '' : ' closed') + '">' +
                '<span class="status-tag ' + tagCls + '">' + tagTxt + '</span>' +
                '<div class="case-head"><div class="case-cover">' + cover + '</div>' +
                '<div><div class="case-title">' + esc(w.title || '（作品已删除）') + '</div>' +
                '<div class="case-meta">被举报 ' + c.report_count + ' 次 · ' + new Date(c.created_at).toLocaleDateString() + '</div></div></div>' +
                '<div class="case-reason">举报原因：' + esc(c.reason || '（未填写）') + '</div>' +
                '<div class="vote-bar"><div class="keep" style="width:' + keepPct + '%"></div><div class="remove" style="width:' + (100 - keepPct) + '%"></div></div>' +
                '<div class="vote-nums"><span class="k">👍 保留 ' + v.keep + '</span> &nbsp; <span class="r">👎 下架 ' + v.remove + '</span></div>';

            if (isVoting) {
                html += '<div class="case-actions">' +
                    (w.id ? '<a class="btn" href="community-play.html?id=' + w.id + '">查看作品</a>' : '');
                if (!me) html += '<span class="works-note">登录后可参与投票</span>';
                else if (myV) html += '<button class="btn" disabled>你投了「' + (myV === 'keep' ? '保留' : '下架') + '」 ✓</button>';
                else html += '<button class="btn" data-case="' + c.id + '" data-verdict="keep">👍 保留</button>' +
                    '<button class="btn" data-case="' + c.id + '" data-verdict="remove">👎 下架</button>';
                html += '</div>';
            }

            if (admin && isVoting) {
                html += '<div class="admin-box"><span class="case-meta">管理员执行：</span> ' +
                    '<button class="btn" data-exec="' + c.id + '" data-verdict="keep">✅ 保留作品</button> ' +
                    '<button class="btn" data-exec="' + c.id + '" data-verdict="remove" style="color:#ff6b6b">🗑️ 下架作品</button></div>';
            }
            return html + '</div>';
        }).join('');

        /* 投票按钮 */
        document.querySelectorAll('[data-case]').forEach(function (b) {
            b.addEventListener('click', function () {
                _pendingCase = b.getAttribute('data-case');
                _pendingVerdict = b.getAttribute('data-verdict');
                document.getElementById('vote-title').textContent = _pendingVerdict === 'keep' ? '投票：保留作品' : '投票：下架作品';
                document.getElementById('vote-hint').textContent = '每人每案件限投 1 票，投票后不可更改，确认吗？';
                document.getElementById('vote-modal').style.display = 'flex';
            });
        });
        /* 管理员执行 */
        document.querySelectorAll('[data-exec]').forEach(function (b) {
            b.addEventListener('click', async function () {
                var vid = b.getAttribute('data-exec'), vv = b.getAttribute('data-verdict');
                b.disabled = true;
                var r = await executeReportVerdict(vid, vv);
                if (r.ok) { alert(vv === 'keep' ? '已保留作品，案件关闭。' : '已下架作品，案件关闭。'); load(); }
                else { alert('执行失败：' + (r.error || '未知错误')); b.disabled = false; }
            });
        });
    }

    (async function () {
        await renderSubHeader();
        bindVoteModalOnce();
        await load();
    })();
    </script>
