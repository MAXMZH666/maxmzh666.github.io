<body>
    <header class="site-header">
        <nav class="nav" aria-label="主导航">

            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>

        </nav>
    </header>
    <div class="sub-header">
        <div class="sub-header-inner">
            <a class="sub-brand" href="community-home.html">🎮 <span>MAX社区</span></a>
            <nav class="sub-links" aria-label="社区导航">
                <a href="community-home.html" data-sub="home">首页</a>
                <a href="community.html" data-sub="works">🔍 发现</a>
                <a href="community-forum.html" data-sub="forum">💬 论坛</a>
                <a href="community-studios.html" data-sub="studios">🏢 工作室</a>
                <a href="community-shop.html" data-sub="shop">🎁 任务商城</a>
                <a href="community-contests.html" data-sub="contests">🏁 赛事</a>

                <span id="sub-auth"><a href="community-auth.html">登录</a></span>
            </nav>
        </div>
    </div>

    <main>
        <section class="portfolio" style="max-width:760px">
            <p class="article-back"><a href="community-forum.html">← 返回论坛</a></p>
            <h1 class="section-title">✏️ 发新帖</h1>
            <div id="need-login" class="works-note" style="display:none">请先<a href="community-auth.html">登录</a>后再发帖。</div>
            <form id="new-form" style="display:none">
                <div class="form-row">
                    <label for="f-cat">版块</label>
                    <select id="f-cat"></select>
                </div>
                <div class="form-row">
                    <label for="f-title">标题</label>
                    <input type="text" id="f-title" maxlength="80" placeholder="一句话说清你要聊什么">
                </div>
                <div class="form-row">
                    <label for="f-content">正文</label>
                    <textarea id="f-content" maxlength="10000" placeholder="详细说说吧…（支持 Markdown）"></textarea>
                    <p class="form-hint" id="f-mdhelp"></p>
                </div>
                <button type="submit" class="btn-submit" id="f-submit">发布</button>
                <span id="f-msg" class="works-note" style="display:inline"></span>
            </form>
        </section>
    </main>

    <footer>
        <div class="foot-links">
            <a href="index.html">主页</a>
            <a href="about.html">个人简介</a>
            <a href="blog.html">博客</a>
            <a href="community-home.html">社区</a>
            <a href="community-help.html">❓ 帮助</a>

            <a href="https://github.com/MAXMZH666" target="_blank" rel="noopener">GitHub</a>

        <p>本站托管于 GitHub Pages</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.min.js?v=20261004n"></script>
    <script src="js/scripts.js"></script>
    <script>
    (async function () {
        await renderSubHeader();
        var sb = window.sb, me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('new-form').style.display = '';
        var sel = document.getElementById('f-cat');
        try {
            var cr = await sb.from('forum_categories').select('*').order('sort_order');
            (cr.data || []).forEach(function (c) {
                var o = document.createElement('option');
                o.value = c.id; o.textContent = (c.icon || '') + ' ' + c.name;
                sel.appendChild(o);
            });
        } catch (e) {}
        document.getElementById('new-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var title = document.getElementById('f-title').value.trim();
            var content = document.getElementById('f-content').value.trim();
            var msg = document.getElementById('f-msg'), btn = document.getElementById('f-submit');
            if (!title) { msg.textContent = '请填写标题'; return; }
            if (!content) { msg.textContent = '请填写正文'; return; }
            btn.disabled = true; msg.textContent = '发布中…';
            try {
                var tr = await sb.from('forum_threads').insert({
                    category_id: sel.value, author_id: me.id, title: title
                }).select('id').single();
                if (tr.error) throw tr.error;
                var pr = await sb.from('forum_posts').insert({
                    thread_id: tr.data.id, author_id: me.id, content: content
                });
                if (pr.error) throw pr.error;
                try { await recordTaskProgress('post_thread', 1); } catch (e) {}
                try { await sendMentions(title + '\n' + content, me.id, tr.data.id, 'thread'); } catch (e) {}
                location.href = 'community-thread.html?id=' + tr.data.id;
            } catch (err) { msg.textContent = '发布失败：' + err.message; btn.disabled = false; }
        });
    })();
        try { var fh = document.getElementById('f-mdhelp'); if (fh) fh.innerHTML = mdHelpBtn('f-content'); } catch (e) {}
</script>
</body>
</html>
