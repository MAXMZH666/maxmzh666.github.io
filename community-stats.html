        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; padding: 18px 12px; text-align: center; background: var(--card, rgba(255,255,255,.02)); }
        .stat-card .sc-num { font-size: 1.8rem; font-weight: 800; color: #ffd43b; }
        .stat-card .sc-label { color: var(--muted); margin-top: 4px; font-size: .85rem; }
        .stat-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border, rgba(255,255,255,.06)); }
        .stat-row img { width: 64px; height: 40px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .stat-row .sr-title { flex: 1; min-width: 0; font-weight: 600; }
        .stat-row .sr-title a { color: inherit; }
        .stat-row .sr-title .sr-date { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); }
        .stat-row .sr-nums { display: flex; gap: 12px; font-size: .85rem; color: var(--muted); white-space: nowrap; }
        .stat-row .sr-nums b { color: var(--text); }

        #trend-chart { width: 100%; max-height: 260px; }
        .sort-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }

    <main>

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.min.js?v=20261004m"></script>
    <script>
    var sortKey = 'views';
    var workStats = [];

    function renderRows() {
        var box = document.getElementById('work-list');
        var arr = workStats.slice().sort(function (a, b) {
            if (sortKey === 'created_at') return new Date(b.created_at) - new Date(a.created_at);
            return (b[sortKey] || 0) - (a[sortKey] || 0);
        });
        box.innerHTML = arr.length ? arr.map(function (w) {
            var cover = w.cover_url
                ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
            return '<div class="stat-row">' + cover +
                '<div class="sr-title"><a href="community-play.html?id=' + w.id + '">' + esc(w.title) + '</a>' +
                '<span class="sr-date">' + fmtDate(w.created_at) + '</span></div>' +
                '<div class="sr-nums"><span>👁 <b>' + (w.views || 0) + '</b></span>' +
                '<span>❤ <b>' + (w.likes || 0) + '</b></span>' +
                '<span>⭐ <b>' + (w.favs || 0) + '</b></span>' +
                '<span>💬 <b>' + (w.comments || 0) + '</b></span></div></div>';
        }).join('') : '<p class="works-note">还没有作品，去<a href="community-publish.html">发布</a>第一件吧。</p>';
    }

    function renderTrend(works) {
        var labels = [], counts = [];
        for (var i = 6; i >= 0; i--) {
            var d = new Date(); d.setDate(d.getDate() - i);
            var key = d.toISOString().slice(0, 10);
            labels.push((d.getMonth() + 1) + '/' + d.getDate());
            counts.push(works.filter(function (w) { return (w.created_at || '').slice(0, 10) === key; }).length);
        }
        if (typeof Chart === 'undefined') {
            var fb = document.getElementById('trend-fallback');
            fb.style.display = '';
            fb.textContent = '图表组件加载失败。近 7 天发布数：' + labels.map(function (l, i) { return l + '（' + counts[i] + '）'; }).join('、');
            document.getElementById('trend-chart').style.display = 'none';
            return;
        }
        new Chart(document.getElementById('trend-chart'), {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: '发布作品数', data: counts, backgroundColor: 'rgba(255,204,0,.6)', borderColor: '#ffcc00', borderWidth: 1 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: '#888' } }, x: { ticks: { color: '#888' } } } }
        });
    }

    function loadScriptOnce(src) {
        return new Promise(function (resolve, reject) {
            if (document.querySelector('script[src="' + src + '"]')) return resolve();
            var s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    async function load() {
        var me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('stats-wrap').style.display = '';
        try {
            var r = await sb.from('works').select('id,title,cover_url,views,created_at')
                .eq('author_id', me.id).order('created_at', { ascending: false });
            var works = r.data || [];
            var ids = works.map(function (w) { return w.id; });
            var likeMap = {}, favMap = {}, cmtMap = {};
            if (ids.length) {
                var lr = await sb.from('likes').select('work_id').in('work_id', ids);
                (lr.data || []).forEach(function (x) { likeMap[x.work_id] = (likeMap[x.work_id] || 0) + 1; });
                var fr = await sb.from('favorites').select('work_id').in('work_id', ids);
                (fr.data || []).forEach(function (x) { favMap[x.work_id] = (favMap[x.work_id] || 0) + 1; });
                var cr = await sb.from('comments').select('work_id').in('work_id', ids);
                (cr.data || []).forEach(function (x) { cmtMap[x.work_id] = (cmtMap[x.work_id] || 0) + 1; });
            }
            workStats = works.map(function (w) {
                w.likes = likeMap[w.id] || 0; w.favs = favMap[w.id] || 0; w.comments = cmtMap[w.id] || 0;
                return w;
            });
            document.getElementById('st-works').textContent = works.length;
            document.getElementById('st-views').textContent = works.reduce(function (s, w) { return s + (w.views || 0); }, 0);
            document.getElementById('st-likes').textContent = works.reduce(function (s, w) { return s + w.likes; }, 0);
            document.getElementById('st-favs').textContent = works.reduce(function (s, w) { return s + w.favs; }, 0);
            renderRows();
            try { await loadScriptOnce('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js'); } catch (e) {}
            renderTrend(works);
        } catch (e) {
            document.getElementById('work-list').innerHTML = '<p class="works-note">加载失败：' + esc(e.message || '') + '</p>';
        }
        document.querySelectorAll('[data-sort]').forEach(function (b) {
            b.addEventListener('click', function () {
                document.querySelectorAll('[data-sort]').forEach(function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                sortKey = b.getAttribute('data-sort');
                renderRows();
            });
        });
    }
    load();
    </script>
