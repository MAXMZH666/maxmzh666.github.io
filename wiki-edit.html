<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0e">
    <title>编辑词条 - MAXMZH百科</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css?v=20261004h">
    <script>try{if(localStorage.getItem("maxmzh-theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
    <style>
        .edit-form label { display: block; margin: 12px 0 4px; font-weight: 600; }
        .edit-form input, .edit-form textarea, .edit-form select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: inherit; box-sizing: border-box; }
        .edit-form textarea { min-height: 300px; font-family: monospace; font-size: .88rem; line-height: 1.7; }
        .form-hint { color: var(--muted); font-size: .82rem; margin-top: 4px; }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="主导航">
            <a class="brand" href="index.html"><img src="logo.png" alt="MAXMZH"></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>
                <button class="nav-toggle" aria-expanded="false" aria-label="打开菜单">☰</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">主页</a></li>
                <li><a href="about.html">个人简介</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="net-tools.html">工具</a></li>
                <li><a href="ai-code.html">AI助手</a></li><li><a href="packager/index.html">打包</a></li><li><a href="wiki.html">百科</a></li>
                <li><a href="community-home.html">社区</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="portfolio" style="max-width:760px">
            <p><a href="wiki.html" style="color:var(--muted)">← 返回百科</a></p>
            <h1 class="section-title" id="edit-h1">新建词条</h1>
            <div id="edit-login-tip" class="tool-panel" style="display:none">
                <p>请先 <a href="community-auth.html">登录社区账号</a> 再创建或编辑词条。</p>
            </div>
            <div class="edit-form" id="edit-form" style="display:none">
                <label>标题</label>
                <input type="text" id="f-title" placeholder="词条标题">
                <label>标识 (slug，英文唯一)</label>
                <input type="text" id="f-slug" placeholder="如 scratch-start">
                <label>分类</label>
                <select id="f-cat">
                    <option>Scratch开发</option>
                    <option>建站</option>
                    <option>社区玩法</option>
                    <option>综合</option>
                </select>
                <label>正文 (支持 Markdown)</label>
                <textarea id="f-content" placeholder="# 标题&#10;&#10;正文内容…"></textarea>
                <p class="form-hint">支持 # ## ### 标题、**粗体**、`代码`、```代码块```</p>
                <div style="margin-top:16px;display:flex;gap:8px">
                    <button class="btn btn-primary" id="f-save" type="button">保存</button>
                    <button class="btn btn-ghost" id="f-del" type="button" style="display:none;color:#ff6b6b">删除</button>
                </div>
                <p id="f-msg" style="margin-top:8px"></p>
            </div>
        </section>
    </main>

    <footer>
        <div class="foot-links">
            <a href="index.html">主页</a>
            <a href="wiki.html">百科</a>
            <a href="community-home.html">社区</a>
        </div>
        <p>&copy; <span data-year>2026</span> MAXMZH. 保留所有权利。</p>
    </footer>
    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.min.js?v=20261010a"></script>
    <script>
    (function () {
        var slug = '';
        try { slug = new URLSearchParams(location.search).get('slug') || ''; } catch (e) {}
        var me = null, isNew = !slug;
        var msg = document.getElementById('f-msg');
        function say(t, ok) { msg.innerHTML = '<span class="' + (ok ? 'ok' : 'err') + '">' + t + '</span>'; }
        function slugify(s) {
            return s.trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || ('wiki-' + Date.now());
        }
        currentUser().then(function (u) {
            me = u;
            if (!me) { document.getElementById('edit-login-tip').style.display = ''; return; }
            document.getElementById('edit-form').style.display = '';
            if (!isNew) {
                document.getElementById('edit-h1').textContent = '编辑词条';
                document.getElementById('f-del').style.display = '';
                sb.from('wiki_articles').select('*').eq('slug', slug).single().then(function (r) {
                    if (r.error || !r.data) { say('词条不存在'); return; }
                    var a = r.data;
                    document.getElementById('f-title').value = a.title;
                    document.getElementById('f-slug').value = a.slug;
                    document.getElementById('f-slug').disabled = true;
                    document.getElementById('f-cat').value = a.category;
                    document.getElementById('f-content').value = a.content;
                });
            }
        });
        document.getElementById('f-title').addEventListener('input', function () {
            if (isNew) document.getElementById('f-slug').value = slugify(this.value);
        });
        document.getElementById('f-save').addEventListener('click', async function () {
            var title = document.getElementById('f-title').value.trim();
            var content = document.getElementById('f-content').value;
            var cat = document.getElementById('f-cat').value;
            if (!title) { say('请填写标题'); return; }
            if (!content.trim()) { say('请填写正文'); return; }
            say('保存中…');
            try {
                if (isNew) {
                    var s = slugify(document.getElementById('f-slug').value || title);
                    var r = await sb.from('wiki_articles').insert({ slug: s, title: title, content: content, category: cat, author_id: me.id });
                    if (r.error) throw r.error;
                    location.href = 'wiki-article.html?slug=' + encodeURIComponent(s);
                } else {
                    var r2 = await sb.from('wiki_articles').update({ title: title, content: content, category: cat, updated_at: new Date().toISOString() }).eq('slug', slug);
                    if (r2.error) throw r2.error;
                    say('保存成功！', true);
                    setTimeout(function () { location.href = 'wiki-article.html?slug=' + encodeURIComponent(slug); }, 800);
                }
            } catch (e) { say('保存失败：' + (e.message || '请重试')); }
        });
        document.getElementById('f-del').addEventListener('click', async function () {
            if (!confirm('确定删除这个词条吗？')) return;
            var r = await sb.from('wiki_articles').delete().eq('slug', slug);
            if (r.error) { say('删除失败'); return; }
            location.href = 'wiki.html';
        });
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
</body>
</html>
