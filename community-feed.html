        .feed-row { display: block; padding: 14px 16px; border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; margin-bottom: 10px; background: var(--card, rgba(255,255,255,.02)); }

        .feed-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--card); }
        .feed-thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }

        .feed-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .feed-act-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: transparent; color: var(--muted); font-size: .85rem; cursor: pointer; }
        .feed-act-btn:hover { border-color: var(--accent, #4d7cfe); color: inherit; }
        .feed-act-btn.liked { border-color: #f87171; color: #f87171; }
        .feed-act-btn:disabled { opacity: .6; cursor: default; }
        .feed-comments { margin-top: 10px; border-top: 1px dashed var(--border, rgba(255,255,255,.08)); padding-top: 10px; }
        .feed-cmt { padding: 8px 0; border-bottom: 1px solid var(--border, rgba(255,255,255,.05)); font-size: .88rem; }
        .feed-cmt:last-child { border-bottom: none; }
        .feed-cmt-meta { color: var(--muted); font-size: .78rem; margin-bottom: 3px; }
        .feed-cmt-form { display: flex; gap: 8px; margin-top: 8px; }
        .feed-cmt-form input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--card); color: inherit; font-size: .88rem; }
        .feed-cmt-form button { padding: 8px 18px; border-radius: 999px; border: none; background: var(--accent, #4d7cfe); color: #fff; cursor: pointer; font-size: .85rem; flex-shrink: 0; }

    <script>
    (async function () {
        await renderSubHeader();
        var sb = window.sb, me = await currentUser();
        if (!me) { document.getElementById('feed-need-login').style.display = ''; return; }
        var note = document.getElementById('feed-note'), list = document.getElementById('feed-list');
        note.style.display = '';
        try {
            var fr = await sb.from('follows').select('following_id').eq('follower_id', me.id);
            if (fr.error) throw fr.error;
            var ids = (fr.data || []).map(function (f) { return f.following_id; });
            /* 🚫 过滤被屏蔽用户 */
            try {
                var _blocked = await getBlockedIds();
                if (_blocked.length) ids = ids.filter(function (x) { return _blocked.indexOf(x) < 0; });
            } catch (e) {}
            if (!ids.length) { note.innerHTML = '还没有关注任何人，去<a href="community-rank.html">排行榜</a>发现感兴趣的作者吧。'; return; }
            var items = [];
            var wr = await sb.from('works').select('id,title,cover_url,author_id,created_at').in('author_id', ids).order('created_at', { ascending: false }).limit(30);
            (wr.data || []).forEach(function (w) { items.push({ kind: 'work', id: w.id, title: w.title, cover: w.cover_url, author_id: w.author_id, at: w.created_at }); });
            var tr = await sb.from('forum_threads').select('id,title,author_id,created_at').in('author_id', ids).order('created_at', { ascending: false }).limit(30);
            (tr.data || []).forEach(function (t) { items.push({ kind: 'thread', id: t.id, title: t.title, author_id: t.author_id, at: t.created_at }); });
            items.sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
            items = items.slice(0, 50);
            if (!items.length) { note.textContent = '关注的人还没有发布任何内容。'; return; }
            note.style.display = 'none';
            var aids = Array.from(new Set(items.map(function (x) { return x.author_id; })));
            var unames = {};
            var pr = await sb.from('profiles').select('id,username').in('id', aids);
            (pr.data || []).forEach(function (p) { unames[p.id] = p.username; });
            /* 批量查点赞数 + 我的点赞状态 */
            var workIds = items.filter(function (x) { return x.kind === 'work'; }).map(function (x) { return x.id; });
            var threadIds = items.filter(function (x) { return x.kind === 'thread'; }).map(function (x) { return x.id; });
            var likeCount = {}, myLiked = {}, cmtCount = {};
            try {
                if (workIds.length) {
                    var wl = await sb.from('likes').select('work_id').in('work_id', workIds);
                    (wl.data || []).forEach(function (r) { likeCount['w:' + r.work_id] = (likeCount['w:' + r.work_id] || 0) + 1; });
                    var ml = await sb.from('likes').select('work_id').eq('user_id', me.id).in('work_id', workIds);
                    (ml.data || []).forEach(function (r) { myLiked['w:' + r.work_id] = 1; });
                    var wc = await sb.from('comments').select('work_id').in('work_id', workIds);
                    (wc.data || []).forEach(function (r) { cmtCount['w:' + r.work_id] = (cmtCount['w:' + r.work_id] || 0) + 1; });
                }
                if (threadIds.length) {
                    var tl = await sb.from('thread_likes').select('thread_id').in('thread_id', threadIds);
                    (tl.data || []).forEach(function (r) { likeCount['t:' + r.thread_id] = (likeCount['t:' + r.thread_id] || 0) + 1; });
                    var mt = await sb.from('thread_likes').select('thread_id').eq('user_id', me.id).in('thread_id', threadIds);
                    (mt.data || []).forEach(function (r) { myLiked['t:' + r.thread_id] = 1; });
                    var tc = await sb.from('forum_posts').select('thread_id').in('thread_id', threadIds);
                    (tc.data || []).forEach(function (r) { cmtCount['t:' + r.thread_id] = (cmtCount['t:' + r.thread_id] || 0) + 1; });
                }
            } catch (e) { /* 计数失败不影响主列表 */ }
            list.innerHTML = items.map(function (x) {
                var isWork = x.kind === 'work';
                var key = (isWork ? 'w:' : 't:') + x.id;
                var href = isWork ? 'community-play.html?id=' + x.id : 'community-thread.html?id=' + x.id;
                var thumb = isWork
                    ? (x.cover ? '<img class="feed-thumb" src="' + esc(x.cover) + '" alt="" loading="lazy">' : '<span class="feed-thumb ph">🎮</span>')
                    : '<span class="feed-thumb ph">💬</span>';
                return '<div class="feed-row" data-kind="' + x.kind + '" data-id="' + x.id + '">' +
                    '<a class="feed-row-main" href="' + href + '">' + thumb +
                    '<div class="feed-main"><div class="feed-title">' + esc(x.title) + '</div>' +
                    '<div class="feed-meta"><span class="tag">' + (isWork ? '🎮 作品' : '💬 帖子') + '</span>' +
                    '<span>' + esc(unames[x.author_id] || '未知') + '</span>' +
                    '<span>' + fmtDate(x.at) + '</span></div></div></a>' +
                    '<div class="feed-actions">' +
                    '<button class="feed-act-btn feed-like' + (myLiked[key] ? ' liked' : '') + '" data-kind="' + x.kind + '" data-id="' + x.id + '">❤️ <span>' + (likeCount[key] || 0) + '</span></button>' +
                    '<button class="feed-act-btn feed-cmt-toggle" data-kind="' + x.kind + '" data-id="' + x.id + '">💬 <span>' + (cmtCount[key] || 0) + '</span></button>' +
                    '</div>' +
                    '<div class="feed-comments" style="display:none"><div class="feed-cmt-list"><p class="works-note" style="padding:12px 0">加载中…</p></div>' +
                    '<div class="feed-cmt-form"><input maxlength="300" placeholder="写评论…（@用户名 可提及）" aria-label="写评论">' +
                    '<button>发送</button></div></div></div>';
            }).join('');
            /* 内联点赞 */
            list.querySelectorAll('.feed-like').forEach(function (b) {
                b.addEventListener('click', async function () {
                    var kind = b.getAttribute('data-kind'), fid = b.getAttribute('data-id');
                    var tbl = kind === 'work' ? 'likes' : 'thread_likes';
                    var col = kind === 'work' ? 'work_id' : 'thread_id';
                    b.disabled = true;
                    try {
                        var likedNow = b.classList.contains('liked');
                        if (likedNow) {
                            await sb.from(tbl).delete().eq(col, fid).eq('user_id', me.id);
                            b.classList.remove('liked');
                        } else {
                            var ins = { user_id: me.id }; ins[col] = fid;
                            var ir = await sb.from(tbl).insert(ins);
                            if (ir.error) throw ir.error;
                            b.classList.add('liked');
                        }
                        var cntEl = b.querySelector('span');
                        var n = parseInt(cntEl.textContent, 10) || 0;
                        cntEl.textContent = likedNow ? Math.max(0, n - 1) : n + 1;
                    } catch (e) { alert('操作失败：' + e.message); }
                    b.disabled = false;
                });
            });
            /* 内联评论：展开 / 收起 */
            list.querySelectorAll('.feed-cmt-toggle').forEach(function (b) {
                b.addEventListener('click', async function () {
                    var row = b.closest('.feed-row');
                    var box = row.querySelector('.feed-comments');
                    var open = box.style.display !== 'none';
                    box.style.display = open ? 'none' : '';
                    if (open || box.dataset.loaded) return;
                    box.dataset.loaded = '1';
                    await loadFeedComments(row);
                });
            });
            /* 内联评论：发表 */
            list.querySelectorAll('.feed-cmt-form').forEach(function (fm) {
                var input = fm.querySelector('input'), btn = fm.querySelector('button');
                btn.addEventListener('click', async function () {
                    var row = fm.closest('.feed-row');
                    var kind = row.getAttribute('data-kind'), fid = row.getAttribute('data-id');
                    var text = input.value.trim();
                    if (!text) return;
                    btn.disabled = true;
                    try {
                        var payload = kind === 'work'
                            ? { work_id: fid, author_id: me.id, content: text }
                            : { thread_id: fid, author_id: me.id, content: text };
                        var tbl = kind === 'work' ? 'comments' : 'forum_posts';
                        var ir = await sb.from(tbl).insert(payload);
                        if (ir.error) throw ir.error;
                        input.value = '';
                        try { await sendMentions(text, me.id, fid, kind); } catch (e) {}
                        delete row.querySelector('.feed-comments').dataset.loaded;
                        await loadFeedComments(row);
                        /* 评论数 +1 */
                        var cbtn = row.querySelector('.feed-cmt-toggle span');
                        cbtn.textContent = (parseInt(cbtn.textContent, 10) || 0) + 1;
                    } catch (e) { alert('发表失败：' + e.message); }
                    btn.disabled = false;
                });
            });
            /* 加载某卡片的内联评论 */
            async function loadFeedComments(row) {
                var kind = row.getAttribute('data-kind'), fid = row.getAttribute('data-id');
                var listEl = row.querySelector('.feed-cmt-list');
                try {
                    var r = kind === 'work'
                        ? await sb.from('comments').select('id,content,created_at,author_id').eq('work_id', fid).order('created_at', { ascending: false }).limit(20)
                        : await sb.from('forum_posts').select('id,content,created_at,author_id').eq('thread_id', fid).order('created_at', { ascending: false }).limit(20);
                    if (r.error) throw r.error;
                    var cs = r.data || [];
                    if (!cs.length) { listEl.innerHTML = '<p class="works-note" style="padding:12px 0">还没有评论，来抢沙发！</p>'; return; }
                    var uids = Array.from(new Set(cs.map(function (c) { return c.author_id; })));
                    var nm = {};
                    var pu = await sb.from('profiles').select('id,username').in('id', uids);
                    (pu.data || []).forEach(function (p) { nm[p.id] = p.username; });
                    listEl.innerHTML = cs.map(function (c) {
                        return '<div class="feed-cmt"><div class="feed-cmt-meta">' +
                            esc(nm[c.author_id] || '未知') + ' · ' + fmtDate(c.created_at) + '</div>' +
                            '<div>' + md(c.content) + '</div></div>';
                    }).join('');
                } catch (e) { listEl.innerHTML = '<p class="works-note" style="padding:12px 0">评论加载失败</p>'; }
            }
        } catch (e) { note.textContent = '加载失败：' + e.message; }
    })();
    </script>

    <script>
    /* ===== 通知标签页（原通知页融合） ===== */
    async function loadNotify() {
        var wrap = document.getElementById('notify-wrap');
        var me = await currentUser();
        if (!me) { wrap.innerHTML = '<p class="works-note">请先<a href="community-auth.html">登录</a>后查看通知。</p>'; return; }
        try {
            var r = await sb.from('notifications').select('*')
                .eq('user_id', me.id).order('created_at', { ascending: false }).limit(50);
            if (r.error) throw r.error;
            var ns = r.data || [];
            if (!ns.length) { wrap.innerHTML = '<p class="works-note">还没有通知。</p>'; return; }
            var uids = Array.from(new Set(ns.map(function (n) { return n.from_user_id; })));
            var wids = Array.from(new Set(ns.map(function (n) { return n.work_id; }).filter(Boolean)));
            var tids = Array.from(new Set(ns.map(function (n) { return n.thread_id; }).filter(Boolean)));
            var unames = {}, wtitles = {}, ttitles = {};
            if (uids.length) {
                var pu = await sb.from('profiles').select('id,username').in('id', uids);
                (pu.data || []).forEach(function (p) { unames[p.id] = p.username; });
            }
            if (wids.length) {
                var wq = await sb.from('works').select('id,title').in('id', wids);
                (wq.data || []).forEach(function (w) { wtitles[w.id] = w.title; });
            }
            if (tids.length) {
                var tq = await sb.from('forum_threads').select('id,title').in('id', tids);
                (tq.data || []).forEach(function (t) { ttitles[t.id] = t.title; });
            }
            /* 工作室相关：查工作室名 + 申请/邀请状态 */
            var studioIds = Array.from(new Set(ns.map(function (n) { return n.studio_id; }).filter(Boolean)));
            var studioNames = {};
            if (studioIds.length) {
                var sq = await sb.from('studios').select('id,name').in('id', studioIds);
                (sq.data || []).forEach(function (x) { studioNames[x.id] = x.name; });
            }
            var reqMap = {}, invMap = {};
            var reqIds = [], invIds = [];
            ns.forEach(function (n) {
                if ((n.type === 'studio_request' || n.type === 'studio_request_result') && n.ref_id) reqIds.push(n.ref_id);
                if ((n.type === 'studio_invite' || n.type === 'studio_invite_result') && n.ref_id) invIds.push(n.ref_id);
            });
            if (reqIds.length) {
                var rqq = await sb.from('studio_join_requests').select('id,status').in('id', reqIds);
                (rqq.data || []).forEach(function (x) { reqMap[x.id] = x.status; });
            }
            if (invIds.length) {
                var iqq = await sb.from('studio_invites').select('id,status').in('id', invIds);
                (iqq.data || []).forEach(function (x) { invMap[x.id] = x.status; });
            }
            wrap.innerHTML = ns.map(function (n) {
                var who = esc(unames[n.from_user_id] || '有人');
                var wt = n.work_id ? esc(wtitles[n.work_id] || '你的作品') : '';
                var tt = n.thread_id ? esc(ttitles[n.thread_id] || '你的帖子') : '';
                var cls = 'notify-item' + (n.is_read ? '' : ' unread');
                var tm = '<div class="notify-time">' + fmtDate(n.created_at) + '</div>';
                /* 入室申请（发给管理员）：消息内直接审批 */
                if (n.type === 'studio_request') {
                    var sname = esc(studioNames[n.studio_id] || '工作室');
                    if (reqMap[n.ref_id] === 'pending') {
                        return '<div class="' + cls + '"><div>📨 <b>' + who + '</b> 申请加入「' + sname + '」</div>' +
                            '<div class="notify-actions">' +
                            '<button class="btn btn-blue btn-sm" data-nreq-ok="' + n.ref_id + '">✅ 同意</button>' +
                            '<button class="btn btn-sm" data-nreq-no="' + n.ref_id + '">❌ 拒绝</button>' +
                            '<a class="btn btn-ghost btn-sm" href="community-studio.html?id=' + n.studio_id + '">查看工作室</a></div>' + tm + '</div>';
                    }
                    var rst = reqMap[n.ref_id];
                    return '<a class="' + cls + '" href="community-studio.html?id=' + n.studio_id + '"><div>📨 ' + who +
                        ' 的入室申请' + (rst === 'approved' ? '已通过' : rst === 'rejected' ? '已被拒绝' : '') +
                        '（「' + sname + '」）</div>' + tm + '</a>';
                }
                /* 工作室邀请（发给被邀请人）：消息内直接接受/拒绝 */
                if (n.type === 'studio_invite') {
                    var iname = esc(studioNames[n.studio_id] || '工作室');
                    if (invMap[n.ref_id] === 'pending') {
                        return '<div class="' + cls + '"><div>✉️ <b>' + who + '</b> 邀请你加入工作室「' + iname + '」</div>' +
                            '<div class="notify-actions">' +
                            '<button class="btn btn-blue btn-sm" data-ninv-ok="' + n.ref_id + '">✅ 接受</button>' +
                            '<button class="btn btn-sm" data-ninv-no="' + n.ref_id + '">❌ 拒绝</button>' +
                            '<a class="btn btn-ghost btn-sm" href="community-studio.html?id=' + n.studio_id + '">先看看</a></div>' + tm + '</div>';
                    }
                    var ist = invMap[n.ref_id];
                    return '<a class="' + cls + '" href="community-studio.html?id=' + n.studio_id + '"><div>✉️ ' + who +
                        ' 曾邀请你加入「' + iname + '」(' + (ist === 'accepted' ? '已接受' : '已拒绝') + ')</div>' + tm + '</a>';
                }
                /* 申请结果（发给申请人） */
                if (n.type === 'studio_request_result') {
                    var rname = esc(studioNames[n.studio_id] || '工作室');
                    var ok = reqMap[n.ref_id] === 'approved';
                    return '<a class="' + cls + '" href="community-studio.html?id=' + n.studio_id + '"><div>' +
                        (ok ? '🎉 你加入「' + rname + '」的申请<b>已通过</b>！' : '😞 你加入「' + rname + '」的申请未通过') +
                        '</div>' + tm + '</a>';
                }
                /* 邀请结果（发给邀请人） */
                if (n.type === 'studio_invite_result') {
                    var vname = esc(studioNames[n.studio_id] || '工作室');
                    return '<a class="' + cls + '" href="community-studio.html?id=' + n.studio_id + '"><div>🎉 ' + who +
                        ' 接受了你的邀请，加入了「' + vname + '」</div>' + tm + '</a>';
                }
                /* 私信通知 */
                if (n.type === 'dm') {
                    return '<a class="' + cls + '" href="community-dm.html?to=' + n.from_user_id + '"><div>✉️ <b>' + who +
                        '</b> 发来一条私信</div>' + tm + '</a>';
                }
                /* @提及 */
                if (n.type === 'mention') {
                    var mlink = 'community-feed.html';
                    if (n.ref_type === 'work') mlink = 'community-play.html?id=' + n.ref_id;
                    else if (n.ref_type === 'thread') mlink = 'community-thread.html?id=' + n.ref_id;
                    else if (n.ref_type === 'profile') mlink = 'community-user.html?id=' + n.ref_id;
                    else if (n.ref_type === 'studio') mlink = 'community-studio.html?id=' + n.ref_id;
                    var mtxt = esc(n.content || '').slice(0, 60);
                    return '<a class="' + cls + '" href="' + mlink + '"><div>📣 <b>' + who + '</b> @了你' +
                        (mtxt ? '：「' + mtxt + (n.content && n.content.length > 60 ? '…' : '') + '」' : '') +
                        '</div>' + tm + '</a>';
                }
                var text, link;
                if (n.type === 'like') { text = who + ' 点赞了你的作品《' + wt + '》'; link = 'community-play.html?id=' + n.work_id; }
                else if (n.type === 'comment') { text = who + ' 评论了你的作品《' + wt + '》'; link = 'community-play.html?id=' + n.work_id; }
                else if (n.type === 'reply') { text = who + ' 回复了你的帖子《' + tt + '》'; link = 'community-thread.html?id=' + n.thread_id; }
                else if (n.type === 'contest_entry') { text = '🏁 ' + who + ' 报名参加了你的赛事「' + esc(n.content || '') + '」'; link = 'community-contest.html?id=' + n.ref_id; }
                else if (n.type === 'contest_reward') { text = '🏆 ' + esc(n.content || ''); link = 'community-contest.html?id=' + n.ref_id; }
                else { text = who + ' 关注了你'; link = 'community-user.html?id=' + n.from_user_id; }
                return '<a class="' + cls + '" href="' + link + '">' +
                    '<div>' + text + '</div>' + tm + '</a>';
            }).join('');
            /* 消息内审批/应答按钮 */
            wrap.querySelectorAll('[data-nreq-ok],[data-nreq-no]').forEach(function (b) {
                b.addEventListener('click', async function () {
                    var rid = b.getAttribute('data-nreq-ok') || b.getAttribute('data-nreq-no');
                    var approve = !!b.getAttribute('data-nreq-ok');
                    var r = await sb.rpc('handle_join_request', { p_request_id: rid, p_approve: approve });
                    if (r.error) { alert('操作失败：' + r.error.message); return; }
                    if (String(r.data || '').indexOf('rejected:') === 0) alert('⚠️ 对方已加入其他工作室，申请已自动拒绝');
                    loadNotify();
                });
            });
            wrap.querySelectorAll('[data-ninv-ok],[data-ninv-no]').forEach(function (b) {
                b.addEventListener('click', async function () {
                    var iid = b.getAttribute('data-ninv-ok') || b.getAttribute('data-ninv-no');
                    var accept = !!b.getAttribute('data-ninv-ok');
                    var r = await sb.rpc('handle_studio_invite', { p_invite_id: iid, p_accept: accept });
                    if (r.error) { alert('操作失败：' + r.error.message); return; }
                    if (String(r.data || '').indexOf('rejected:') === 0) alert('⚠️ 你已加入其他工作室，无法接受该邀请');
                    else if (accept) alert('🎉 已加入工作室！');
                    loadNotify();
                });
            });
            var unreadIds = ns.filter(function (n) { return !n.is_read; }).map(function (n) { return n.id; });
            if (unreadIds.length) {
                await sb.from('notifications').update({ is_read: true }).in('id', unreadIds);
                try { await renderNavBell(); } catch (e) {}
            }
            document.getElementById('notify-dot').style.display = 'none';
        } catch (e) {
            wrap.innerHTML = '<p class="works-note">加载失败：' + esc(e.message) + '</p>';
        }
    }
    /* 通知 tab 红点：有未读就亮 */
    (async function () {
        try {
            var me = await currentUser();
            if (!me) return;
            var c = await sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', me.id).eq('is_read', false);
            if (c.count > 0) document.getElementById('notify-dot').style.display = 'inline';
        } catch (e) {}
    })();
    (function () {
        var tabs = document.querySelectorAll('#feed-tabs [data-ftab]');
        var notifyLoaded = false;
        function showTab(t) {
            tabs.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-ftab') === t); });
            document.getElementById('ftab-feed').style.display = t === 'feed' ? '' : 'none';
            document.getElementById('ftab-notify').style.display = t === 'notify' ? '' : 'none';
            if (t === 'notify' && !notifyLoaded) { notifyLoaded = true; loadNotify(); }
            try { history.replaceState(null, '', location.pathname + '#' + t); } catch (e) {}
        }
        tabs.forEach(function (b) { b.addEventListener('click', function () { showTab(b.getAttribute('data-ftab')); }); });
        document.addEventListener('DOMContentLoaded', function () {
            if (location.hash === '#notify') showTab('notify');
        });
    })();
    </script>
</body>
</html>
