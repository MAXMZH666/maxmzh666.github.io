    <script>
    var CATS = [
        { name: '游戏', icon: '🎮' }, { name: '动画', icon: '🎬' }, { name: '工具', icon: '🛠️' },
        { name: '音乐', icon: '🎵' }, { name: '其他', icon: '📦' }
    ];
    var TYPES = [
        { v: 'scratch', label: 'Scratch', icon: '🎮' }, { v: 'python', label: 'Python', icon: '🐍' },
        { v: 'cpp', label: 'C++', icon: '⚙️' }, { v: 'apk', label: 'APK', icon: '📱' },
        { v: 'windows', label: 'Windows', icon: '🪟' }, { v: 'linux', label: 'Linux', icon: '🐧' },
        { v: 'website', label: '网站', icon: '🌐' }
    ];
    var nameMap = {}, avatarMap = {};

    async function loadProfiles(ids) {
        try {
            var uniq = Array.from(new Set(ids));
            if (!uniq.length) return;
            var pr = await sb.from('profiles').select('id,username,avatar_url').in('id', uniq);
            (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; avatarMap[p.id] = p.avatar_url; });
        } catch (e) {}
    }

    /* 随机逛逛 */
    var randomPool = [];
    async function randomWork() {
        var box = document.getElementById('random-work');
        try {
            if (!randomPool.length) {
                var r = await sb.from('works').select('id,title,cover_url,author_id,category,work_type').limit(100);
                randomPool = r.data || [];
                await loadProfiles(randomPool.map(function (w) { return w.author_id; }));
            }
            if (!randomPool.length) { box.innerHTML = '<p class="works-note">还没有作品。</p>'; return; }
            var w = randomPool[Math.floor(Math.random() * randomPool.length)];
            var cover = w.cover_url
                ? '<img src="' + esc(w.cover_url) + '" alt="" style="max-width:220px;border-radius:10px;margin-bottom:10px">'
                : '';
            box.innerHTML = cover +
                '<h3 style="margin:0 0 6px"><a href="community-play.html?id=' + w.id + '">' + esc(w.title) + '</a></h3>' +
                '<p class="works-note" style="margin:0">' + esc(nameMap[w.author_id] || '未知') +
                (w.category ? ' · ' + esc(w.category) : '') + '</p>';
        } catch (e) { box.innerHTML = '<p class="works-note">加载失败</p>'; }
    }

    (async function () {
        await renderSubHeader();
        var sb = window.sb;
        document.getElementById('random-btn').addEventListener('click', randomWork);
        randomWork();

        /* 分类计数 */
        try {
            var cr = await sb.from('works').select('category');
            var cc = {};
            (cr.data || []).forEach(function (w) { if (w.category) cc[w.category] = (cc[w.category] || 0) + 1; });
            document.getElementById('cat-grid').innerHTML = CATS.map(function (c) {
                return '<a class="cat-card" href="community.html?cat=' + encodeURIComponent(c.name) + '">' +
                    '<span class="cc-icon">' + c.icon + '</span><div class="cc-name">' + c.name + '</div>' +
                    '<div class="cc-count">' + (cc[c.name] || 0) + ' 个作品</div></a>';
            }).join('');
        } catch (e) {
            document.getElementById('cat-grid').innerHTML = '<p class="works-note">加载失败</p>';
        }

        /* 类型计数 */
        try {
            var tr = await sb.from('works').select('work_type');
            var tc = {};
            (tr.data || []).forEach(function (w) { if (w.work_type) tc[w.work_type] = (tc[w.work_type] || 0) + 1; });
            document.getElementById('type-grid').innerHTML = TYPES.map(function (t) {
                return '<a class="cat-card" href="community.html?type=' + t.v + '">' +
                    '<span class="cc-icon">' + t.icon + '</span><div class="cc-name">' + t.label + '</div>' +
                    '<div class="cc-count">' + (tc[t.v] || 0) + ' 个作品</div></a>';
            }).join('');
        } catch (e) {
            document.getElementById('type-grid').innerHTML = '<p class="works-note">加载失败</p>';
        }

        /* 值得关注的作者：粉丝数 Top6 */
        try {
            var fr = await sb.from('follows').select('following_id');
            var fc = {};
            (fr.data || []).forEach(function (f) { fc[f.following_id] = (fc[f.following_id] || 0) + 1; });
            var top = Object.keys(fc).sort(function (a, b) { return fc[b] - fc[a]; }).slice(0, 6);
            /* 粉丝不足时用作品数多的作者补足 */
            if (top.length < 6) {
                var wr = await sb.from('works').select('author_id').limit(100);
                var wc = {};
                (wr.data || []).forEach(function (w) { wc[w.author_id] = (wc[w.author_id] || 0) + 1; });
                Object.keys(wc).sort(function (a, b) { return wc[b] - wc[a]; }).forEach(function (id) {
                    if (top.length < 6 && top.indexOf(id) < 0) top.push(id);
                });
            }
            await loadProfiles(top);
            var me = await currentUser();
            document.getElementById('author-grid').innerHTML = top.length ? top.map(function (id) {
                var av = avatarMap[id]
                    ? '<img src="' + esc(avatarMap[id]) + '" alt="">'
                    : '<span class="ac-mono">' + esc((nameMap[id] || '?').charAt(0)) + '</span>';
                return '<a class="author-card" href="community-user.html?id=' + id + '">' + av +
                    '<div class="ac-name">' + esc(nameMap[id] || '未知') + '</div>' +
                    '<div class="ac-meta">❤ ' + (fc[id] || 0) + ' 粉丝</div></a>';
            }).join('') : '<p class="works-note">还没有作者数据。</p>';
        } catch (e) {
            document.getElementById('author-grid').innerHTML = '<p class="works-note">加载失败</p>';
        }
    })();
    </script>
