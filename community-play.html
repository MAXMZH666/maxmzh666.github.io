    <script>
    function runnerHtml() {
        return '<div class="runner">' +
            '<div class="runner-bar"><button class="btn btn-blue" id="run-btn" type="button">▶ 运行</button>' +
            '<button class="btn btn-ghost" id="clear-btn" type="button">清空输出</button>' +
            '<span class="run-status" id="run-status"></span></div>' +
            '<label for="run-input">程序输入 <span class="form-hint">（代码里有 input()/cin 时，在这里按行填写）</span></label>' +
            '<textarea id="run-input" class="code-input" rows="3" spellcheck="false" placeholder="例如：\n42\nhello"></textarea>' +
            '<label>输出</label>' +
            '<pre id="run-output" class="console">点击"运行"开始…</pre>' +
            '<p class="form-hint">⚠️ 只支持控制台程序（print/input、cout/cin）；图形库暂不支持。请确认代码没有死循环，否则页面会卡住。</p>' +
            '</div>';
    }

    function bindRunner(kind, code, lazyLoader) {
        var out = document.getElementById('run-output');
        var status = document.getElementById('run-status');
        var runBtn = document.getElementById('run-btn');
        function say(t) { status.textContent = t; }
        function append(s) { out.textContent += s; out.scrollTop = out.scrollHeight; }
        document.getElementById('clear-btn').addEventListener('click', function () { out.textContent = ''; });
        runBtn.addEventListener('click', async function () {
            runBtn.disabled = true;
            out.textContent = '';
            try {
                /* 懒加载：code 为 null 时通过 lazyLoader 按需取码 */
                var src = code;
                if (src == null && lazyLoader) {
                    say('正在加载代码…');
                    src = await new Promise(function (resolve) { lazyLoader(resolve); });
                }
                if (!src) { append('[错误] 无法加载代码'); say('加载失败'); runBtn.disabled = false; return; }
                var inputText = document.getElementById('run-input').value;
                if (kind === 'python') await runPython(src, inputText, say, append);
                else await runCpp(src, inputText, say, append);
            } catch (e) {
                append('[错误] ' + (e && e.message ? e.message : e));
                say('运行出错');
            }
            runBtn.disabled = false;
        });
    }

    /* Markdown 渲染（简介） */
    function renderMarkdown(md) {
        try {
            if (window.marked && window.DOMPurify) {
                return DOMPurify.sanitize(marked.parse(String(md || '')));
            }
        } catch (e) {}
        return esc(String(md || ''));
    }

    (async function () {
        await renderSubHeader();
        var wrap = document.getElementById('play-wrap');
        var id = new URLSearchParams(location.search).get('id');
        if (!id) { wrap.innerHTML = '<p class="works-note">缺少作品 ID。<a href="community.html">返回社区</a></p>'; return; }

        /* 公开查询不拉源码列（code），防闭源代码从接口泄露；授权用户走 get_work_code RPC 取 */
        var res = await sb.from('works').select('id,title,author_id,cover_url,sb3_url,is_open_source,description,created_at,apk_url,views,site_url,screenshots,work_type,category').eq('id', id).single();
        if (res.error || !res.data) {
            wrap.innerHTML = '<p class="works-note">作品不存在或已被删除。<a href="community.html">返回社区</a></p>';
            return;
        }
        var w = res.data;
        var wtype = workTypeOf(w);
        var authorName = '未知';
        try {
            var pr = await sb.from('profiles').select('username').eq('id', w.author_id).single();
            if (pr.data && pr.data.username) authorName = pr.data.username;
        } catch (e) {}
        document.title = w.title + ' - MAXMZH 社区';
        /* 浏览量 +1（每天每作品只计一次） */
        (function () {
            var key = 'viewed_' + id, today = new Date().toDateString(), last = null;
            try { last = localStorage.getItem(key); } catch (e) {}
            if (last !== today) {
                sb.rpc('increment_views', { wid: id }).then(function () {
                    var vc = document.getElementById('view-count');
                    if (vc) vc.textContent = (parseInt(vc.textContent, 10) || 0) + 1;
                }).catch(function () {});
                try { localStorage.setItem(key, today); } catch (e) {}
            }
        })();
        var me = await currentUser();
        var isAuthor = me && me.id === w.author_id;
        if (me) { try { await isAdmin(); } catch (e) {} }

        /* ---- 按类型渲染预览区 ---- */
        var previewHtml = '';
        if (wtype === 'scratch') {
            /* sb3 走代理播放：点击时取 token，不暴露文件直链 */
            var coverImg = w.cover_url ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">' : '<span class="monogram">🎮</span>';
            previewHtml = '<div class="player-wrap player-lazy" data-work-id="' + esc(id) + '" data-title="' + esc(w.title) + '">' +
                '<div class="player-cover">' + coverImg +
                '<button class="btn btn-blue btn-lg" id="player-start">▶ 点击试玩</button></div></div>' +
                ((w.is_open_source || isAuthor || (me && isAdminFlag)) && w.sb3_url
                    ? '<p style="margin-top:8px"><a class="btn btn-ghost btn-sm" href="#" id="dl-sb3">⬇ 下载源码 .sb3</a></p>'
                    : '') +
                (isAuthor && wtype === 'scratch' ? '<p class="form-hint" style="margin-top:10px">💻 <a href="community-code.html?edit=' + id + '">在在线编程里继续编辑这个作品</a></p>' : '');
        } else if (wtype === 'python' || wtype === 'cpp') {
            var canSeeCode = w.is_open_source || isAuthor || (me && isAdminFlag);
            /* 授权用户通过 RPC 取源码，未授权不请求 */
            var codeText = '';
            if (canSeeCode) {
                try {
                    var cr = await sb.rpc('get_work_code', { p_work_id: id });
                    if (cr.data && cr.data.code) codeText = cr.data.code;
                } catch (e) {}
            }
            previewHtml = (canSeeCode
                ? '<pre class="code-view"><code id="code-block" class="' + (wtype === 'python' ? 'language-python' : 'language-cpp') + '">' +
                  esc(codeText) + '</code></pre>'
                : '<div class="tip-box">🔒 作者未开源此作品，你可以在线运行，但无法查看源代码。</div>') + runnerHtml();
        } else if (wtype === 'website') {
            var siteSrc = w.site_url || '';
            previewHtml = '<div class="apk-card">' +
                '<div class="apk-head">🌐 <b>网站作品</b></div>' +
                (siteSrc
                    ? '<div class="player-wrap site-frame"><iframe src="' + esc(siteSrc) + '" sandbox="allow-scripts allow-same-origin allow-forms" loading="lazy" title="' + esc(w.title) + '"></iframe></div>' +
                      '<p style="margin-top:10px"><a class="btn btn-blue" href="' + esc(siteSrc) + '" target="_blank" rel="noopener">🔗 新窗口打开网站</a></p>'
                    : '<p class="works-note">暂无网站地址</p>') +
                '<p class="form-hint">站内为沙箱预览；部分网站禁止被嵌套时请点上面的按钮新窗口打开。</p></div>';
        } else if (wtype === 'apk' || wtype === 'windows' || wtype === 'linux') {
            var shots = w.screenshots || [];
            var shotHtml = '';
            if (shots.length) {
                shotHtml = '<div class="shots">' + shots.map(function (u) {
                    return '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" loading="lazy" alt="应用截图"></a>';
                }).join('') + '</div>';
            } else if (w.cover_url) {
                shotHtml = '<div class="shots"><img src="' + esc(w.cover_url) + '" alt="封面"></div>';
            }
            var fileName = 'app.bin';
            try { fileName = decodeURIComponent(String(w.apk_url).split('/').pop().split('?')[0]) || fileName; } catch (e) {}
            var binMeta = {
                apk: { icon: '📱', title: 'Android 安装包', dl: '下载 APK',
                       steps: ['在安卓手机上点击上面的下载按钮', '下载完成后点击文件，允许"安装未知来源应用"', '按提示完成安装，即可打开使用'],
                       note: 'APK 无法在网页直接运行，请下载到安卓手机安装。' },
                windows: { icon: '🪟', title: 'Windows 应用程序', dl: '下载 Windows 版',
                       steps: ['在 Windows 电脑上点击上面的下载按钮', '如果是 .zip 压缩包，先解压；双击 .exe / .msi 运行', '如弹出"未知发布者"警告，选择"仍要运行"'],
                       note: 'Windows 程序无法在网页直接运行，请下载到电脑使用。文件由作者上传，运行前请自行判断。' },
                linux: { icon: '🐧', title: 'Linux 应用程序', dl: '下载 Linux 版',
                       steps: ['在 Linux 电脑上点击上面的下载按钮', 'AppImage：右键属性 → 允许作为程序执行（或 chmod +x），双击运行', '.deb：双击用软件中心安装；.zip/.tar.gz：解压后按说明运行'],
                       note: 'Linux 程序无法在网页直接运行，请下载到电脑使用。文件由作者上传，运行前请自行判断。' }
            }[wtype];
            previewHtml = '<div class="apk-card">' +
                '<div class="apk-head">' + binMeta.icon + ' <b>' + binMeta.title + '</b></div>' +
                shotHtml +
                '<p class="work-meta">文件：' + esc(fileName) + ' · 发布于 ' + fmtDate(w.created_at) + '</p>' +
                '<a class="btn btn-blue" href="' + esc(w.apk_url) + '" download>⬇ ' + binMeta.dl + '</a>' +
                '<h3>安装步骤</h3><ol class="apk-steps">' +
                binMeta.steps.map(function (st) { return '<li>' + st + '</li>'; }).join('') + '</ol>' +
                '<p class="form-hint">' + binMeta.note + '</p></div>';
        }

        wrap.innerHTML =
            '<p class="article-back"><a href="community.html">← 返回社区</a></p>' +
            '<div class="play-layout">' +
            '<div class="play-main">' + previewHtml + '</div>' +
            '<div class="play-side">' +
            '<h1 class="section-title" style="margin-top:0">' + esc(w.title) + '</h1>' +
            '<p class="work-meta">' + typeBadge(wtype) +
            ' 作者：<a href="community-user.html?id=' + w.author_id + '">' + esc(authorName) + '</a>' +
            ' · ' + fmtDate(w.created_at) + ' · 👁 <span id="view-count">' + (w.views || 0) + '</span></p>' +
            '<div class="card-tags" id="work-tags" style="margin:8px 0"></div>' +
            (w.description ? '<div class="work-desc markdown-body">' + renderMarkdown(w.description) + '</div>' : '') +
            '<div class="work-actions">' +
                '<button class="like-btn" id="like-btn">❤ <span id="like-count">…</span></button>' +
                '<button class="fav-btn" id="fav-btn">⭐ <span id="fav-text">收藏</span> <span id="fav-count"></span></button>' +
                '<button class="fav-btn" id="addcol-btn">➕ 加入合集</button>' +
                '<button class="share-btn" id="share-btn">🔗 分享</button>' +
                (!isAuthor ? '<button class="follow-btn" id="follow-btn">＋ 关注作者</button>' : '') +
                (isAuthor
                    ? '<a href="community-publish.html?edit=' + id + '">编辑作品</a><a href="#" class="link-danger" id="del-work">删除作品</a>'
                    : '<a href="#" class="link-danger" id="report-work">举报</a>') +
            '</div>' +
            '<div id="work-contests"></div>' +
            '</div></div>' +
            '<div class="comments"><h2>评论</h2><div id="comment-list"><p class="works-note">加载中…</p></div>' +
            '<form id="comment-form" class="comment-form contact-form" style="max-width:none">' +
                '<label for="c-text">写评论</label>' +
                '<textarea id="c-text" maxlength="500" placeholder="' + (me ? '友善评论，理性交流（支持 Markdown）' : '登录后发表评论') + '"></textarea>' +
                '<p class="form-hint">📝 支持 Markdown <a href="javascript:void(0)" onclick="mdHelp()">语法说明</a></p>' +
                '<p class="form-note" id="c-note"></p>' +
                '<p>' + (me ? redPacketButton('comment', id) : '') + ' ' +
                '<button type="submit">' + (me ? '发表评论' : '登录后评论') + '</button></p>' +
            '</form></div>' +
            '<div class="versions" id="versions-wrap" style="display:none"><h2>版本历史</h2>' +
            '<div id="version-list"></div>' +
            '<p class="form-hint">每次编辑都会自动保存一个历史版本；回溯前也会先保存当前版本，不会丢数据。</p></div>' +
            '<div class="more-works"><h2>更多作品</h2><div id="more-list"><p class="works-note">加载中…</p></div></div>' +
            '<div class="modal-backdrop" id="addcol-modal" style="display:none">' +
            '<div class="modal" style="max-width:420px"><h3>➕ 加入合集</h3>' +
            '<div id="addcol-list"><p class="works-note">加载中…</p></div>' +
            '<p class="form-hint">没有合集？<a href="community-collections.html">去创建一个 →</a></p>' +
            '<div class="modal-actions"><button class="btn" id="addcol-cancel" type="button">关闭</button></div></div></div>';

        /* 🏷️ 加载作品标签 */
        (async function () {
            try {
                var tags = await getWorkTags(id);
                var box = document.getElementById('work-tags');
                if (box) box.innerHTML = tags.length ? tagChips(tags) : '';
            } catch (e) {}
        })();

        /* 🏁 参与的赛事 */
        (async function () {
            try {
                var er = await sb.from('contest_entries').select('contest_id').eq('work_id', id);
                var cids = (er.data || []).map(function (x) { return x.contest_id; });
                if (!cids.length) return;
                var cr = await sb.from('contests').select('id,title,submit_end,vote_end,settled').in('id', cids);
                var list = cr.data || [];
                if (!list.length) return;
                var now = Date.now();
                var box = document.getElementById('work-contests');
                box.innerHTML = '<div class="work-contests"><h3>🏁 参与的赛事</h3>' + list.map(function (c) {
                    var end = Math.max(new Date(c.submit_end).getTime(), new Date(c.vote_end).getTime());
                    var live = !c.settled && now < end;
                    return '<a class="contest-link" href="community-contest.html?id=' + c.id + '">' +
                        '<span class="c-status' + (live ? ' live' : '') + '">' + (live ? '进行中' : '已结束') + '</span>' +
                        esc(c.title) + '</a>';
                }).join('') + '</div>';
            } catch (e) {}
        })();

        /* 代码高亮（python/cpp）：codeText 来自授权 RPC，未授权时为空 */
        if (wtype === 'python' || wtype === 'cpp') {
            if (typeof codeText !== 'undefined' && codeText) {
                injectHljsTheme();
                try {
                    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js');
                    if (window.hljs) hljs.highlightElement(document.getElementById('code-block'));
                } catch (e) {}
            }
            /* 运行器：点击运行时才通过 RPC 取代码，不预载 */
            bindRunner(wtype, null, function (cb) {
                sb.rpc('get_work_code', { p_work_id: id }).then(function (r) {
                    cb(r.data && r.data.code ? r.data.code : '');
                }).catch(function () { cb(''); });
            });
        }

        /* 点赞 */
        var likeBtn = document.getElementById('like-btn');
        var likeCount = document.getElementById('like-count');
        var liked = false;
        async function refreshLikes() {
            var r = await sb.from('likes').select('work_id').eq('work_id', id);
            var n = (r.data || []).length;
            likeCount.textContent = n;
            likeBtn.classList.toggle('liked', liked);
        }
        if (me) {
            var lr = await sb.from('likes').select('work_id').eq('work_id', id).eq('user_id', me.id).maybeSingle();
            liked = !!lr.data;
        }
        await refreshLikes();
        likeBtn.addEventListener('click', async function () {
            if (!me) { authRequiredRedirect(); return; }
            likeBtn.disabled = true;
            try {
                if (liked) {
                    await sb.from('likes').delete().eq('work_id', id).eq('user_id', me.id);
                    liked = false;
                } else {
                    var ir = await sb.from('likes').insert({ work_id: id, user_id: me.id });
                    if (ir.error) throw ir.error;
                    liked = true;
                    try { await recordTaskProgress('like_work', 1); } catch (e) {}
                }
            } catch (e) { alert('操作失败：' + e.message); }
            likeBtn.disabled = false;
            await refreshLikes();
        });

        /* 收藏 */
        /* 分享：移动端调系统分享面板，桌面端复制链接 */
        document.getElementById('share-btn').addEventListener('click', async function () {
            var shareData = {
                title: w.title + ' - MAX社区',
                text: '我在 MAX社区发现了《' + w.title + '》，来玩玩看！',
                url: location.href
            };
            function copied(btn) {
                btn.textContent = '✅ 链接已复制';
                setTimeout(function () { btn.textContent = '🔗 分享'; }, 2000);
            }
            var btn = this;
            if (navigator.share) {
                try { await navigator.share(shareData); } catch (e) {}
            } else {
                var done = false;
                try {
                    await navigator.clipboard.writeText(location.href);
                    done = true;
                } catch (e) {}
                if (!done) {
                    /* 兼容旧浏览器：隐藏 textarea + execCommand */
                    try {
                        var ta = document.createElement('textarea');
                        ta.value = location.href;
                        ta.style.cssText = 'position:fixed;opacity:0;';
                        document.body.appendChild(ta);
                        ta.select();
                        done = document.execCommand('copy');
                        ta.remove();
                    } catch (e) {}
                }
                if (done) copied(btn);
                else prompt('复制下面的链接分享给朋友：', location.href);
            }
        });
        /* 播放器点击加载：scratch 走代理取 token */
        (function () {
            var lazy = document.querySelector('.player-lazy');
            if (!lazy) return;
            function loadPlayer(src) {
                lazy.innerHTML = '<iframe src="' + src + '" allowtransparency="true" scrolling="no" allowfullscreen title="' + esc(w.title) + '"></iframe>';
                lazy.classList.remove('player-lazy');
            }
            document.getElementById('player-start').addEventListener('click', async function () {
                var btn = this;
                btn.disabled = true;
                btn.textContent = '加载中…';
                try {
                    if (wtype === 'scratch') {
                        /* 取播放 token，走代理 */
                        var tk = await sb3PlayToken(id);
                        if (!tk) throw new Error('获取播放凭证失败，请先登录');
                        var proxyUrl = sb3ProxyUrl(id, tk);
                        var embedUrl = 'https://turbowarp.org/embed?project_url=' + encodeURIComponent(proxyUrl) +
                            '&project_title=' + encodeURIComponent(lazy.getAttribute('data-title') || w.title) + '&autoplay';
                        loadPlayer(embedUrl);
                    } else {
                        loadPlayer(lazy.getAttribute('data-embed'));
                    }
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = '▶ 点击试玩';
                    alert('加载失败：' + (e.message || e));
                }
            });
            /* 下载按钮：走代理（带 token） */
            var dlBtn = document.getElementById('dl-sb3');
            if (dlBtn) {
                dlBtn.addEventListener('click', async function (e) {
                    e.preventDefault();
                    var tk = await sb3PlayToken(id);
                    if (!tk) { alert('获取下载凭证失败，请先登录'); return; }
                    var a = document.createElement('a');
                    a.href = sb3ProxyUrl(id, tk);
                    a.download = (w.title || 'project') + '.sb3';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
            }
            /* 历史版本试玩：若还没点"试玩"，先加载再换版本 */
            lazy._loadVersion = function (src) { loadPlayer(src); };
        })();
        /* 加入合集 */
        var addColBtn = document.getElementById('addcol-btn');
        var addColModal = document.getElementById('addcol-modal');
        async function loadMyCols() {
            var box = document.getElementById('addcol-list');
            try {
                var r = await sb.from('collections').select('id,title').eq('owner_id', me.id).order('created_at', { ascending: false });
                var cols = r.data || [];
                if (!cols.length) { box.innerHTML = '<p class="works-note">还没有合集，先创建一个吧。</p>'; return; }
                var cr = await sb.from('collection_works').select('collection_id').eq('work_id', id);
                var inSet = {};
                (cr.data || []).forEach(function (x) { inSet[x.collection_id] = 1; });
                box.innerHTML = cols.map(function (c) {
                    return '<div class="stat-row"><div class="sr-title">' + esc(c.title) + '</div>' +
                        (inSet[c.id]
                            ? '<span class="form-hint">已在合集中</span>'
                            : '<button class="btn btn-blue btn-sm" data-addcol="' + c.id + '">加入</button>') + '</div>';
                }).join('');
                box.querySelectorAll('[data-addcol]').forEach(function (b) {
                    b.addEventListener('click', async function () {
                        b.disabled = true;
                        try {
                            var pr = await sb.from('collection_works').select('collection_id').eq('collection_id', b.getAttribute('data-addcol'));
                            var pos = (pr.data || []).length;
                            var ir = await withTimeout(sb.from('collection_works').insert({
                                collection_id: b.getAttribute('data-addcol'), work_id: id, position: pos
                            }), 15000, '加入超时');
                            if (ir.error) throw ir.error;
                            b.outerHTML = '<span class="form-hint">已加入 ✓</span>';
                        } catch (e) {
                            b.disabled = false;
                            alert('加入失败：' + (e.message || ''));
                        }
                    });
                });
            } catch (e) { box.innerHTML = '<p class="works-note">加载失败：' + esc(e.message || '') + '</p>'; }
        }
        addColBtn.addEventListener('click', async function () {
            if (!me) { authRequiredRedirect(); return; }
            addColModal.style.display = 'flex';
            await loadMyCols();
        });
        document.getElementById('addcol-cancel').addEventListener('click', function () { addColModal.style.display = 'none'; });
        addColModal.addEventListener('click', function (e) { if (e.target === addColModal) addColModal.style.display = 'none'; });
        var favBtn = document.getElementById('fav-btn');
        var favText = document.getElementById('fav-text');
        var favCountEl = document.getElementById('fav-count');
        var faved = false;
        var favCount = 0;
        async function refreshFav() {
            favText.textContent = faved ? '已收藏' : '收藏';
            favCountEl.textContent = favCount > 0 ? favCount : '';
            favBtn.classList.toggle('faved', faved);
        }
        try {
            var fc = await sb.from('favorites').select('id', { count: 'exact', head: true }).eq('work_id', id);
            favCount = fc.count || 0;
        } catch (e) {}
        if (me) {
            var fr0 = await sb.from('favorites').select('work_id')
                .eq('work_id', id).eq('user_id', me.id).maybeSingle();
            faved = !!fr0.data;
        }
        await refreshFav();
        favBtn.addEventListener('click', async function () {
            if (!me) { authRequiredRedirect(); return; }
            favBtn.disabled = true;
            try {
                if (faved) {
                    await sb.from('favorites').delete().eq('work_id', id).eq('user_id', me.id);
                    faved = false; favCount = Math.max(0, favCount - 1);
                } else {
                    var fir = await sb.from('favorites').insert({ work_id: id, user_id: me.id });
                    if (fir.error) throw fir.error;
                    faved = true; favCount++;
                }
            } catch (e) { alert('操作失败：' + e.message); }
            favBtn.disabled = false;
            await refreshFav();
        });

        /* 关注作者 */
        var followBtn = document.getElementById('follow-btn');
        if (followBtn) {
            var following = false;
            if (me) {
                var fr = await sb.from('follows').select('follower_id')
                    .eq('follower_id', me.id).eq('following_id', w.author_id).maybeSingle();
                following = !!fr.data;
            }
            var paintFollow = function () {
                followBtn.textContent = following ? '已关注' : '＋ 关注作者';
                followBtn.classList.toggle('following', following);
            };
            paintFollow();
            followBtn.addEventListener('click', async function () {
                if (!me) { authRequiredRedirect(); return; }
                try {
                    if (following) {
                        await sb.from('follows').delete().eq('follower_id', me.id).eq('following_id', w.author_id);
                        following = false;
                    } else {
                        var ir = await sb.from('follows').insert({ follower_id: me.id, following_id: w.author_id });
                        if (ir.error) throw ir.error;
                        following = true;
                        try { await recordTaskProgress('follow_user', 1); } catch (e) {}
                    }
                } catch (e) { alert('操作失败：' + e.message); }
                paintFollow();
            });
        }

        /* 举报作品（自定义弹窗，不用原生 prompt） */
        var reportBtn = document.getElementById('report-work');
        if (reportBtn) {
            var modalHtml =
                '<div class="modal-backdrop" id="report-modal" style="display:none">' +
                '<div class="modal"><h3>举报作品</h3>' +
                '<p class="form-hint">请填写举报原因，站长会尽快处理。</p>' +
                '<textarea id="report-reason" maxlength="200" placeholder="如：抄袭、色情、广告等"></textarea>' +
                '<p class="form-note" id="report-note"></p>' +
                '<div class="modal-actions"><button class="btn" id="report-cancel" type="button">取消</button>' +
                '<button class="btn btn-blue" id="report-submit" type="button">提交举报</button></div></div></div>';
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            var modal = document.getElementById('report-modal');
            reportBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!me) { authRequiredRedirect(); return; }
                document.getElementById('report-reason').value = '';
                document.getElementById('report-note').textContent = '';
                modal.style.display = 'flex';
            });
            document.getElementById('report-cancel').addEventListener('click', function () {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', function (e) {
                if (e.target === modal) modal.style.display = 'none';
            });
            document.getElementById('report-submit').addEventListener('click', async function () {
                var reason = document.getElementById('report-reason').value.trim();
                var rnote = document.getElementById('report-note');
                if (!reason) { rnote.textContent = '请填写举报原因'; rnote.className = 'form-note err'; return; }
                var r = await sb.from('reports').insert({
                    reporter_id: me.id, target_type: 'work', target_id: id, reason: reason
                });
                if (r.error) { rnote.textContent = '举报失败：' + r.error.message; rnote.className = 'form-note err'; return; }
                modal.style.display = 'none';
                alert('已收到举报，站长会尽快处理，感谢监督！');
            });
        }

        /* 删除作品（作者） */
        if (isAuthor) {
            document.getElementById('del-work').addEventListener('click', async function (e) {
                e.preventDefault();
                if (!confirm('确定删除这个作品吗？评论和点赞也会一起删除。')) return;
                var dr = await sb.from('works').delete().eq('id', id);
                if (dr.error) { alert('删除失败：' + dr.error.message); return; }
                location.href = 'community.html';
            });
        }

        /* 评论列表（含楼中楼回复） */
        var replyTo = null; /* {id, name} 正在回复的评论 */
        async function loadComments() {
            var list = document.getElementById('comment-list');
            var r = await sb.from('comments').select('id,content,created_at,author_id,parent_id')
                .eq('work_id', id).order('created_at', { ascending: true }).limit(200);
            if (r.error) { list.innerHTML = '<p class="works-note">评论加载失败</p>'; return; }
            var cs = r.data || [];
            var nameMap = {};
            try {
                var cids = Array.from(new Set(cs.map(function (c) { return c.author_id; })));
                if (cids.length) {
                    var pr = await sb.from('profiles').select('id,username').in('id', cids);
                    (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
                }
            } catch (e) {}
            /* 建树：最多2层缩进，第3层起平铺在第2层下 */
            var byId = {};
            cs.forEach(function (c) { c.children = []; byId[c.id] = c; });
            var roots = [];
            cs.forEach(function (c) {
                if (c.parent_id && byId[c.parent_id]) byId[c.parent_id].children.push(c);
                else roots.push(c);
            });
            var adminDel = await isAdmin();
            function renderOne(c, depth) {
                var canDel = (me && c.author_id === me.id) || adminDel;
                var cls = depth > 0 ? 'comment comment-reply' : 'comment';
                var h = '<div class="' + cls + '" data-cid="' + c.id + '"><div class="comment-meta">' +
                    esc(nameMap[c.author_id] || '未知') + ' · ' + fmtDate(c.created_at) +
                    (canDel ? ' <button class="remove-btn" data-del-comment="' + c.id + '">删除</button>' : '') +
                    (me ? ' <button class="reply-btn" data-reply-id="' + c.id + '" data-reply-name="' + esc(nameMap[c.author_id] || '未知') + '">回复</button>' : '') +
                    '</div><div class="comment-body">' + md(c.content) + '</div></div>';
                /* 子评论：depth+1，但视觉最多缩进1层 */
                (c.children || []).forEach(function (ch) { h += renderOne(ch, depth + 1); });
                return h;
            }
            list.innerHTML = roots.length ? roots.map(function (c) { return renderOne(c, 0); }).join('')
                : '<p class="works-note">还没有评论，来抢沙发！</p>';
            list.querySelectorAll('[data-del-comment]').forEach(function (b) {
                b.addEventListener('click', async function () {
                    if (!confirm('删除这条评论？子回复也会一起删除。')) return;
                    showLoading('删除中…');
                    try {
                        var r = await withTimeout(sb.from('comments').delete().eq('id', b.getAttribute('data-del-comment')), 15000, '删除超时');
                        if (r.error) throw r.error;
                    } catch (e) { alert('删除失败：' + (e.message || '')); }
                    hideLoading();
                    await loadComments();
                });
            });
            /* 回复按钮：设置回复目标 */
            list.querySelectorAll('[data-reply-id]').forEach(function (b) {
                b.addEventListener('click', function () {
                    if (!me) { authRequiredRedirect(); return; }
                    replyTo = { id: b.getAttribute('data-reply-id'), name: b.getAttribute('data-reply-name') };
                    var ta = document.getElementById('c-text');
                    ta.placeholder = '回复 @' + replyTo.name + '：';
                    ta.focus();
                    try { ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
                    var note = document.getElementById('c-note');
                    note.textContent = '正在回复 @' + replyTo.name + '（点击发表框外的取消可取消）';
                    note.className = 'form-note';
                });
            });
        }
        /* 🧧 积分红包 */
        injectRedPacketCSS();
        initRedPacketModal();
        /* 红包发送成功回调：在评论列表顶部插入红包卡片 */
        function onRedPacketSent(packetId) {
            renderRedPacket(packetId).then(function (html) {
                if (!html) return;
                var list = document.getElementById('comment-list');
                var wrap = document.createElement('div');
                wrap.innerHTML = html;
                list.insertBefore(wrap.firstChild, list.firstChild);
            });
        }
        bindRedPacketButtons(document, onRedPacketSent);
        bindRedPacketClaim(document);
        /* 加载该作品的红包，渲染在评论列表顶部 */
        async function loadRedPackets() {
            var list = document.getElementById('comment-list');
            if (!list) return;
            try {
                var r = await sb.from('red_packets').select('id')
                    .eq('context_type', 'comment').eq('context_id', id)
                    .order('created_at', { ascending: false }).limit(20);
                if (r.error || !r.data || !r.data.length) return;
                var ids = r.data.map(function (x) { return x.id; });
                var htmls = await Promise.all(ids.map(function (pid) { return renderRedPacket(pid); }));
                var html = htmls.filter(function (h) { return h; }).join('');
                if (html) {
                    var wrap = document.createElement('div');
                    wrap.innerHTML = html;
                    list.insertBefore(wrap, list.firstChild);
                }
            } catch (e) {}
        }
        await loadComments();
        await loadRedPackets();

        /* 版本历史（作者可回溯） */
        var versionData = {};
        async function loadVersions() {
            var wrapV = document.getElementById('versions-wrap');
            var list = document.getElementById('version-list');
            try {
                var r = await sb.from('work_versions').select('*')
                    .eq('work_id', id).order('version_no', { ascending: false }).limit(20);
                var vs = r.data || [];
                if (!vs.length) return;
                vs.forEach(function (v) { versionData[v.id] = v; });
                wrapV.style.display = 'block';
                list.innerHTML = vs.map(function (v) {
                    var t = WORK_TYPES[v.work_type] || WORK_TYPES.scratch;
                    return '<div class="version-row">' +
                        '<span class="version-no">v' + v.version_no + '</span>' +
                        '<span class="version-meta">' + t.icon + ' ' + esc(v.title || '') +
                        ' · ' + fmtDate(v.created_at) + '</span>' +
                        '<span class="version-btns">' +
                        '<button class="btn btn-ghost btn-sm" data-vp="' + v.id + '">预览</button>' +
                        (isAuthor ? '<button class="btn btn-ghost btn-sm" data-vr="' + v.id + '">回溯</button>' : '') +
                        '</span></div>' +
                        '<div class="version-preview" id="vp-' + v.id + '" style="display:none"></div>';
                }).join('');
            } catch (e) {}
        }
        document.getElementById('version-list').addEventListener('click', async function (e) {
            var pv = e.target.closest('button[data-vp]');
            var rb = e.target.closest('button[data-vr]');
            if (pv) {
                var v = versionData[pv.getAttribute('data-vp')];
                if (!v) return;
                var box = document.getElementById('vp-' + v.id);
                if (box.style.display !== 'none') { box.style.display = 'none'; return; }
                var t = workTypeOf(v), ph = '';
                if (t === 'python' || t === 'cpp') {
                    ph = (w.is_open_source || isAuthor || (me && isAdminFlag))
                        ? '<pre class="code-view"><code>' + esc(v.code || '') + '</code></pre>'
                        : '<p class="form-hint">🔒 作者未开源，无法查看此版本源码</p>';
                } else if (t === 'scratch' && v.sb3_url) {
                    ph = '<button class="btn btn-blue btn-sm" data-vplay="' + v.id + '">在播放器中试玩此版本</button> ';
                } else if ((t === 'apk' || t === 'windows' || t === 'linux') && v.apk_url) {
                    ph = '<a class="btn btn-blue btn-sm" href="' + esc(v.apk_url) + '" download>下载此版本安装包</a> ';
                } else if (t === 'website' && v.site_url) {
                    ph = '<a class="btn btn-blue btn-sm" href="' + esc(v.site_url) + '" target="_blank" rel="noopener">打开此版本网站</a> ';
                }
                if (!ph) ph = '<p class="form-hint">该版本无可预览内容</p>';
                box.innerHTML = ph;
                box.style.display = 'block';
                return;
            }
            var vplay = e.target.closest('button[data-vplay]');
            if (vplay) {
                var vv = versionData[vplay.getAttribute('data-vplay')];
                if (vv && vv.sb3_url) {
                    var newSrc = 'https://turbowarp.org/embed?project_url=' + encodeURIComponent(vv.sb3_url) +
                        '&project_title=' + encodeURIComponent(vv.title || w.title);
                    var frame = document.querySelector('.player-wrap iframe');
                    var lazy = document.querySelector('.player-lazy');
                    if (frame) { frame.src = newSrc; }
                    else if (lazy && lazy._loadVersion) { lazy._loadVersion(esc(newSrc)); }
                    alert('已载入 v' + vv.version_no + ' 试玩，刷新页面回到最新版。');
                }
                return;
            }
            if (rb) {
                var rv = versionData[rb.getAttribute('data-vr')];
                if (!rv || !me) return;
                if (!confirm('回溯到 v' + rv.version_no + '（' + (rv.title || '') + '）？\n当前版本会自动存为新的历史版本，不会丢失。')) return;
                rb.disabled = true;
                try {
                    var curR = await sb.from('works').select('*').eq('id', id).single();
                    if (curR.error || !curR.data) throw new Error('读取当前版本失败');
                    var cur = curR.data;
                    var mxR = await sb.from('work_versions').select('version_no')
                        .eq('work_id', id).order('version_no', { ascending: false }).limit(1);
                    var nextNo = (mxR.data && mxR.data[0] ? mxR.data[0].version_no : 0) + 1;
                    var snap = await sb.from('work_versions').insert({
                        work_id: id, author_id: me.id, version_no: nextNo,
                        title: cur.title, description: cur.description, category: cur.category,
                        work_type: workTypeOf(cur), code: cur.code, sb3_url: cur.sb3_url,
                        apk_url: cur.apk_url, screenshots: cur.screenshots || [], cover_url: cur.cover_url,
                        site_url: cur.site_url || null
                    });
                    if (snap.error) throw snap.error;
                    var up = await sb.from('works').update({
                        title: rv.title, description: rv.description, category: rv.category,
                        work_type: rv.work_type, code: rv.code, sb3_url: rv.sb3_url,
                        apk_url: rv.apk_url, screenshots: rv.screenshots || [], cover_url: rv.cover_url,
                        site_url: rv.site_url || null
                    }).eq('id', id);
                    if (up.error) throw up.error;
                    alert('已回溯到 v' + rv.version_no + '，页面将刷新。');
                    location.reload();
                } catch (err) { alert('回溯失败：' + err.message); rb.disabled = false; }
            }
        });
        await loadVersions();

        /* 更多作品 */
        (async function loadMore() {
            var box = document.getElementById('more-list');
            try {
                var r = await sb.from('works').select('id,title,cover_url,work_type,author_id')
                    .neq('id', id).order('created_at', { ascending: false }).limit(10);
                var all = r.data || [];
                all.sort(function (a, b) {
                    return ((b.author_id === w.author_id) - (a.author_id === w.author_id));
                });
                var show = all.slice(0, 6);
                if (!show.length) { box.innerHTML = '<p class="works-note">还没有其他作品。</p>'; return; }
                box.innerHTML = show.map(function (m) {
                    var cover = m.cover_url
                        ? '<img src="' + esc(m.cover_url) + '" alt="" loading="lazy">'
                        : '<span class="monogram">' + esc((m.title || '游').charAt(0)) + '</span>';
                    return '<a class="rank-row" href="community-play.html?id=' + m.id + '">' +
                        '<span class="rank-thumb">' + cover + '</span>' +
                        '<span class="rank-info"><b>' + esc(m.title) + '</b>' +
                        '<span>' + typeBadge(workTypeOf(m)) + '</span></span></a>';
                }).join('');
            } catch (e) { box.innerHTML = '<p class="works-note">加载失败</p>'; }
        })();

        /* 发表评论（含回复楼中楼） */
        /* 取消回复：点击输入框旁的提示可取消 */
        document.getElementById('c-note').addEventListener('click', function () {
            if (replyTo) {
                replyTo = null;
                document.getElementById('c-text').placeholder = me ? '友善评论，理性交流（支持 Markdown）' : '登录后发表评论';
                this.textContent = '';
            }
        });
        document.getElementById('comment-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            if (!me) { authRequiredRedirect(); return; }
            var ta = document.getElementById('c-text');
            var note = document.getElementById('c-note');
            var text = ta.value.trim();
            if (!text) { note.textContent = '评论内容不能为空'; note.className = 'form-note err'; return; }
            /* 回复时自动 @ 被回复者（触发提及通知） */
            var pid = replyTo ? replyTo.id : null;
            if (replyTo && text.indexOf('@' + replyTo.name) === -1) text = '@' + replyTo.name + ' ' + text;
            note.textContent = '发表中…'; note.className = 'form-note sending';
            var payload = { work_id: id, author_id: me.id, content: text };
            if (pid) payload.parent_id = pid;
            var r = await sb.from('comments').insert(payload);
            try { await recordTaskProgress('comment', 1); } catch (e) {}
            if (r.error) { note.textContent = '发表失败：' + r.error.message; note.className = 'form-note err'; return; }
            ta.value = '';
            replyTo = null;
            ta.placeholder = '友善评论，理性交流（支持 Markdown）';
            note.textContent = '发表成功'; note.className = 'form-note ok';
            try { await sendMentions(text, me.id, id, 'work'); } catch (e) {}
            await loadComments();
        });
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
</body>
</html>
