    <script>
    (async function () {
        await renderSubHeader();
        var wrap = document.getElementById('admin-wrap');
        var me = await currentUser();
        if (!me) { location.href = 'community-auth.html?next=' + encodeURIComponent('community-admin.html'); return; }
        if (!await isAdmin()) {
            wrap.innerHTML = '<p class="works-note">无权限：只有管理员可以访问。<a href="community.html">返回社区</a></p>';
            return;
        }
        var tab = 'reports';
        async function loadReports() {
            var r = await sb.from('reports').select('*').order('created_at', { ascending: false }).limit(50);
            var rows = r.data || [];
            if (!rows.length) return '<p class="works-note">暂无举报。</p>';
            var workIds = rows.filter(function (x) { return x.target_type === 'work'; }).map(function (x) { return x.target_id; });
            var commentIds = rows.filter(function (x) { return x.target_type === 'comment'; }).map(function (x) { return x.target_id; });
            var reporterIds = rows.map(function (x) { return x.reporter_id; });
            var wmap = {}, cmap = {}, pmap = {};
            if (workIds.length) {
                var wr = await sb.from('works').select('id,title').in('id', workIds);
                (wr.data || []).forEach(function (w) { wmap[w.id] = w.title; });
            }
            if (commentIds.length) {
                var cr = await sb.from('comments').select('id,content,work_id').in('id', commentIds);
                (cr.data || []).forEach(function (c) { cmap[c.id] = c; });
            }
            if (reporterIds.length) {
                var pr = await sb.from('profiles').select('id,username').in('id', Array.from(new Set(reporterIds)));
                (pr.data || []).forEach(function (p) { pmap[p.id] = p.username; });
            }
            return rows.map(function (x) {
                var target = x.target_type === 'work'
                    ? '作品《' + esc(wmap[x.target_id] || '(已删除)') + '》'
                    : '评论"' + esc((cmap[x.target_id] || {}).content || '(已删除)') + '"';
                return '<div class="version-row">' +
                    '<span class="version-meta">👤 ' + esc(pmap[x.reporter_id] || '未知') +
                    ' 举报 ' + target + '<br>理由：' + esc(x.reason || '未填写') +
                    ' · ' + fmtDate(x.created_at) + '</span>' +
                    '<span class="version-btns">' +
                    (x.target_type === 'work'
                        ? '<button class="btn btn-ghost btn-sm" data-rdel-work="' + x.target_id + '" data-rid="' + x.id + '">删除作品</button>'
                        : '<button class="btn btn-ghost btn-sm" data-rdel-comment="' + x.target_id + '" data-rid="' + x.id + '">删除评论</button>') +
                    '<button class="btn btn-ghost btn-sm" data-rignore="' + x.id + '">忽略</button>' +
                    '</span></div>';
            }).join('');
        }
        async function loadWorks(q) {
            var query = sb.from('works').select('id,title,work_type,created_at,author_id').order('created_at', { ascending: false }).limit(50);
            if (q) query = query.ilike('title', '%' + q.replace(/[%_\\]/g, function (c) { return '\\' + c; }) + '%');
            var r = await query;
            var rows = r.data || [];
            if (!rows.length) return '<p class="works-note">没有作品。</p>';
            var amap = {};
            var ar = await sb.from('profiles').select('id,username').in('id', Array.from(new Set(rows.map(function (x) { return x.author_id; }))));
            (ar.data || []).forEach(function (p) { amap[p.id] = p.username; });
            return rows.map(function (w) {
                var t = WORK_TYPES[w.work_type] || WORK_TYPES.scratch;
                return '<div class="version-row">' +
                    '<span class="version-no">' + t.icon + '</span>' +
                    '<span class="version-meta"><a href="community-play.html?id=' + w.id + '">' + esc(w.title) + '</a><br>' +
                    '作者：' + esc(amap[w.author_id] || '未知') + ' · ' + fmtDate(w.created_at) + '</span>' +
                    '<span class="version-btns"><button class="btn btn-ghost btn-sm" data-adel-work="' + w.id + '">删除</button></span></div>';
            }).join('');
        }
        async function loadUsers() {
            var r = await sb.from('profiles').select('id,username,is_admin,created_at').order('created_at', { ascending: false }).limit(100);
            var rows = r.data || [];
            if (!rows.length) return '<p class="works-note">没有用户。</p>';
            return rows.map(function (u) {
                return '<div class="version-row">' +
                    '<span class="version-meta">👤 ' + esc(u.username) +
                    (u.is_admin ? ' <span class="tag gold">管理员</span>' : '') +
                    '<br>加入于 ' + fmtDate(u.created_at) + '</span>' +
                    '<span class="version-btns"><a class="btn btn-ghost btn-sm" href="community-user.html?id=' + u.id + '">查看</a></span></div>';
            }).join('');
        }
        /* ===== 公告管理 ===== */
        async function loadAnnounces() {
            var r = await sb.from('site_announcements').select('*').order('created_at', { ascending: false }).limit(50);
            if (r.error) return '<p class="works-note">公告表不存在，请先执行 supabase-maxrevamp9.sql</p>';
            var rows = r.data || [];
            var h = '<p><button class="btn btn-blue" id="announce-add">＋ 新增公告</button></p>';
            if (!rows.length) return h + '<p class="works-note">暂无公告。</p>';
            return h + rows.map(function (a) {
                return '<div class="version-row">' +
                    '<span class="version-meta">' + (a.is_active ? '🟢' : '⚪') + ' <b>' + esc(a.title) + '</b>' +
                    (a.content ? '<br>' + esc(a.content).slice(0, 80) : '') +
                    '<br><span class="works-note">' + fmtDate(a.created_at) + (a.link_url ? ' · 链接：' + esc(a.link_url) : '') + '</span></span>' +
                    '<span class="version-btns">' +
                    '<button class="btn btn-ghost btn-sm" data-aedit="' + a.id + '">编辑</button> ' +
                    '<button class="btn btn-ghost btn-sm" data-atoggle="' + a.id + '" data-active="' + (a.is_active ? '1' : '0') + '">' + (a.is_active ? '停用' : '启用') + '</button> ' +
                    '<button class="btn btn-ghost btn-sm" data-adel="' + a.id + '">删除</button>' +
                    '</span></div>';
            }).join('');
        }
        function openAnnounceModal(a) {
            /* 新增/编辑公告弹窗，a 为空表示新增 */
            var oldM = document.getElementById('announce-modal');
            if (oldM) oldM.remove();
            a = a || { title: '', content: '', link_url: '', is_active: true };
            var mHtml = '<div class="modal-backdrop" id="announce-modal" style="display:flex">' +
                '<div class="modal" style="max-width:520px"><h3>' + (a.id ? '✏️ 编辑公告' : '＋ 新增公告') + '</h3>' +
                '<p><label>标题<br><input type="text" id="am-title" maxlength="100" style="width:100%" value="' + esc(a.title || '') + '"></label></p>' +
                '<p><label>内容<br><textarea id="am-content" rows="3" style="width:100%">' + esc(a.content || '') + '</textarea></label></p>' +
                '<p><label>链接（可选）<br><input type="text" id="am-link" maxlength="200" style="width:100%" placeholder="community-publish.html" value="' + esc(a.link_url || '') + '"></label></p>' +
                '<p><label><input type="checkbox" id="am-active"' + (a.is_active ? ' checked' : '') + '> 启用显示</label></p>' +
                '<div class="modal-actions"><button class="btn btn-blue" id="am-save">保存</button> ' +
                '<button class="btn btn-ghost" id="am-cancel">取消</button></div></div></div>';
            document.body.insertAdjacentHTML('beforeend', mHtml);
            var modal = document.getElementById('announce-modal');
            document.getElementById('am-cancel').addEventListener('click', function () { modal.remove(); });
            modal.addEventListener('click', function (e) { if (e.target === modal) modal.remove(); });
            document.getElementById('am-save').addEventListener('click', async function () {
                var title = document.getElementById('am-title').value.trim();
                var content = document.getElementById('am-content').value.trim();
                var link = document.getElementById('am-link').value.trim();
                var active = document.getElementById('am-active').checked;
                if (!title) { alert('标题不能为空'); return; }
                var payload = { title: title, content: content, link_url: link || null, is_active: active };
                var r;
                if (a.id) r = await sb.from('site_announcements').update(payload).eq('id', a.id);
                else r = await sb.from('site_announcements').insert(payload);
                if (r.error) { alert('保存失败：' + r.error.message); return; }
                modal.remove();
                await render();
            });
        }
        async function render() {
            wrap.innerHTML =
                '<p class="article-back"><a href="community.html">← 返回社区</a></p>' +
                '<h1 class="section-title">🛡 管理后台</h1>' +
                '<div class="filter-row">' +
                '<button class="filter-chip' + (tab === 'reports' ? ' active' : '') + '" data-tab="reports">举报处理</button>' +
                '<button class="filter-chip' + (tab === 'works' ? ' active' : '') + '" data-tab="works">作品管理</button>' +
                '<button class="filter-chip' + (tab === 'users' ? ' active' : '') + '" data-tab="users">用户列表</button>' +
                '<button class="filter-chip' + (tab === 'announce' ? ' active' : '') + '" data-tab="announce">📢 公告管理</button>' +
                '</div>' +
                (tab === 'works' ? '<p><input type="text" id="admin-q" placeholder="搜索作品标题…" style="max-width:300px"></p>' : '') +
                '<div id="admin-list"><p class="works-note">加载中…</p></div>';
            var list = document.getElementById('admin-list');
            if (tab === 'reports') list.innerHTML = await loadReports();
            else if (tab === 'works') {
                list.innerHTML = await loadWorks('');
                var qi = document.getElementById('admin-q');
                var timer = null;
                qi.addEventListener('input', function () {
                    clearTimeout(timer);
                    timer = setTimeout(async function () { list.innerHTML = await loadWorks(qi.value.trim()); }, 400);
                });
            }
            else if (tab === 'announce') list.innerHTML = await loadAnnounces();
            else list.innerHTML = await loadUsers();
        }
        wrap.addEventListener('click', async function (e) {
            var t = e.target.closest('button[data-tab]');
            if (t) { tab = t.getAttribute('data-tab'); await render(); return; }
            var ig = e.target.closest('button[data-rignore]');
            if (ig) {
                if (!confirm('忽略这条举报？')) return;
                await sb.from('reports').delete().eq('id', ig.getAttribute('data-rignore'));
                await render(); return;
            }
            var dw = e.target.closest('button[data-rdel-work]');
            if (dw) {
                if (!confirm('删除该作品？相关评论/点赞会一起删除。')) return;
                await sb.from('works').delete().eq('id', dw.getAttribute('data-rdel-work'));
                await sb.from('reports').delete().eq('id', dw.getAttribute('data-rid'));
                await render(); return;
            }
            var dc = e.target.closest('button[data-rdel-comment]');
            if (dc) {
                if (!confirm('删除这条评论？')) return;
                await sb.from('comments').delete().eq('id', dc.getAttribute('data-rdel-comment'));
                await sb.from('reports').delete().eq('id', dc.getAttribute('data-rid'));
                await render(); return;
            }
            var aad = e.target.closest('#announce-add');
            if (aad) { openAnnounceModal(null); return; }
            var ae = e.target.closest('button[data-aedit]');
            if (ae) {
                var ar = await sb.from('site_announcements').select('*').eq('id', ae.getAttribute('data-aedit')).single();
                if (ar.data) openAnnounceModal(ar.data);
                return;
            }
            var atg = e.target.closest('button[data-atoggle]');
            if (atg) {
                var toActive = atg.getAttribute('data-active') !== '1';
                await sb.from('site_announcements').update({ is_active: toActive }).eq('id', atg.getAttribute('data-atoggle'));
                await render(); return;
            }
            var ad = e.target.closest('button[data-adel]');
            if (ad) {
                if (!confirm('删除这条公告？')) return;
                await sb.from('site_announcements').delete().eq('id', ad.getAttribute('data-adel'));
                await render(); return;
            }
            var aw = e.target.closest('button[data-adel-work]');
            if (aw) {
                if (!confirm('删除这个作品？相关评论/点赞会一起删除。')) return;
                var dr = await sb.from('works').delete().eq('id', aw.getAttribute('data-adel-work'));
                if (dr.error) alert('删除失败：' + dr.error.message);
                await render(); return;
            }
        });
        await render();
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
