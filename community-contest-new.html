    <main>
        <section class="portfolio" style="max-width:640px">
            <h1 class="section-title">🏁 发起赛事</h1>
            <p class="section-sub">设置赛事信息、投稿时间和投票截止时间。结束后可结算，前三名获得积分奖励。</p>
            <div id="need-login" class="works-note" style="display:none">请先<a href="community-auth.html">登录</a>后发起赛事。</div>
            <form id="contest-form" style="display:none">
                <div class="form-group">
                    <label>赛事标题 *</label>
                    <input type="text" id="f-title" maxlength="60" placeholder="如：暑期游戏创作大赛" required>
                </div>
                <div class="form-group">
                    <label>赛事介绍</label>
                    <textarea id="f-desc" rows="4" maxlength="2000" placeholder="赛事规则、主题要求、评选标准等"></textarea>
                </div>
                <div class="form-group">
                    <label>赛事类别</label>
                    <select id="f-cat">
                        <option>综合</option><option>游戏</option><option>动画</option><option>工具</option><option>音乐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>投稿开始时间 *</label>
                    <input type="datetime-local" id="f-submit-start" required>
                </div>
                <div class="form-group">
                    <label>投稿截止时间 *</label>
                    <input type="datetime-local" id="f-submit-end" required>
                </div>
                <div class="form-group">
                    <label>投票截止时间 *</label>
                    <input type="datetime-local" id="f-vote-end" required>
                </div>
                <div class="form-group">
                    <label>🏆 奖励设置（积分）</label>
                    <div style="display:flex;gap:12px;flex-wrap:wrap">
                        <label style="flex:1;min-width:100px">🥇 冠军<input type="number" id="f-r1" min="0" max="10000" value="100"></label>
                        <label style="flex:1;min-width:100px">🥈 亚军<input type="number" id="f-r2" min="0" max="10000" value="50"></label>
                        <label style="flex:1;min-width:100px">🥉 季军<input type="number" id="f-r3" min="0" max="10000" value="30"></label>
                    </div>
                    <p class="form-hint" id="reward-hint">管理员发布的赛事奖励由系统发放；普通用户发布则从你的积分中锁定扣除，结算后发放给获奖者。</p>
                </div>
                <p class="form-note" id="f-note"></p>
                <button type="submit" class="btn btn-blue" id="f-submit">发布赛事</button>
            </form>
        </section>

    <script src="js/community.min.js?v=20261010a"></script>
    <script>
    (async function () {
        await renderSubHeader();
        var me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        var form = document.getElementById('contest-form');
        form.style.display = '';

        /* 默认时间：明天开始投稿，7天后截止投稿，14天后截止投票 */
        function dtl(d) {
            var p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
        }
        var now = new Date();
        document.getElementById('f-submit-start').value = dtl(new Date(now.getTime() + 86400000));
        document.getElementById('f-submit-end').value = dtl(new Date(now.getTime() + 8 * 86400000));
        document.getElementById('f-vote-end').value = dtl(new Date(now.getTime() + 15 * 86400000));

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var note = document.getElementById('f-note');
            var btn = document.getElementById('f-submit');
            var title = document.getElementById('f-title').value.trim();
            var desc = document.getElementById('f-desc').value.trim();
            var ss = new Date(document.getElementById('f-submit-start').value);
            var se = new Date(document.getElementById('f-submit-end').value);
            var ve = new Date(document.getElementById('f-vote-end').value);
            if (!title) { note.textContent = '请填写标题'; note.className = 'form-note err'; return; }
            if (!(ss < se && se < ve)) { note.textContent = '时间顺序应为：投稿开始 < 投稿截止 < 投票截止'; note.className = 'form-note err'; return; }
            var r1 = Math.max(0, parseInt(document.getElementById('f-r1').value, 10) || 0);
            var r2 = Math.max(0, parseInt(document.getElementById('f-r2').value, 10) || 0);
            var r3 = Math.max(0, parseInt(document.getElementById('f-r3').value, 10) || 0);
            btn.disabled = true; note.textContent = '发布中…'; note.className = 'form-note sending';
            var r = await sb.rpc('create_contest', {
                p_title: title, p_desc: desc, p_cover: null,
                p_submit_start: ss.toISOString(), p_submit_end: se.toISOString(), p_vote_end: ve.toISOString(),
                p_r1: r1, p_r2: r2, p_r3: r3, p_category: document.getElementById('f-cat').value
            });
            if (r.error) { note.textContent = '发布失败：' + r.error.message; note.className = 'form-note err'; btn.disabled = false; return; }
            location.href = 'community-contest.html?id=' + r.data;
        });
    })();
    </script>
