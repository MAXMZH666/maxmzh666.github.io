    <div class="modal-backdrop" id="edit-modal" style="display:none">
        <div class="modal" style="max-width:480px"><h3>✏️ 编辑合集</h3>
            <label>合集标题</label><input type="text" id="ec-title" maxlength="40">
            <label>简介</label><textarea id="ec-desc" rows="3" maxlength="300"></textarea>
            <label>封面图（不换请留空）</label><input type="file" id="ec-cover" accept="image/*">
            <p class="form-note" id="ec-note"></p>
            <div class="modal-actions"><button class="btn" id="ec-cancel" type="button">取消</button>
            <button class="btn btn-blue" id="ec-save" type="button">保存</button></div></div>
    </div>
    <script>
    var cid = new URLSearchParams(location.search).get('id');

    async function load() {
        var wrap = document.getElementById('col-wrap');
        if (!cid) { wrap.innerHTML = '<p class="works-note">缺少合集 ID。</p>'; return; }
        var me = await currentUser();
        try {
            var r = await sb.from('collections').select('*').eq('id', cid).single();
            if (r.error || !r.data) throw new Error('合集不存在');
            var c = r.data;
            var isOwner = me && me.id === c.owner_id;
            var siteAdmin = await isAdmin();
            var canManage = isOwner || siteAdmin;
            var wr = await sb.from('collection_works').select('work_id,position,added_at')
                .eq('collection_id', cid).order('position', { ascending: true });
            var wids = (wr.data || []).map(function (x) { return x.work_id; });
            var wMap = {};
            if (wids.length) {
                var wq = await sb.from('works').select('id,title,cover_url,views,created_at').in('id', wids);
                (wq.data || []).forEach(function (w) { wMap[w.id] = w; });
            }
            var works = (wr.data || []).map(function (x) { return wMap[x.work_id]; }).filter(Boolean);
            var cover = c.cover_url
                ? '<img src="' + esc(c.cover_url) + '" alt="' + esc(c.title) + '" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px" loading="lazy">'
                : '';
            wrap.innerHTML =
                '<p class="article-back"><a href="community-collections.html">← 我的合集</a></p>' +
                cover +
                '<h1 class="section-title" style="margin-top:12px">📚 ' + esc(c.title) + '</h1>' +
                (c.description ? '<p class="section-sub">' + esc(c.description) + '</p>' : '') +
                '<p class="works-note" style="padding:8px 0">' + works.length + ' 件作品 · ' + fmtDate(c.created_at) + '</p>' +
                (canManage ? '<p><button class="btn btn-ghost btn-sm" id="edit-col-btn">✏️ 编辑</button> ' +
                    '<button class="btn btn-ghost btn-sm" id="del-col-btn" style="color:#ff6b6b">🗑️ 删除合集</button></p>' : '') +
                '<div class="card-grid" style="margin-top:16px">' + (works.length ? works.map(function (w) {
                    var wcover = w.cover_url
                        ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                        : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                    return '<div class="card"><a href="community-play.html?id=' + w.id + '">' +
                        '<div class="card-cover">' + wcover + '</div>' +
                        '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                        '<p>' + fmtDate(w.created_at) + ' · 👁 ' + (w.views || 0) + '</p></div></a>' +
                        (canManage ? '<div style="padding:0 12px 12px"><button class="remove-btn" data-rm="' + w.id + '">移除</button></div>' : '') +
                        '</div>';
                }).join('') : '<p class="works-note">合集还是空的，去作品页点「➕ 加入合集」添加吧。</p>') + '</div>';

            if (canManage) {
                wrap.querySelectorAll('[data-rm]').forEach(function (b) {
                    b.addEventListener('click', async function () {
                        if (!confirm('从合集中移除这件作品？')) return;
                        showLoading('移除中…');
                        try {
                            var dr = await withTimeout(
                                sb.from('collection_works').delete().eq('collection_id', cid).eq('work_id', b.getAttribute('data-rm')),
                                15000, '操作超时');
                            if (dr.error) throw dr.error;
                        } catch (e) { alert('移除失败：' + (e.message || '')); }
                        hideLoading();
                        load();
                    });
                });
                document.getElementById('edit-col-btn').addEventListener('click', function () {
                    document.getElementById('ec-title').value = c.title || '';
                    document.getElementById('ec-desc').value = c.description || '';
                    document.getElementById('ec-note').textContent = '';
                    document.getElementById('edit-modal').style.display = 'flex';
                });
                document.getElementById('ec-cancel').addEventListener('click', function () {
                    document.getElementById('edit-modal').style.display = 'none';
                });
                document.getElementById('edit-modal').addEventListener('click', function (e) {
                    if (e.target.id === 'edit-modal') e.target.style.display = 'none';
                });
                document.getElementById('ec-save').addEventListener('click', async function () {
                    var t = document.getElementById('ec-title').value.trim();
                    var d = document.getElementById('ec-desc').value.trim();
                    var n = document.getElementById('ec-note');
                    if (!t) { n.textContent = '请填写标题'; n.className = 'form-note err'; return; }
                    n.textContent = '保存中…'; n.className = 'form-note sending';
                    var payload = { title: t, description: d || null };
                    try {
                        var cf = document.getElementById('ec-cover').files[0];
                        if (cf) {
                            var ext = (cf.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
                            payload.cover_url = await uploadWithProgress('covers', 'collection/' + c.owner_id + '_' + Date.now() + '.' + ext, cf, cf.type || 'image/jpeg', null);
                        }
                        var ur = await sb.from('collections').update(payload).eq('id', cid);
                        if (ur.error) throw ur.error;
                        document.getElementById('edit-modal').style.display = 'none';
                        load();
                    } catch (e) {
                        n.textContent = '保存失败：' + (e.message || '');
                        n.className = 'form-note err';
                    }
                });
                document.getElementById('del-col-btn').addEventListener('click', async function () {
                    if (!confirm('删除合集「' + c.title + '」？其中的作品不会被删除。')) return;
                    if (!confirm('再次确认：真的要删除吗？')) return;
                    showLoading('删除中…');
                    try {
                        var dr = await withTimeout(sb.from('collections').delete().eq('id', cid), 20000, '删除超时');
                        if (dr.error) throw dr.error;
                        location.href = 'community-collections.html';
                    } catch (e) {
                        hideLoading();
                        alert('删除失败：' + (e.message || ''));
                    }
                });
            }
        } catch (e) {
            wrap.innerHTML = '<p class="works-note">' + esc(e.message || '加载失败') + '</p>';
        }
    }
    load();
    </script>
