name: Setup Agar domain (one-time)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ops
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          echo "host key fingerprint: $FP"
          test "$FP" = "SHA256:FhhiN4dO64X6WNnXRYICB/3kFzZpmS089TYUXpDUW9k"

      - name: Upload deploy assets
        run: |
          scp -i ~/.ssh/id_vps -r agar-deploy "$VPS_USER@$VPS_HOST:~/agar-deploy-src"

      - name: Setup domain on VPS
        run: |
          ssh -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'S=$(find ~/agar-deploy-src -name setup-agar-domain.sh | head -1); echo "script: $S"; bash "$S"'
