name: Deploy WS frontend
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ops
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync site only (no admin redeploy)
        run: |
          ssh -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'cd /var/www/maxmzh && git pull --ff-only && git rev-parse --short HEAD'
      - name: Add /ws/ nginx location
        run: |
          scp -i ~/.ssh/id_vps -r admin-backend "$VPS_USER@$VPS_HOST:~/"
          ssh -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'bash ~/admin-backend/deploy-ws-nginx.sh'
      - name: Verify live
        run: |
          echo "page version refs: $(curl -s https://maxmzh.com/community.html | grep -c 'community.min.js?v=20261113a')"
          echo "min has wss: $(curl -s 'https://maxmzh.com/js/community.min.js?v=20261113a' | grep -c 'wss://maxmzh.com/ws/')"
          echo "ws handshake: $(curl -s -o /dev/null -w '%{http_code}' -m 10 -H 'Upgrade: websocket' -H 'Connection: Upgrade' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' -H 'Sec-WebSocket-Version: 13' https://maxmzh.com/ws/)"
