name: Setup auth endpoints (one-off)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ops
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          echo "host key fingerprint: $FP"
          test "$FP" = "SHA256:FhhiN4dO64X6WNnXRYICB/3kFzZpmS089TYUXpDUW9k"

      - name: Prepare auth.env from secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_CODE_SECRET: ${{ secrets.EMAIL_CODE_SECRET }}
        run: |
          umask 077
          { printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'SUPABASE_SERVICE_KEY=%s\n' "$SUPABASE_SERVICE_KEY"
            printf 'EMAIL_CODE_SECRET=%s\n' "$EMAIL_CODE_SECRET"
          } > mmc-api/auth.env.in
          wc -l < mmc-api/auth.env.in

      - name: Deploy auth backend to VPS
        run: |
          scp -i ~/.ssh/id_vps -r mmc-api "$VPS_USER@$VPS_HOST:~/"
          ssh -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'bash ~/mmc-api/deploy-auth.sh'

      - name: Verify public auth endpoint
        run: |
          R=$(curl -s -m 10 -X POST https://maxmzh.com/auth/send-code -H 'Content-Type: application/json' -d '{"email":"bad"}')
          echo "response: $R"
          echo "$R" | grep -q '邮箱格式不正确'

      - name: Sync site (git pull on VPS)
        run: |
          ssh -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'cd /var/www/maxmzh && git pull --ff-only && git rev-parse --short HEAD'
