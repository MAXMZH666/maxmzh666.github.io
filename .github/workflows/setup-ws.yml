name: Setup WS gateway
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ops
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy WS gateway
        run: |
          scp -i ~/.ssh/id_vps -r mmc-api "$VPS_USER@$VPS_HOST:~/"
          ssh -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'bash ~/mmc-api/deploy-ws.sh'
