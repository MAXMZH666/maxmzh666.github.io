    <script>
    /* ===== 随机发现（原发现页融合）：展示6个随机作品卡片，含详情 ===== */
    var _randomPool = [];
    async function renderRandom() {
        var grid = document.getElementById('random-grid');
        if (!grid) return;
        try {
            if (!_randomPool.length) {
                /* 只取 30 条做随机池，比 200 条省 85% 流量 */
                var r = await sb.from('works').select('id,title,cover_url,author_id,category,views,work_type,created_at').limit(30);
                _randomPool = r.data || [];
            }
            if (!_randomPool.length) { grid.innerHTML = '<p class="works-note">还没有作品。</p>'; return; }
            var pool = _randomPool.slice();
            var picked = [];
            while (picked.length < 6 && pool.length) {
                picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
            }
            var nameMap = {};
            try {
                var pr = await sb.from('profiles').select('id,username').in('id', picked.map(function (w) { return w.author_id; }));
                (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
            } catch (e) {}
            var likeMap = {};
            try {
                var lr = await sb.from('likes').select('work_id').in('work_id', picked.map(function (w) { return w.id; }));
                (lr.data || []).forEach(function (l) { likeMap[l.work_id] = (likeMap[l.work_id] || 0) + 1; });
            } catch (e) {}
            grid.innerHTML = picked.map(function (w) {
                var cover = w.cover_url
                    ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy" decoding="async">'
                    : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                    '<div class="card-cover">' + cover + '</div>' +
                    '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                    '<p>' + esc(nameMap[w.author_id] || '未知') + ' · 👁 ' + (w.views || 0) + ' · ❤ ' + (likeMap[w.id] || 0) + '</p>' +
                    '<div class="card-tags">' + typeBadge(workTypeOf(w)) +
                    (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + '</div>' +
                    '</div></a>';
            }).join('');
        } catch (e) { grid.innerHTML = '<p class="works-note">加载失败</p>'; }
    }
    document.addEventListener('DOMContentLoaded', function () {
        var rb = document.getElementById('random-btn');
        if (rb) rb.addEventListener('click', renderRandom);
        renderRandom();
    });

    var state = { q: '', cat: '全部', type: 'all', sort: 'new', tag: '' };
    /* 支持从发现页带参数跳转：?cat=游戏 / ?type=python */
    try {
        var _qp = new URLSearchParams(location.search);
        var _qc = _qp.get('cat'), _qt = _qp.get('type'), _qtag = _qp.get('tag');
        if (_qc) state.cat = _qc;
        if (_qt) state.type = _qt;
        if (_qtag) state.tag = _qtag;
    } catch (e) {}
    var nameMap = {};
    var TYPE_FILTERS = [
        { v: 'all', label: '全部类型' },
        { v: 'scratch', label: '🎮 Scratch' },
        { v: 'python', label: '🐍 Python' },
        { v: 'cpp', label: '⚙️ C++' },
        { v: 'apk', label: '📱 APK' },
        { v: 'windows', label: '🪟 Windows' },
        { v: 'linux', label: '🐧 Linux' },
        { v: 'website', label: '🌐 网站' }
    ];

    function workCard(w, counts, favCounts, tagMap) {
        var cover = w.cover_url
            ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
            : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
        var tagsHtml = (tagMap && tagMap[w.id] ? tagMap[w.id].slice(0, 3).map(function (n) {
            return '<span class="tag">🏷️ ' + esc(n) + '</span>';
        }).join('') : '');
        return '<a class="card" href="community-play.html?id=' + w.id + '">' +
            '<div class="card-cover">' + cover + '</div>' +
            '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
            '<p>' + esc(nameMap[w.author_id] || '未知') + ' · ' + fmtDate(w.created_at) + '</p>' +
            '<div class="card-tags"><span class="tag">❤ ' + (counts[w.id] || 0) + '</span>' +
            '<span class="tag">⭐ ' + ((favCounts && favCounts[w.id]) || 0) + '</span>' +
            '<span class="tag">👁 ' + (w.views || 0) + '</span>' + typeBadge(workTypeOf(w)) +
            (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + tagsHtml + '</div>' +
            '</div></a>';
    }

    async function fillNames(authorIds) {
        try {
            var ids = Array.from(new Set(authorIds));
            if (!ids.length) return;
            var pr = await sb.from('profiles').select('id,username').in('id', ids);
            (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
        } catch (e) {}
    }

    async function countLikes(ids) {
        var counts = {};
        try {
            var lr = await sb.from('likes').select('work_id').in('work_id', ids);
            (lr.data || []).forEach(function (l) { counts[l.work_id] = (counts[l.work_id] || 0) + 1; });
        } catch (e) {}
        return counts;
    }

    async function countFavs(ids) {
        var counts = {};
        try {
            var fr = await sb.from('favorites').select('work_id').in('work_id', ids);
            (fr.data || []).forEach(function (x) { counts[x.work_id] = (counts[x.work_id] || 0) + 1; });
        } catch (e) {}
        return counts;
    }

    function escLike(s) { return s.replace(/[%_\\]/g, function (c) { return '\\' + c; }); }

    /* 列表缓存：60 秒内相同筛选直接读缓存，秒开 */
    function cacheKey() { return 'works_cache_' + state.cat + '_' + state.type + '_' + state.sort + '_' + state.q + '_' + state.tag; }
    function readCache() {
        try {
            var c = JSON.parse(sessionStorage.getItem(cacheKey()) || 'null');
            if (c && Date.now() - c.t < 60000) return c;
        } catch (e) {}
        return null;
    }
    async function loadWorks() {
        var grid = document.getElementById('works-grid');
        var note = document.getElementById('works-note');
        var cached = readCache();
        if (cached) {
            grid.innerHTML = cached.html;
            document.getElementById('list-title').textContent = cached.title;
            note.style.display = 'none';
            return;
        }
        grid.innerHTML = skeletonHtml(6);
        note.style.display = 'none';
        try {
            var tagWorkIds = null;
            if (state.tag) {
                /* 先查标签 id，再查该标签下的作品 id */
                var _tr = await sb.from('tags').select('id').eq('name', state.tag).limit(1);
                if (_tr.data && _tr.data[0]) {
                    var _wr = await sb.from('work_tags').select('work_id').eq('tag_id', _tr.data[0].id);
                    tagWorkIds = (_wr.data || []).map(function (x) { return x.work_id; });
                } else tagWorkIds = [];
            }
            var query = sb.from('works').select('id,title,cover_url,created_at,author_id,category,views,work_type').limit(100);
            if (state.cat !== '全部') query = query.eq('category', state.cat);
            if (state.type !== 'all') query = query.eq('work_type', state.type);
            if (state.q) query = query.ilike('title', '%' + escLike(state.q) + '%');
            if (tagWorkIds) query = query.in('id', tagWorkIds.length ? tagWorkIds : ['00000000-0000-0000-0000-000000000000']);
            query = state.sort === 'views'
                ? query.order('views', { ascending: false })
                : query.order('created_at', { ascending: false });
            var res = await query;
            if (res.error) throw res.error;
            var works = res.data || [];
            var ids = works.map(function (w) { return w.id; });
            var authorIds = works.map(function (w) { return w.author_id; });
            var results = await Promise.all([countLikes(ids), countFavs(ids), fillNames(authorIds), getWorksTags(ids)]);
            var counts = results[0];
            var favCounts = results[1];
            var tagMap = results[3];
            if (state.sort === 'hot') {
                works.sort(function (a, b) { return (counts[b.id] || 0) - (counts[a.id] || 0); });
            }
            if (!works.length) {
                grid.innerHTML = '';
                note.textContent = '没有找到作品，换个条件试试。';
                note.style.display = 'block';
                return;
            }
            grid.innerHTML = works.map(function (w) { return workCard(w, counts, favCounts, tagMap); }).join('');
            var listTitle = state.tag ? '🏷️ ' + state.tag : (state.q ? '搜索：' + state.q : (state.cat === '全部' ? '全部作品' : state.cat));
            document.getElementById('list-title').textContent = listTitle;
            try {
                sessionStorage.setItem(cacheKey(), JSON.stringify({ t: Date.now(), html: grid.innerHTML, title: listTitle }));
            } catch (e) {}
        } catch (e) {
            grid.innerHTML = '';
            note.textContent = '加载失败：' + e.message;
            note.style.display = 'block';
        }
    }

    function skeletonHtml(n) {
        var s = '';
        for (var i = 0; i < n; i++) {
            s += '<div class="skeleton-card"><div class="skeleton skeleton-cover"></div>' +
                '<div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>';
        }
        return s;
    }

    async function loadFeatured() {
        var wrap = document.getElementById('feat-wrap');
        try {
            var res = await cachedQuery('works_feat50', function () {
                return sb.from('works').select('id,title,cover_url,created_at,author_id,category,views,work_type')
                    .order('created_at', { ascending: false }).limit(50);
            });
            var works = res.data || [];
            if (!works.length) return;
            var counts = await countLikes(works.map(function (w) { return w.id; }));
            var favCounts = await countFavs(works.map(function (w) { return w.id; }));
            var top = works.filter(function (w) { return (counts[w.id] || 0) > 0; })
                .sort(function (a, b) { return (counts[b.id] || 0) - (counts[a.id] || 0); })
                .slice(0, 3);
            if (!top.length) return;
            await fillNames(top.map(function (w) { return w.author_id; }));
            document.getElementById('feat-grid').innerHTML = top.map(function (w) { return workCard(w, counts, favCounts); }).join('');
            wrap.style.display = 'block';
        } catch (e) {}
    }

    (async function () {
        await renderSubHeader();
        var chips = document.getElementById('cat-chips');
        chips.innerHTML = ['全部'].concat(WORK_CATEGORIES).map(function (c) {
            return '<button class="filter-chip' + (c === state.cat ? ' active' : '') + '" data-cat="' + c + '">' + c + '</button>';
        }).join('');
        chips.addEventListener('click', function (e) {
            var b = e.target.closest('button[data-cat]');
            if (!b) return;
            state.cat = b.getAttribute('data-cat');
            chips.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
            loadWorks();
        });
        var tChips = document.getElementById('type-chips');
        tChips.innerHTML = TYPE_FILTERS.map(function (t) {
            return '<button class="filter-chip' + (t.v === state.type ? ' active' : '') + '" data-type="' + t.v + '">' + t.label + '</button>';
        }).join('');
        tChips.addEventListener('click', function (e) {
            var b = e.target.closest('button[data-type]');
            if (!b) return;
            state.type = b.getAttribute('data-type');
            tChips.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
            loadWorks();
        });
        /* 🏷️ 热门标签 */
        (async function loadHotTags() {
            try {
                var box = document.getElementById('tag-chips');
                /* 取最近 500 条作品标签关联，统计热度 */
                var r = await sb.from('work_tags').select('tag_id').limit(500);
                var rows = r.data || [];
                if (!rows.length) return;
                var freq = {};
                rows.forEach(function (x) { freq[x.tag_id] = (freq[x.tag_id] || 0) + 1; });
                var topIds = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 12);
                if (!topIds.length) return;
                var tr = await sb.from('tags').select('id,name').in('id', topIds);
                var tmap = {};
                (tr.data || []).forEach(function (t) { tmap[t.id] = t.name; });
                var names = topIds.map(function (id) { return tmap[id]; }).filter(Boolean);
                if (!names.length) return;
                box.style.display = '';
                box.innerHTML = '<span class="chips-label">🏷️</span>' + names.map(function (n) {
                    return '<button class="filter-chip' + (n === state.tag ? ' active' : '') + '" data-tag="' + esc(n) + '">' + esc(n) + '</button>';
                }).join('');
                /* 如果从 ?tag= 进入，高亮对应 chip */
                box.addEventListener('click', function (e) {
                    var b = e.target.closest('button[data-tag]');
                    if (!b) return;
                    var nm = b.getAttribute('data-tag');
                    state.tag = (state.tag === nm) ? '' : nm;
                    box.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-tag') === state.tag); });
                    loadWorks();
                });
            } catch (e) {}
        })();
        document.getElementById('sort-tabs').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-sort]');
            if (!b) return;
            state.sort = b.getAttribute('data-sort');
            this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
            loadWorks();
        });
        function doSearch() {
            state.q = document.getElementById('q').value.trim();
            loadWorks();
        }
        var searchTimer = null;
        document.getElementById('q-btn').addEventListener('click', doSearch);
        document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
        document.getElementById('q').addEventListener('input', function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(doSearch, 400);
        });
        await Promise.all([loadFeatured(), loadWorks()]);
    })();
    </script>
