    <script src="js/scripts.js"></script>

    <script>
    (async function () {
        await renderNavAuth();
        var grid = document.getElementById('works-grid');
        var note = document.getElementById('works-note');
        try {
            var res = await sb.from('works')
                .select('id,title,cover_url,created_at,profiles(username)')
                .order('created_at', { ascending: false });
            if (res.error) throw res.error;
            var works = res.data || [];
            if (!works.length) { note.textContent = '还没有作品，来发布第一个吧！'; return; }
            note.style.display = 'none';
            var ids = works.map(function (w) { return w.id; });
            var counts = {};
            try {
                var lr = await sb.from('likes').select('work_id').in('work_id', ids);
                (lr.data || []).forEach(function (l) { counts[l.work_id] = (counts[l.work_id] || 0) + 1; });
            } catch (e) {}
            grid.innerHTML = works.map(function (w) {
                var cover = w.cover_url
                    ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                    : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                    '<div class="card-cover">' + cover + '</div>' +
                    '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                    '<p>作者：' + esc(w.profiles ? w.profiles.username : '未知') + ' · ' + fmtDate(w.created_at) + '</p>' +
                    '<div class="card-tags"><span class="tag">❤ ' + (counts[w.id] || 0) + '</span><span class="tag blue">试玩</span></div>' +
                    '</div></a>';
            }).join('');
        } catch (e) {
            note.textContent = '加载失败：' + e.message;
        }
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
