    <script>
    (function () {
        var list = document.getElementById('wiki-list');
        var catsBox = document.getElementById('wiki-cats');
        var qInput = document.getElementById('wiki-q');
        var all = [], activeCat = '全部';
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function render() {
            var q = qInput.value.trim().toLowerCase();
            var items = all.filter(function (a) {
                if (activeCat !== '全部' && a.category !== activeCat) return false;
                if (q && (a.title.toLowerCase().indexOf(q) < 0 && (a.content || '').toLowerCase().indexOf(q) < 0)) return false;
                return true;
            });
            var cats = ['全部'];
            all.forEach(function (a) { if (cats.indexOf(a.category) < 0) cats.push(a.category); });
            catsBox.innerHTML = cats.map(function (c) {
                return '<button class="wiki-cat' + (c === activeCat ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
            }).join('');
            catsBox.querySelectorAll('.wiki-cat').forEach(function (b) {
                b.addEventListener('click', function () { activeCat = b.getAttribute('data-cat'); render(); });
            });
            if (!items.length) { list.innerHTML = '<p class="works-note">没有找到相关词条</p>'; return; }
            list.innerHTML = items.map(function (a) {
                var preview = (a.content || '').replace(/[#*`>\-]/g, '').slice(0, 80);
                return '<a class="wiki-item" href="wiki-article.html?slug=' + encodeURIComponent(a.slug) + '">' +
                    '<h3>' + esc(a.title) + '</h3><p>' + esc(preview) + '…</p>' +
                    '<div class="meta">' + esc(a.category) + ' · 更新于 ' + new Date(a.updated_at).toLocaleDateString() + '</div></a>';
            }).join('');
        }
        qInput.addEventListener('input', render);
        sb.from('wiki_articles').select('slug,title,content,category,updated_at').order('updated_at', { ascending: false }).limit(100)
            .then(function (r) {
                if (r.error) throw r.error;
                all = r.data || [];
                render();
            })
            .catch(function () { list.innerHTML = '<p class="works-note">加载失败，请刷新重试</p>'; });
    })();
    </script>
    <script defer src="https://vercount.one/js"></script>
