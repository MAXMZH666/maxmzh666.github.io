    <main>
        <section class="portfolio" style="max-width:640px">
            <h1 class="section-title">🏢 创建工作室</h1>
            <p class="section-sub">创建后你将成为工作室创建者，可以邀请成员、展示团队作品。</p>
            <div id="need-login" class="works-note" style="display:none">请先<a href="community-auth.html">登录</a>后创建工作室。</div>
            <form id="studio-form" style="display:none">
                <div class="form-group">
                    <label>工作室名称 *</label>
                    <input type="text" id="f-name" maxlength="40" placeholder="如：星空游戏组" required>
                </div>
                <div class="form-group">
                    <label>简介</label>
                    <textarea id="f-desc" rows="4" maxlength="500" placeholder="介绍你们的团队、擅长方向等"></textarea>
                </div>
                <div class="form-group">
                    <label>类别</label>
                    <select id="f-cat">
                        <option>综合</option><option>游戏</option><option>动画</option><option>工具</option><option>音乐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>封面图（选填）</label>
                    <input type="file" id="f-cover" accept="image/*">
                </div>
                <p class="form-note" id="f-note"></p>
                <button type="submit" class="btn btn-blue" id="f-submit">创建工作室</button>
            </form>
        </section>

    <script>
    (async function () {
        await renderSubHeader();
        var me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        var form = document.getElementById('studio-form');
        form.style.display = '';

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var note = document.getElementById('f-note');
            var btn = document.getElementById('f-submit');
            var name = document.getElementById('f-name').value.trim();
            var desc = document.getElementById('f-desc').value.trim();
            if (!name) { note.textContent = '请填写工作室名称'; note.className = 'form-note err'; return; }
            btn.disabled = true; note.textContent = '创建中…'; note.className = 'form-note sending';
            var coverUrl = null;
            var coverFile = document.getElementById('f-cover').files[0];
            if (coverFile) {
                note.textContent = '正在上传封面…';
                var ext = (coverFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
                coverUrl = await uploadWithProgress('covers', 'studio/' + me.id + '_' + Date.now() + '.' + ext, coverFile, coverFile.type || 'image/jpeg', null);
            }
            var cat = document.getElementById('f-cat').value;
            var r = await sb.from('studios').insert({ name: name, description: desc, category: cat, cover_url: coverUrl, owner_id: me.id }).select('id').single();
            if (r.error) {
                var msg = r.error.message || '';
                if (/只能创建|只能加入|已加入|已创建/.test(msg)) msg = '⚠️ ' + msg + '：每人只能拥有或加入一个工作室';
                note.textContent = '创建失败：' + msg; note.className = 'form-note err'; btn.disabled = false; return;
            }
            location.href = 'community-studio.html?id=' + r.data.id;
        });
    })();
    </script>
