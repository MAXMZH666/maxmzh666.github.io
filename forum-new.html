    <script>
    (async function () {
        var sb = window.sb, me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('new-form').style.display = '';
        var sel = document.getElementById('f-cat');
        try {
            /* 版块列表与论坛首页共用 10 分钟缓存 */
            var catList = [];
            try {
                var cc = sessionStorage.getItem('forum_cats');
                if (cc) { var cj = JSON.parse(cc); if (cj && (Date.now() - cj.t) < 600000) catList = cj.data || []; }
            } catch (e) {}
            if (!catList.length) {
                var cr = await sb.from('forum_categories').select('*').order('sort_order');
                catList = cr.data || [];
                try { sessionStorage.setItem('forum_cats', JSON.stringify({ t: Date.now(), data: catList })); } catch (e) {}
            }
            catList.forEach(function (c) {
                var o = document.createElement('option');
                o.value = c.id; o.textContent = (c.icon || '') + ' ' + c.name;
                sel.appendChild(o);
            });
            /* 从某个版块点「发新帖」进来时预选该版块 */
            var wantCat = new URLSearchParams(location.search).get('cat');
            if (wantCat) sel.value = wantCat;
        } catch (e) {}
        /* 草稿自动保存（标题/正文/版块存本机，发布成功后清除） */
        var draftKey = 'forum_new_draft';
        function saveDraft() {
            try {
                localStorage.setItem(draftKey, JSON.stringify({
                    t: document.getElementById('f-title').value,
                    c: document.getElementById('f-content').value,
                    cat: sel.value
                }));
                var dEl = document.getElementById('f-draft');
                if (dEl) dEl.textContent = '草稿已自动保存';
            } catch (e) {}
        }
        ['f-title', 'f-content'].forEach(function (fid) {
            document.getElementById(fid).addEventListener('input', saveDraft);
        });
        sel.addEventListener('change', saveDraft);
        /* 版块加载期间就已经输入的内容也存下来；关页前再存一次 */
        if (document.getElementById('f-title').value || document.getElementById('f-content').value) saveDraft();
        window.addEventListener('beforeunload', saveDraft);
        try {
            var dj = JSON.parse(localStorage.getItem(draftKey) || 'null');
            if (dj && (dj.t || dj.c)) {
                if (dj.t) document.getElementById('f-title').value = dj.t;
                if (dj.c) document.getElementById('f-content').value = dj.c;
                if (dj.cat) sel.value = dj.cat;
                var dEl2 = document.getElementById('f-draft');
                if (dEl2) dEl2.textContent = '已恢复上次未发完的草稿';
            }
        } catch (e) {}
        /* Markdown 预览 */
        document.getElementById('f-preview-btn').addEventListener('click', function () {
            var box = document.getElementById('f-preview');
            if (box.style.display !== 'none') { box.style.display = 'none'; this.textContent = '👁 预览'; return; }
            var t = document.getElementById('f-title').value.trim();
            var c = document.getElementById('f-content').value;
            box.innerHTML = (t ? '<h3 style="margin:0 0 10px">' + esc(t) + '</h3>' : '') + md(c || '（暂无内容）');
            box.style.display = ''; this.textContent = '收起预览';
        });
        document.getElementById('new-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var title = document.getElementById('f-title').value.trim();
            var content = document.getElementById('f-content').value.trim();
            var msg = document.getElementById('f-msg'), btn = document.getElementById('f-submit');
            if (!title) { msg.textContent = '请填写标题'; return; }
            if (!content) { msg.textContent = '请填写正文'; return; }
            btn.disabled = true; msg.textContent = '发布中…';
            try {
                var tr = await sb.from('forum_threads').insert({
                    category_id: sel.value, author_id: me.id, title: title
                }).select('id').single();
                if (tr.error) throw tr.error;
                var pr = await sb.from('forum_posts').insert({
                    thread_id: tr.data.id, author_id: me.id, content: content
                });
                if (pr.error) throw pr.error;
                try { localStorage.removeItem(draftKey); } catch (e) {}
                try { await recordTaskProgress('post_thread', 1); } catch (e) {}
                try { await sendMentions(title + '\n' + content, me.id, tr.data.id, 'thread'); } catch (e) {}
                if (window.Growth) await Growth.awardExp(sb, me.id, 10, '发布主题', 'thread:' + tr.data.id);
                location.href = 'forum-thread.html?id=' + tr.data.id;
            } catch (err) { msg.textContent = '发布失败：' + err.message; btn.disabled = false; }
        });
    })();
        try { var fh = document.getElementById('f-mdhelp'); if (fh) fh.innerHTML = mdHelpBtn('f-content'); } catch (e) {}
</script>
    <script>
    /* 论坛账号区：登录走 MAX 账号登录页（同源 login.html，不跳社区登录界面）；已登录显示用户名和退出 */
    (function () {
        var el = document.getElementById('sub-auth');
        if (!el || !window.sb) return;
        function escn(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function render() {
            window.sb.auth.getSession().then(function (r) {
                var s = r && r.data && r.data.session;
                if (!s) { el.innerHTML = '<a href="login.html?next=' + encodeURIComponent(location.href) + '">登录</a>'; return; }
                window.sb.from('profiles').select('username').eq('id', s.user.id).single().then(function (pr) {
                    var name = (pr.data && pr.data.username) || (s.user.email || '').split('@')[0];
                    el.innerHTML = '<a href="https://maxmzh.com/community-user.html?username=' + encodeURIComponent(name) + '">' + escn(name) + '</a> · <a href="#" id="sub-logout">退出</a>';
                    var lo = document.getElementById('sub-logout');
                    if (lo) lo.addEventListener('click', function (e) { e.preventDefault(); window.sb.auth.signOut().then(function () { location.reload(); }); });
                });
            }).catch(function () {});
        }
        render();
        try { window.sb.auth.onAuthStateChange(render); } catch (e) {}
    })();
    </script>
