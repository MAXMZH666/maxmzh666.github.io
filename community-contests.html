    <script>
    function fmtDT(s) {
        if (!s) return '';
        var d = new Date(s);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
            String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    var contestTab = 'hot', contestCat = '';
    var allContests = [], contestEntryCounts = {};
    function renderContests() {
        var order = { submitting: 0, voting: 1, upcoming: 2, ended: 3 };
        var list = allContests.filter(function (c) { return !contestCat || (c.category || '综合') === contestCat; });
        if (contestTab === 'hot') {
            list.sort(function (a, b) { return (contestEntryCounts[b.id] || 0) - (contestEntryCounts[a.id] || 0); });
        } else {
            list.sort(function (a, b) {
                var d = order[contestStatus(a)] - order[contestStatus(b)];
                return d !== 0 ? d : new Date(b.created_at) - new Date(a.created_at);
            });
        }
        if (!list.length) {
            document.getElementById('contest-list').innerHTML = '<p class="works-note">这个类别还没有赛事，来发起第一个吧！</p>';
            return;
        }
        document.getElementById('contest-list').innerHTML = '<div class="contest-grid">' +
            list.map(function (c) {
                var st = contestStatus(c);
                var cover = c.cover_url
                    ? '<div class="contest-cover"><img src="' + esc(c.cover_url) + '" alt=""></div>'
                    : '<div class="contest-cover">🏁</div>';
                return '<a class="contest-card" href="community-contest.html?id=' + c.id + '">' + cover +
                    '<div class="contest-body"><span class="status-tag ' + st + '">' + CONTEST_STATUS_TEXT[st] + '</span>' +
                    '<div class="contest-title">' + esc(c.title) + '</div>' +
                    '<div class="contest-meta">📁 ' + (contestEntryCounts[c.id] || 0) + ' 件投稿 · ' + esc(c.category || '综合') +
                    '<br>投稿 ' + fmtDT(c.submit_start) + ' ~ ' + fmtDT(c.submit_end) +
                    '<br>投票截止 ' + fmtDT(c.vote_end) + '</div></div></a>';
            }).join('') + '</div>';
    }
    async function load() {
        var r = await sb.from('contests').select('*').order('created_at', { ascending: false }).limit(100);
        allContests = r.data || [];
        var ids = allContests.map(function (c) { return c.id; });
        contestEntryCounts = {};
        if (ids.length) {
            var er = await sb.from('contest_entries').select('contest_id').in('contest_id', ids);
            (er.data || []).forEach(function (e) { contestEntryCounts[e.contest_id] = (contestEntryCounts[e.contest_id] || 0) + 1; });
        }
        renderContests();
    }
    document.querySelectorAll('#contest-tabs [data-ctab]').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#contest-tabs [data-ctab]').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            contestTab = b.getAttribute('data-ctab');
            renderContests();
        });
    });
    document.querySelectorAll('#contest-cats [data-ccat]').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#contest-cats [data-ccat]').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            contestCat = b.getAttribute('data-ccat');
            renderContests();
        });
    });

    (async function () {
        await renderSubHeader();
        await load();
    })();
    </script>
