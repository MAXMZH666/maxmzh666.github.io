        .status-tag.voting { background: rgba(255,212,59,.15); color: #ffd43b; }

    <script>
    function fmtDT(s) {
        if (!s) return '';
        var d = new Date(s);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
            String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    async function load() {
        var r = await sb.from('contests').select('*').order('created_at', { ascending: false }).limit(50);
        var list = r.data || [];
        if (!list.length) {
            document.getElementById('contest-list').innerHTML = '<p class="works-note">还没有赛事，来发起第一个吧！</p>';
            return;
        }
        /* 按状态分组：进行中优先 */
        var order = { submitting: 0, voting: 1, upcoming: 2, ended: 3 };
        list.sort(function (a, b) { return order[contestStatus(a)] - order[contestStatus(b)]; });
        document.getElementById('contest-list').innerHTML = '<div class="contest-grid">' +
            list.map(function (c) {
                var st = contestStatus(c);
                var cover = c.cover_url
                    ? '<div class="contest-cover"><img src="' + esc(c.cover_url) + '" alt=""></div>'
                    : '<div class="contest-cover">🏁</div>';
                return '<a class="contest-card" href="community-contest.html?id=' + c.id + '">' + cover +
                    '<div class="contest-body"><span class="status-tag ' + st + '">' + CONTEST_STATUS_TEXT[st] + '</span>' +
                    '<div class="contest-title">' + esc(c.title) + '</div>' +
                    '<div class="contest-meta">投稿 ' + fmtDT(c.submit_start) + ' ~ ' + fmtDT(c.submit_end) +
                    '<br>投票截止 ' + fmtDT(c.vote_end) + '</div></div></a>';
            }).join('') + '</div>';
    }

    (async function () {
        await renderSubHeader();
        await load();
    })();
    </script>
