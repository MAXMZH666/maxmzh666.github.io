    <script>
    (async function () {
        await renderSubHeader();
        var sb = window.sb;
        var tagName = '';
        try { tagName = new URLSearchParams(location.search).get('name') || ''; } catch (e) {}
        tagName = tagName.trim();
        var title = document.getElementById('tag-title'), note = document.getElementById('tag-note');
        var grid = document.getElementById('tag-grid');
        if (!tagName) {
            title.textContent = '🏷️ 标签';
            note.textContent = '请指定标签名。';
            return;
        }
        title.textContent = '🏷️ ' + tagName;
        try {
            showLoading('加载中…');
            /* 查标签 id */
            var tr = await sb.from('tags').select('id').eq('name', tagName).limit(1);
            if (!tr.data || !tr.data.length) {
                note.textContent = '还没有人使用这个标签。';
                grid.innerHTML = '';
                return;
            }
            var tagId = tr.data[0].id;
            /* 该标签下的作品 */
            var wr = await sb.from('work_tags').select('work_id').eq('tag_id', tagId);
            var workIds = (wr.data || []).map(function (x) { return x.work_id; });
            if (!workIds.length) {
                note.textContent = '该标签下还没有作品。';
                grid.innerHTML = '';
                return;
            }
            var res = await sb.from('works')
                .select('id,title,cover_url,created_at,author_id,category,views,work_type')
                .in('id', workIds).order('created_at', { ascending: false });
            if (res.error) throw res.error;
            var works = res.data || [];
            note.textContent = '共 ' + works.length + ' 件作品';
            if (!works.length) { grid.innerHTML = ''; return; }
            /* 作者名 + 点赞数 + 标签 */
            var nameMap = {};
            var pr = await sb.from('profiles').select('id,username').in('id', works.map(function (w) { return w.author_id; }));
            (pr.data || []).forEach(function (p) { nameMap[p.id] = p.username; });
            var lr = await sb.from('likes').select('work_id').in('work_id', workIds);
            var counts = {};
            (lr.data || []).forEach(function (l) { counts[l.work_id] = (counts[l.work_id] || 0) + 1; });
            var tagMap = await getWorksTags(workIds);
            grid.innerHTML = works.map(function (w) {
                var cover = w.cover_url
                    ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '" loading="lazy">'
                    : '<span class="monogram">' + esc((w.title || '游').charAt(0)) + '</span>';
                var tagsHtml = (tagMap[w.id] || []).slice(0, 3).map(function (n) {
                    return '<span class="tag">🏷️ ' + esc(n) + '</span>';
                }).join('');
                return '<a class="card" href="community-play.html?id=' + w.id + '">' +
                    '<div class="card-cover">' + cover + '</div>' +
                    '<div class="card-body"><h3>' + esc(w.title) + '</h3>' +
                    '<p>' + esc(nameMap[w.author_id] || '未知') + ' · ' + fmtDate(w.created_at) + '</p>' +
                    '<div class="card-tags"><span class="tag">❤ ' + (counts[w.id] || 0) + '</span>' +
                    '<span class="tag">👁 ' + (w.views || 0) + '</span>' + typeBadge(workTypeOf(w)) +
                    (w.category ? '<span class="tag blue">' + esc(w.category) + '</span>' : '') + tagsHtml + '</div>' +
                    '</div></a>';
            }).join('');
            /* 相关标签：同作品的其他标签 */
            var relNames = {};
            Object.keys(tagMap).forEach(function (wid) {
                (tagMap[wid] || []).forEach(function (n) { if (n !== tagName) relNames[n] = 1; });
            });
            var rel = Object.keys(relNames).slice(0, 10);
            if (rel.length) {
                var box = document.getElementById('related-tags');
                box.style.display = '';
                box.innerHTML = '<span class="chips-label">相关：</span>' + rel.map(function (n) {
                    return '<a class="filter-chip" href="community-tag.html?name=' + encodeURIComponent(n) + '">' + esc(n) + '</a>';
                }).join('');
            }
        } catch (e) {
            note.textContent = '加载失败：' + e.message;
        } finally {
            hideLoading();
        }
    })();
    </script>
