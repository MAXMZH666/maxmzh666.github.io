    <style>
        .form-row { margin-bottom: 16px; }
        .form-row label { display: block; margin-bottom: 6px; font-weight: 600; }
        .form-row input[type=text], .form-row textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border, rgba(255,255,255,.12));
            background: var(--card, rgba(255,255,255,.03)); color: inherit; font-size: 1rem; box-sizing: border-box;
        }
        .form-row textarea { min-height: 100px; resize: vertical; }
        .avatar-preview { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border, rgba(255,255,255,.12)); display: block; margin-bottom: 10px; background: var(--card); }
        .btn-submit { padding: 12px 32px; border-radius: 10px; border: none; background: var(--accent, #4d7cfe); color: #fff; font-size: 1rem; cursor: pointer; }
        .btn-submit:disabled { opacity: .5; cursor: default; }
        .hint { font-size: .82rem; color: var(--muted); }
    </style>

<body>
    <header class="site-header">
        <nav class="nav" aria-label="主导航">
            <a class="brand" href="index.html"><img src="logo.png" alt="MAXMZH"></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>
                <button class="nav-toggle" aria-expanded="false" aria-label="打开菜单">☰</button>
            </div>
            <ul class="nav-links">

                <li><a href="about.html">个人简介</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="community-home.html" class="active">社区</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </nav>
    </header>
    <div class="sub-header">
        <div class="sub-header-inner">
            <a class="sub-brand" href="community-home.html">🎮 <span>MAX社区</span></a>
            <nav class="sub-links" aria-label="社区导航">
                <a href="community-home.html" data-sub="home">首页</a>
                <a href="community.html" data-sub="works">🔍 发现</a>
                <a href="community-forum.html" data-sub="forum">💬 论坛</a>
                <a href="community-studios.html" data-sub="studios">🏢 工作室</a>
                <a href="community-shop.html" data-sub="shop">🎁 任务商城</a>
                <a href="community-contests.html" data-sub="contests">🏁 赛事</a>
                <a href="community-moderation.html" data-sub="moderation">⚖️ 共建</a>
                <a href="community-publish.html" data-sub="publish">🚀 发布</a>
                <span id="sub-auth"><a href="community-auth.html">登录</a></span>
            </nav>
        </div>
    </div>

    <main>
        <section class="portfolio" style="max-width:640px">
            <p class="article-back"><a href="community-user.html" id="back-link">← 返回我的主页</a></p>
            <h1 class="section-title">✏️ 编辑个人资料</h1>
            <div id="need-login" class="works-note" style="display:none">请先<a href="community-auth.html">登录</a>后再编辑资料。</div>
            <form id="edit-form" style="display:none">
                <div class="form-row">
                    <label>头像</label>
                    <img class="avatar-preview" id="avatar-preview" alt="头像预览">
                    <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/gif,image/webp">
                    <p class="hint">支持 png/jpg/gif/webp，建议正方形，上传后自动保存到头像栏。</p>
                    <p class="hint" id="avatar-msg"></p>
                </div>
                <div class="form-row">
                    <label for="f-username">昵称</label>
                    <input type="text" id="f-username" maxlength="20" placeholder="2-20 个字符">
                    <p class="hint" id="username-msg"></p>
                </div>
                <div class="form-row">
                    <label for="f-bio">简介</label>
                    <textarea id="f-bio" maxlength="200" placeholder="介绍一下自己吧（最多 200 字）"></textarea>
                </div>
                <button type="submit" class="btn-submit" id="f-submit">保存</button>
                <span id="f-msg" class="works-note" style="display:inline"></span>
            </form>
        </section>
    </main>

    <footer>
        <div class="foot-links">
            <a href="index.html">主页</a>
            <a href="about.html">个人简介</a>

            <a href="community-forum.html">论坛</a>
            <a href="contact.html">联系方式</a>
            <a href="https://github.com/MAXMZH666" target="_blank" rel="noopener">GitHub</a>
        </div>

        <p>本站托管于 GitHub Pages</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/community.js?v=20261004g"></script>
    <script src="js/scripts.js"></script>
    <script>
    (async function () {
        await renderSubHeader();
        var sb = window.sb, me = await currentUser();
        if (!me) { document.getElementById('need-login').style.display = ''; return; }
        document.getElementById('edit-form').style.display = '';
        document.getElementById('back-link').href = 'community-user.html?id=' + me.id;
        var prof = await currentProfile();
        var origName = prof ? prof.username : '';
        /* 读当前资料（含新字段；字段未建时容错） */
        var cur = {};
        try {
            var pr = await sb.from('profiles').select('username,avatar_url,bio').eq('id', me.id).single();
            if (!pr.error && pr.data) cur = pr.data;
        } catch (e) {}
        document.getElementById('f-username').value = cur.username || origName || '';
        document.getElementById('f-bio').value = cur.bio || '';
        var preview = document.getElementById('avatar-preview');
        var avatarUrl = cur.avatar_url || '';
        if (avatarUrl) preview.src = avatarUrl;
        else preview.style.display = 'none';
        /* 头像选择后立即上传 */
        document.getElementById('avatar-file').addEventListener('change', async function () {
            var f = this.files[0];
            var msg = document.getElementById('avatar-msg');
            if (!f) return;
            if (!/^image\/(png|jpeg|gif|webp)$/.test(f.type)) { msg.textContent = '只支持 png/jpg/gif/webp 图片'; return; }
            if (f.size > 2 * 1024 * 1024) { msg.textContent = '头像不能超过 2MB'; return; }
            msg.textContent = '上传中…';
            try {
                var ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
                var key = 'avatars/' + me.id + '/' + Date.now() + '.' + ext;
                var url = await uploadWithProgress('covers', key, f, f.type, null);
                avatarUrl = url;
                preview.src = url; preview.style.display = '';
                msg.textContent = '上传成功，点保存后生效';
            } catch (e) { msg.textContent = '上传失败：' + e.message; }
        });
        /* 保存 */
        document.getElementById('edit-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var name = document.getElementById('f-username').value.trim();
            var bio = document.getElementById('f-bio').value.trim();
            var msg = document.getElementById('f-msg'), umsg = document.getElementById('username-msg');
            var btn = document.getElementById('f-submit');
            umsg.textContent = '';
            if (name.length < 2 || name.length > 20) { umsg.textContent = '昵称需要 2-20 个字符'; return; }
            btn.disabled = true; msg.textContent = '保存中…';
            try {
                if (name !== origName) {
                    var ck = await sb.from('profiles').select('id').eq('username', name).limit(1);
                    if (ck.data && ck.data.length && ck.data[0].id !== me.id) throw new Error('这个昵称已经被用了，换一个吧');
                }
                var up = await sb.from('profiles').update({ username: name, bio: bio, avatar_url: avatarUrl }).eq('id', me.id);
                if (up.error) throw up.error;
                msg.textContent = '已保存';
                setTimeout(function () { location.href = 'community-user.html?id=' + me.id; }, 800);
            } catch (err) { msg.textContent = '保存失败：' + err.message; btn.disabled = false; }
        });
    })();
    </script>
</body>
</html>
