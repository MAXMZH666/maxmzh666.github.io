    <script>
    (async function () {
        var sb = window.sb, catId = '', sort = 'new';
        var cats = [], catMap = {};
        var unameCache = {};
        /* 版块列表 10 分钟缓存，避免每次进论坛都重复查询 */
        async function loadCats() {
            try {
                var c = sessionStorage.getItem('forum_cats');
                if (c) { var j = JSON.parse(c); if (j && (Date.now() - j.t) < 600000) return j.data || []; }
            } catch (e) {}
            var cr = await sb.from('forum_categories').select('*').order('sort_order');
            var data = cr.data || [];
            try { sessionStorage.setItem('forum_cats', JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
            return data;
        }
        function updNewBtn() {
            var bn = document.getElementById('btn-new');
            if (bn) bn.href = catId ? 'forum-new.html?cat=' + catId : 'forum-new.html';
        }
        /* 版块 */
        try {
            cats = await loadCats();
            cats.forEach(function (c) { catMap[c.id] = c; });
            var tabs = document.getElementById('cat-tabs');
            cats.forEach(function (c) {
                var b = document.createElement('button');
                b.setAttribute('data-cat', c.id);
                b.textContent = (c.icon || '💬') + ' ' + c.name;
                b.addEventListener('click', function () {
                    catId = c.id;
                    tabs.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
                    b.classList.add('active');
                    updNewBtn();
                    load();
                });
                tabs.appendChild(b);
            });
            tabs.querySelector('[data-cat=""]').addEventListener('click', function () {
                catId = '';
                tabs.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
                this.classList.add('active');
                updNewBtn();
                load();
            });
            /* 在论坛页内点导航「专栏」链接只变 hash 不刷新，监听 hash 切换版块 */
            window.addEventListener('hashchange', function () {
                var hc = (location.hash || '').replace('#cat-', '');
                var target = (hc && catMap[hc]) ? tabs.querySelector('[data-cat="' + hc + '"]') : tabs.querySelector('[data-cat=""]');
                if (target && !target.classList.contains('active')) target.click();
            });
            /* #cat-<id> 深链：导航「MAX编程社区专栏」直达对应版块 */
            var hcat = (location.hash || '').replace('#cat-', '');
            if (hcat && catMap[hcat]) {
                var hb = tabs.querySelector('[data-cat="' + hcat + '"]');
                if (hb) hb.click();
            }
        } catch (e) {}
        /* 排序 */
        document.getElementById('sort-tabs').querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function () {
                sort = b.getAttribute('data-sort');
                document.getElementById('sort-tabs').querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                load();
            });
        });
        async function load() {
            var note = document.getElementById('forum-note'), list = document.getElementById('thread-list');
            note.textContent = '加载中…'; list.innerHTML = '';
            try {
                var q = sb.from('forum_threads').select('id,title,category_id,author_id,created_at,updated_at,views,reply_count,is_pinned,is_locked');
                if (catId) q = q.eq('category_id', catId);
                q = q.order('is_pinned', { ascending: false });
                q = sort === 'hot' ? q.order('reply_count', { ascending: false }) : q.order('updated_at', { ascending: false });
                var r = await q.limit(50);
                if (r.error) throw r.error;
                var ts = r.data || [];
                if (!ts.length) { note.textContent = '还没有帖子，来发第一帖吧！'; return; }
                note.textContent = '';
                var aids = Array.from(new Set(ts.map(function (t) { return t.author_id; }))).filter(function (a) { return !unameCache[a]; });
                var unames = unameCache;
                if (aids.length) {
                    var pr = await sb.from('profiles').select('id,username').in('id', aids);
                    (pr.data || []).forEach(function (p) { unames[p.id] = p.username; });
                }
                list.innerHTML = ts.map(function (t) {
                    var c = catMap[t.category_id] || {};
                    return '<a class="thread-row" href="forum-thread.html?id=' + t.id + '">' +
                        '<div class="t-title">' + (t.is_pinned ? '<span class="pin-badge">📌 </span>' : '') + esc(t.title) + '</div>' +
                        '<div class="t-meta"><span class="tag">' + esc((c.icon || '') + ' ' + (c.name || '综合')) + '</span>' +
                        '<span>' + esc(unames[t.author_id] || '未知') + '</span>' +
                        '<span>💬 ' + t.reply_count + '</span><span>👁 ' + t.views + '</span>' +
                        (t.is_locked ? '<span class="lock-badge">🔒 已锁定</span>' : '') +
                        '<span>' + fmtDate(t.updated_at) + '</span></div></a>';
                }).join('');
            } catch (e) { note.textContent = '加载失败：' + e.message; }
        }
        load();
    })();
    </script>
    <script>
    /* 论坛账号区：登录走 MAX 账号登录页（同源 login.html，不跳社区登录界面）；已登录显示用户名和退出 */
    (function () {
        var el = document.getElementById('sub-auth');
        if (!el || !window.sb) return;
        function escn(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function render() {
            window.sb.auth.getSession().then(function (r) {
                var s = r && r.data && r.data.session;
                if (!s) { el.innerHTML = '<a href="login.html?next=' + encodeURIComponent(location.href) + '">登录</a>'; return; }
                window.sb.from('profiles').select('username').eq('id', s.user.id).single().then(function (pr) {
                    var name = (pr.data && pr.data.username) || (s.user.email || '').split('@')[0];
                    el.innerHTML = '<a href="https://maxmzh.com/community-user.html?username=' + encodeURIComponent(name) + '">' + escn(name) + '</a> · <a href="#" id="sub-logout">退出</a>';
                    var lo = document.getElementById('sub-logout');
                    if (lo) lo.addEventListener('click', function (e) { e.preventDefault(); window.sb.auth.signOut().then(function () { location.reload(); }); });
                });
            }).catch(function () {});
        }
        render();
        try { window.sb.auth.onAuthStateChange(render); } catch (e) {}
    })();
    </script>
