    <style>
        .thread-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; margin-bottom: 10px; text-decoration: none; color: inherit; background: var(--card, rgba(255,255,255,.02)); }
        .thread-row:hover { border-color: var(--accent, #4d7cfe); text-decoration: none; }
        .t-ava { width: 42px; height: 42px; border-radius: 50%; flex: none; object-fit: cover; }
        .t-ava-fallback { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#4d7cfe,#6d5cff); color: #fff; font-weight: 700; font-size: 1.05rem; }
        .t-main { flex: 1; min-width: 0; }
        .thread-row .t-title { display: block; font-size: 1.02rem; font-weight: 600; margin-bottom: 6px; word-break: break-word; }
        .thread-row .t-meta { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .75rem; line-height: 1.5; background: rgba(77,124,254,.16); color: #9db9ff; }
        .chip-pin { background: rgba(255,93,93,.16); color: #ff9d9d; }
        .chip-lock { background: rgba(255,255,255,.1); color: var(--muted); }
        .t-side { flex: none; text-align: center; min-width: 44px; }
        .t-rcount { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
        .t-rlabel { display: block; font-size: .72rem; color: var(--muted); }
        .t-views { display: block; font-size: .72rem; color: var(--muted); margin-top: 4px; }
        .forum-topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .btn-new { padding: 10px 20px; border-radius: 10px; border: none; background: var(--accent, #4d7cfe); color: #fff; font-size: .95rem; cursor: pointer; text-decoration: none; display: inline-block; flex: none; }
        .tabs-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; max-width: 100%; }
        .tabs-scroll::-webkit-scrollbar { display: none; }
        .tabs-scroll button { flex: none; white-space: nowrap; }
        .cat-n { font-size: .72rem; opacity: .75; }
        .forum-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        .forum-search { display: flex; gap: 8px; flex: 1; min-width: 220px; max-width: 460px; }
        .forum-search input { flex: 1; min-width: 0; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--card, rgba(255,255,255,.03)); color: inherit; font-size: .92rem; }
        .forum-search button { padding: 9px 18px; border-radius: 999px; border: 1px solid var(--border, rgba(255,255,255,.12)); background: var(--surface-2, #1d1d25); color: inherit; cursor: pointer; flex: none; }
        .forum-stats { text-align: center; color: var(--muted); font-size: .85rem; margin: -18px 0 22px; }
        .empty-box { text-align: center; padding: 44px 16px; border: 1px dashed var(--border, rgba(255,255,255,.14)); border-radius: 12px; color: var(--muted); }
        .empty-box .btn-new { margin-top: 14px; }
        @media (max-width: 640px) { .t-ava { width: 36px; height: 36px; } .t-side { min-width: 36px; } }
    </style>

    <script>
    (async function () {
        var sb = window.sb, catId = '', sort = 'new', kw = '';
        var favMode = new URLSearchParams(location.search).get('fav') === '1';
        var favIds = null;
        if (favMode) { var st0 = document.querySelector('.section-title'); if (st0) st0.textContent = '⭐ 我的收藏'; }
        async function ensureFavs() {
            if (favIds !== null) return;
            try {
                var s = await sb.auth.getSession();
                var u = s && s.data && s.data.session && s.data.session.user;
                if (!u) { favIds = []; return; }
                var fr = await sb.from('forum_favorites').select('thread_id').eq('user_id', u.id);
                favIds = (fr.data || []).map(function (r) { return r.thread_id; });
            } catch (e) { favIds = []; }
        }
        var lastReplyMap = {};
        var cats = [], catMap = {};
        var unameCache = {};
        /* 版块列表 10 分钟缓存，避免每次进论坛都重复查询 */
        async function loadCats() {
            try {
                var c = sessionStorage.getItem('forum_cats');
                if (c) { var j = JSON.parse(c); if (j && (Date.now() - j.t) < 600000) return j.data || []; }
            } catch (e) {}
            var cr = await sb.from('forum_categories').select('*').order('sort_order');
            var data = cr.data || [];
            try { sessionStorage.setItem('forum_cats', JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
            return data;
        }
        function updNewBtn() {
            var bn = document.getElementById('btn-new');
            if (bn) bn.href = catId ? 'forum-new.html?cat=' + catId : 'forum-new.html';
        }
        /* 相对时间（对标参考站的「发布于 x 天前」） */
        function relTime(iso) {
            var d = Date.now() - new Date(iso).getTime();
            if (isNaN(d) || d < 60000) return '刚刚';
            if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
            if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
            if (d < 2592000000) return Math.floor(d / 86400000) + ' 天前';
            return fmtDate(iso);
        }
        /* 全站统计 + 各版块帖子数（一次轻量查询） */
        async function loadStats() {
            try {
                var r = await sb.from('forum_threads').select('category_id,views').limit(1000);
                var rows = r.data || [], counts = {}, views = 0;
                rows.forEach(function (t) { counts[t.category_id] = (counts[t.category_id] || 0) + 1; views += t.views || 0; });
                var st = document.getElementById('forum-stats');
                if (st) st.textContent = '共 ' + rows.length + ' 个主题 · ' + cats.length + ' 个版块 · ' + views + ' 次浏览';
                document.querySelectorAll('#cat-tabs button').forEach(function (b) {
                    var n = b.querySelector('.cat-n');
                    if (n) n.textContent = ' ' + (b.getAttribute('data-cat') ? (counts[b.getAttribute('data-cat')] || 0) : rows.length);
                });
            } catch (e) {}
        }
        /* 版块 */
        try {
            cats = await loadCats();
            cats.forEach(function (c) { catMap[c.id] = c; });
            var tabs = document.getElementById('cat-tabs');
            cats.forEach(function (c) {
                var b = document.createElement('button');
                b.setAttribute('data-cat', c.id);
                b.innerHTML = esc((c.icon || '💬') + ' ' + c.name) + '<span class="cat-n"></span>';
                b.addEventListener('click', function () {
                    catId = c.id;
                    tabs.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
                    b.classList.add('active');
                    updNewBtn();
                    load();
                });
                tabs.appendChild(b);
            });
            tabs.querySelector('[data-cat=""]').addEventListener('click', function () {
                catId = '';
                tabs.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
                this.classList.add('active');
                updNewBtn();
                load();
            });
            /* 在论坛页内点导航「专栏」链接只变 hash 不刷新，监听 hash 切换版块 */
            window.addEventListener('hashchange', function () {
                var hc = (location.hash || '').replace('#cat-', '');
                var target = (hc && catMap[hc]) ? tabs.querySelector('[data-cat="' + hc + '"]') : tabs.querySelector('[data-cat=""]');
                if (target && !target.classList.contains('active')) target.click();
            });
            /* #cat-<id> 深链：导航「MAX编程社区专栏」直达对应版块 */
            var hcat = (location.hash || '').replace('#cat-', '');
            if (hcat && catMap[hcat]) {
                var hb = tabs.querySelector('[data-cat="' + hcat + '"]');
                if (hb) hb.click();
            }
            loadStats();
        } catch (e) {}
        /* 排序 */
        document.getElementById('sort-tabs').querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function () {
                sort = b.getAttribute('data-sort');
                document.getElementById('sort-tabs').querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                load();
            });
        });
        /* 标题搜索 */
        function doSearch() {
            kw = document.getElementById('q').value.trim().replace(/[%_\\]/g, '');
            load();
        }
        document.getElementById('btn-refresh').addEventListener('click', function () { try { loadCats(); } catch (e) {} try { loadStats(); } catch (e) {} load(); });
        document.getElementById('q-btn').addEventListener('click', doSearch);
        document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
        var page = 0, PAGE_SIZE = 50;
        async function fetchProfs(ts) {
            var aids = Array.from(new Set(ts.map(function (t) { return t.author_id; }))).filter(function (a) { return !unameCache[a]; });
            if (aids.length) {
                var pr = await sb.from('profiles').select('id,username,avatar_url').in('id', aids);
                (pr.data || []).forEach(function (p) { unameCache[p.id] = p; });
            }
        }
        function threadRow(t) {
            var c = catMap[t.category_id] || {};
            var p = unameCache[t.author_id] || {};
            var name = p.username || '未知';
            var ava = p.avatar_url
                ? '<img class="t-ava" src="' + esc(p.avatar_url) + '" alt="" loading="lazy">'
                : '<span class="t-ava t-ava-fallback">' + esc(name.slice(0, 1).toUpperCase()) + '</span>';
            var lastTxt = '';
            if (t.reply_count > 0) {
                var lr0 = lastReplyMap[t.id];
                var lname = lr0 && unameCache[lr0.author_id] ? unameCache[lr0.author_id].username : '';
                lastTxt = '<span>最后回复' + (lname ? ' ' + esc(lname) : '') + ' · ' + relTime(t.updated_at) + '</span>';
            }
            return '<a class="thread-row" href="forum-thread.html?id=' + t.id + '">' + ava +
                '<span class="t-main"><span class="t-title">' +
                (t.is_pinned ? '<span class="chip chip-pin">📌 置顶</span> ' : '') + esc(t.title) +
                (t.is_locked ? ' <span class="chip chip-lock">🔒 锁定</span>' : '') + '</span>' +
                '<span class="t-meta"><span class="chip">' + esc((c.icon || '') + ' ' + (c.name || '综合')) + '</span>' +
                '<span>' + esc(name) + '</span>' +
                '<span>发布于 ' + relTime(t.created_at) + '</span>' +
                lastTxt +
                '</span></span>' +
                '<span class="t-side"><span class="t-rcount">' + t.reply_count + '</span><span class="t-rlabel">回复</span><span class="t-views">👁 ' + t.views + '</span></span></a>';
        }
        async function load(reset) {
            if (reset === undefined) reset = true;
            var note = document.getElementById('forum-note'), list = document.getElementById('thread-list');
            var moreWrap = document.getElementById('more-wrap');
            if (reset) { page = 0; note.textContent = '加载中…'; list.innerHTML = ''; if (moreWrap) moreWrap.hidden = true; }
            try {
                var q = sb.from('forum_threads').select('id,title,category_id,author_id,created_at,updated_at,views,reply_count,is_pinned,is_locked');
                if (favMode) {
                    await ensureFavs();
                    if (!favIds.length) {
                        if (reset) {
                            note.textContent = '';
                            list.innerHTML = '<div class="empty-box">还没有收藏的帖子。打开任意帖子，点「☆ 收藏」就能收进来。<br><a class="btn-new" href="forum.html">去逛逛</a></div>';
                        }
                        if (moreWrap) moreWrap.hidden = true;
                        return;
                    }
                    q = q.in('id', favIds);
                }
                if (catId) q = q.eq('category_id', catId);
                if (kw) q = q.ilike('title', '%' + kw + '%');
                q = q.order('is_pinned', { ascending: false });
                if (sort === 'hot') q = q.order('reply_count', { ascending: false }).order('updated_at', { ascending: false });
                else if (sort === 'fresh') q = q.order('created_at', { ascending: false });
                else if (sort === 'old') q = q.order('created_at', { ascending: true });
                else q = q.order('updated_at', { ascending: false });
                var from = page * PAGE_SIZE;
                var r = await q.range(from, from + PAGE_SIZE - 1);
                if (r.error) throw r.error;
                var ts = r.data || [];
                if (!ts.length) {
                    if (reset) {
                        note.textContent = '';
                        list.innerHTML = '<div class="empty-box">' + (kw ? '没有找到标题含「' + esc(kw) + '」的帖子，换个关键词试试。' : '还没有帖子，来发第一帖吧！') + '<br><a class="btn-new" href="' + (catId ? 'forum-new.html?cat=' + catId : 'forum-new.html') + '">✏️ 发新帖</a></div>';
                    }
                    if (moreWrap) moreWrap.hidden = true;
                    return;
                }
                note.textContent = '';
                await fetchProfs(ts);
                if (ts.length) {
                    var lr = await sb.from('forum_posts').select('thread_id,author_id,created_at').in('thread_id', ts.map(function (t) { return t.id; })).order('created_at', { ascending: false }).limit(300);
                    var seen = {};
                    (lr.data || []).forEach(function (r) { if (!seen[r.thread_id]) seen[r.thread_id] = r; });
                    ts.forEach(function (t) { if (seen[t.id]) lastReplyMap[t.id] = seen[t.id]; });
                    var rids = Array.from(new Set(Object.keys(seen).map(function (k) { return seen[k].author_id; }))).filter(function (a) { return !unameCache[a]; });
                    if (rids.length) {
                        var rp = await sb.from('profiles').select('id,username,avatar_url').in('id', rids);
                        (rp.data || []).forEach(function (p) { unameCache[p.id] = p; });
                    }
                }
                list.insertAdjacentHTML('beforeend', ts.map(threadRow).join(''));
                if (moreWrap) moreWrap.hidden = ts.length < PAGE_SIZE;
            } catch (e) { note.textContent = '加载失败：' + e.message; }
        }
        document.getElementById('btn-more').addEventListener('click', function () { page++; load(false); });
        load();
    })();
    </script>
    <script>
    /* 论坛账号区：登录走 MAX 账号登录页（同源 login.html，不跳社区登录界面）；已登录显示用户名和退出 */
    (function () {
        var el = document.getElementById('sub-auth');
        if (!el || !window.sb) return;
        function escn(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function render() {
            window.sb.auth.getSession().then(function (r) {
                var s = r && r.data && r.data.session;
                if (!s) { el.innerHTML = '<a href="login.html?next=' + encodeURIComponent(location.href) + '">登录</a>'; return; }
                window.sb.from('profiles').select('username').eq('id', s.user.id).single().then(function (pr) {
                    var name = (pr.data && pr.data.username) || (s.user.email || '').split('@')[0];
                    el.innerHTML = '<a href="https://maxmzh.com/community-user.html?username=' + encodeURIComponent(name) + '">' + escn(name) + '</a> · <a href="#" id="sub-logout">退出</a>';
                    var lo = document.getElementById('sub-logout');
                    if (lo) lo.addEventListener('click', function (e) { e.preventDefault(); window.sb.auth.signOut().then(function () { location.reload(); }); });
                });
            }).catch(function () {});
        }
        render();
        try { window.sb.auth.onAuthStateChange(render); } catch (e) {}
    })();
    </script>
